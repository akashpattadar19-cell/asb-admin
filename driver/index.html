<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0A2A47">
<title>ASB Driver</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ASB Driver">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter+Tight:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* ASB Driver: a road-going dashboard. Navy cab, signal-gold accents, one card per instrument. */
:root{
  --cab:#0B2439; --cab-2:#16517F; --cab-ink:#EEF5FB; --gold:#FFAF1A; --gold-2:#FFC94D; --gold-ink:#2A1A00;
  --bg:#E9ECF1; --card:#FFFFFF; --ink:#0D1B28; --muted:#5B6B7B; --line:#DCE3EB; --sunk:#F2F5F9;
  --good:#0E9D62; --good-soft:#E3F6EC; --bad:#D63A2C; --bad-soft:#FCE7E4; --info:#2A6FD0; --info-soft:#E7F0FB;
  --shadow:0 14px 34px -16px rgba(11,36,57,.30); --shadow-sm:0 3px 12px -5px rgba(11,36,57,.20);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter Tight","Hind Siliguri","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#06121E; --card:#0E2334; --ink:#E7EEF5; --muted:#93A6B8; --line:#20394E; --sunk:#0A1C2B;
  --good:#5FCB97; --good-soft:#123222; --bad:#F08A7E; --bad-soft:#3B1814; --info:#86BCF0; --info-soft:#13304B;
  --shadow:0 16px 36px -18px rgba(0,0,0,.6); --shadow-sm:0 3px 12px -5px rgba(0,0,0,.45); color-scheme:dark}}
:lang(bn){--f-body:"Hind Siliguri","Inter Tight",system-ui,sans-serif}
:lang(ar){--f-body:"IBM Plex Sans Arabic","Inter Tight",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--f-display);font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}
.neg{color:var(--bad)} .pos{color:var(--good)}

/* ── Login ── */
.login{min-height:100%;display:flex;flex-direction:column;background:var(--cab);color:var(--cab-ink)}
.login-top{padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:flex-end}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 20px 30px;position:relative}
.logo-badge{width:132px;height:132px;border-radius:34px;background:linear-gradient(160deg,#fff,#EAF1FB);display:grid;place-items:center;box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.6)}
.logo-badge img{width:90%;height:90%;object-fit:contain}
.brand h1{margin:0;font:700 30px/1 var(--f-display);letter-spacing:.08em}
.brand p{margin:0;opacity:.75;font-size:13.5px;letter-spacing:.04em}
.road{position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--gold) 0 24px,transparent 24px 44px);opacity:.9}
.sheet{flex:1;background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:520px;width:100%;margin:0 auto}
.sheet h2{margin:0;font:600 24px var(--f-display);letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{border:1.5px solid var(--line);background:var(--sunk);border-radius:14px;padding:14px 16px;font:600 22px var(--f-display);letter-spacing:.12em;width:100%}
.field input:focus{outline:none;border-color:var(--cab-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.dots{display:flex;gap:14px;justify-content:center;padding:4px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);transition:background .15s,border-color .15s}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{border:0;background:var(--sunk);border-radius:16px;height:58px;font:600 26px var(--f-display);color:var(--ink)}
.pad button:active{background:color-mix(in srgb,var(--gold) 35%,var(--sunk))}
.pad .ghost{background:none;font-size:15px;font-family:var(--f-body);font-weight:500;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* compact login: everything fits on one phone screen without scrolling */
.login{height:100dvh;min-height:0;overflow:hidden}
.login .brand{flex-direction:row;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 20px;justify-content:flex-start}
.login .logo-badge{width:clamp(62px,9.5vh,84px);height:clamp(62px,9.5vh,84px);border-radius:22px;flex:none;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.login .brand-t{flex:1;min-width:0}
.login .brand h1{font-size:clamp(19px,3vh,24px);letter-spacing:.06em;white-space:nowrap}
.login .brand p{font-size:12.5px;margin-top:4px}
.login .langs{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);inset-inline-end:12px;transform:scale(.86);transform-origin:top right}
.login .brand{padding-top:calc(env(safe-area-inset-top,0px) + 34px)}
.login .road{height:4px}
.login .sheet{gap:clamp(8px,2vh,18px);padding-top:clamp(14px,2.4vh,22px);border-radius:24px 24px 0 0;overflow:hidden}
.login .sheet h2{font-size:clamp(19px,2.8vh,23px)}
.login .field{gap:4px}
.login .field input{padding:clamp(8px,1.4vh,13px) 14px;font-size:clamp(18px,2.6vh,21px);border-radius:12px}
.login .dots{padding:2px 0}
.login .dots i{width:14px;height:14px}
.login .pad{gap:clamp(6px,1vh,10px)}
.login .pad button{height:clamp(44px,7.4vh,62px);font-size:clamp(21px,3.1vh,26px);border-radius:14px}
.login .sheet{justify-content:center}
.login .sheet>.row{padding-top:2px}
.login .brand{min-height:0}
.login .row{font-size:13.5px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.su-new{text-align:center;font-size:14px;color:var(--muted);margin-top:2px}
.check input{width:20px;height:20px;accent-color:var(--cab-2)}
.link{background:none;border:0;color:var(--info);font-weight:600;font-size:14px;padding:6px 0}
.msg{border-radius:12px;padding:10px 12px;font-size:14px}
.msg.err{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--good-soft);color:var(--good)}
.langs{display:flex;gap:4px}
.langs button{border:1px solid rgba(255,255,255,.35);background:none;color:inherit;border-radius:8px;padding:4px 9px;font-size:12.5px}
.langs button[aria-pressed="true"]{background:var(--cab-ink);color:var(--cab)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── App shell ── */
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--cab-2),var(--cab));color:var(--cab-ink);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;box-shadow:0 8px 22px -10px rgba(10,33,57,.55)}
.av{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--gold-2),var(--gold));color:var(--gold-ink);display:grid;place-items:center;font:700 21px var(--f-display);flex:none;box-shadow:0 5px 14px -3px rgba(255,175,26,.5)}
.who{min-width:0;flex:1}
.who b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font:600 19px/1.15 var(--f-display);letter-spacing:.02em;overflow:hidden;overflow-wrap:anywhere}
.who small{opacity:.8;font-size:12.5px;display:flex;gap:8px;align-items:center}
.plate{display:inline-flex;border:1.5px solid currentColor;border-radius:4px;overflow:hidden;font:600 11.5px var(--f-display);letter-spacing:.05em}
.plate i{font-style:normal;background:currentColor;padding:0 3px}
.plate i span{color:var(--cab);font-size:8.5px}
.card .plate i span{color:var(--card)}
.plate em{font-style:normal;padding:0 6px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:none;color:inherit;display:grid;place-items:center;flex:none}
.iconbtn svg{width:15px;height:15px}
.bellbtn{position:relative}
.iconbtn img.ib{width:24px;height:24px;display:block}
.cb .dd{display:inline-block;margin-inline-start:8px;background:none;border:0;color:inherit;opacity:.75;font-size:12px;padding:0}
.cb .dd.ask{opacity:1;font-weight:700;color:var(--gold-2)}

.tgc .cb{max-width:80%;padding:7px 10px 5px;border-radius:14px;font-size:15px;color:#fff}
.tgc .cb.me,.tgc .cb.off{color:#fff}
.tgc .cb.me{background:#2B5278;border-end-end-radius:4px}.tgc .cb.off{background:#182533;border-end-start-radius:4px}
.tgc .cb small{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;opacity:.6;margin-top:2px}
.tgc .cb .dd{margin:0;font-size:11px}
.dmimg{display:block;max-width:100%;width:230px;border-radius:10px;margin-bottom:4px;object-fit:cover}.dmph{width:230px;height:150px;border-radius:10px;background:rgba(255,255,255,.08);margin-bottom:4px}
.dmzoom{position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.92);display:grid;place-items:center}.dmzoom img{max-width:100%;max-height:100%}
.tgc-in{display:flex;gap:8px;align-items:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tgc-pill{flex:1;display:flex;align-items:flex-end;background:#17212B;border-radius:24px;padding:2px 6px 2px 14px;min-height:48px}
.tgc-pill textarea{flex:1;min-height:44px;max-height:120px;border:0;background:none;color:#fff;font:inherit;font-size:16px;resize:none;padding:11px 0;outline:none}
.tgc-pill textarea::placeholder{color:#7D8E9E}
.tgc-clip{width:42px;height:46px;display:grid;place-items:center;cursor:pointer;border:0;background:none;font-size:21px;color:#9BB0C2;filter:grayscale(1) brightness(1.6)}
.tgc-send{width:48px;height:48px;flex:none;border:0;border-radius:50%;background:#2AABEE;color:#fff;font-size:20px;display:grid;place-items:center}
.chat{display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.cb{max-width:82%;padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.cb small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.cb.me{align-self:flex-end;background:var(--cab-2,#2F6FD6);color:#fff;border-end-end-radius:5px}
.cb.off{align-self:flex-start;background:var(--sunk,#eef1f5);color:var(--ink,#111);border-end-start-radius:5px}
.chat-in{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg,#fff);padding:8px 0}
.chat-in textarea{flex:1;min-height:44px;max-height:120px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;resize:none}
.chat-in .btn{flex:none;width:auto;padding:0 18px;height:44px}
.bell-n{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#E5484D;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--cab,#0A2A47)}
.ntc-list,.ntc-home{display:flex;flex-direction:column;gap:8px}
.ntc-home{margin-bottom:12px}
.ntc{display:flex;gap:12px;align-items:center;width:100%;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;color:inherit;font:inherit}
.ntc.unread{border-color:var(--gold);background:linear-gradient(0deg,rgba(242,189,69,.10),rgba(242,189,69,.10)),var(--card)}
.ntc-ic{width:38px;height:38px;border-radius:11px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--ink)}
.ntc-ic{color:#fff}
.ntc-ic.k-perf{background:linear-gradient(135deg,#8B6CF0,#2F6FD6)} .ntc-ic.k-orders{background:linear-gradient(135deg,#F7B531,#EE6A1F)}
.ntc-ic.k-salary{background:linear-gradient(135deg,#2BC48A,#13895A)} .ntc-ic.k-due{background:linear-gradient(135deg,#F59E5B,#E5484D)} .ntc-ic.k-fuel{background:linear-gradient(135deg,#22B8CF,#1C7ED6)} .ntc-ic.k-msg{background:linear-gradient(135deg,#3B82F6,#1E4FA8)}
.ntc-ic svg{width:15px;height:15px}
.ntc-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ntc-t b{font-weight:700} .ntc-t small{color:var(--muted);font-size:13px} .ntc-t em{font-style:normal;color:var(--muted);font-size:12px}
.iconbtn.busy svg{animation:sp 1s linear infinite}
main{flex:1;padding:14px max(14px,env(safe-area-inset-right,0px)) 96px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0;box-shadow:var(--shadow-sm)}
.card h3{margin:0 0 10px;font:600 13px var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font:600 30px/1.1 var(--f-display)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:12px;padding:11px 4px;font-weight:600;font-size:13.5px;color:var(--muted);display:flex;gap:7px;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.hero{background:radial-gradient(135% 130% at 88% -15%, #1E5E97 0%, var(--cab) 58%), linear-gradient(135deg,var(--cab),var(--cab-2));color:var(--cab-ink);border:0;position:relative;overflow:hidden;border-radius:24px;box-shadow:0 18px 40px -18px rgba(10,33,57,.6)}
.hero::after{content:"";position:absolute;inset:auto -44px -54px auto;width:196px;height:196px;border-radius:50%;border:16px solid rgba(255,175,26,.20);box-shadow:inset 0 0 60px rgba(255,175,26,.16)}
.hero-wm{position:absolute;inset:0;background:var(--wm) center 50%/auto 86% no-repeat;opacity:.5;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 25%,#000 75%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 25%,#000 75%,transparent 100%)}
.hero::before{content:"";position:absolute;inset:auto -84px -94px auto;width:272px;height:272px;border-radius:50%;border:1px solid rgba(255,255,255,.10)}
.hero .rank{font:700 66px/0.88 var(--f-display);color:var(--gold);text-shadow:0 2px 24px rgba(255,175,26,.4)}
.hero .lbl{color:rgba(243,246,250,.7)}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:relative;z-index:1}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);position:relative;z-index:1}
.gauge{display:flex;gap:16px;align-items:center}
.gauge svg{width:92px;height:92px;flex:none}
.bar{height:8px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--cab-2);border-radius:6px}
.bar.over span{background:var(--bad)}
.tbar{height:10px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:10px}
.tbar span{display:block;height:100%;background:var(--gold);border-radius:8px}
.tbar.done span{background:#5FCB97}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:16px;padding:14px 16px;font-weight:600;width:100%;text-align:start;color:var(--ink)}
.new{background:var(--gold);color:var(--gold-ink);border-radius:16px;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;width:100%;text-align:start}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.u-next{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft,rgba(201,154,46,.14));font-weight:600;font-size:14px}
.u-next svg{width:15px;height:15px;flex:none}
.u-grid{display:grid;grid-template-columns:34px 1fr 1fr;gap:10px 12px;align-items:center}
.u-grid .bigg{width:30px;height:30px;font-size:16px;border-radius:9px}
.u-grid .mine{outline:3px solid var(--gold);outline-offset:2px}
.pos{color:var(--good)}
.li.me{background:var(--info-soft);margin:0 -16px;padding-inline:16px}
.li .t{min-width:0}
.li .t b{display:block;font-weight:600}
.li .t small{color:var(--muted);font-size:13px;display:block;overflow-wrap:anywhere}
.li .v{text-align:end;white-space:nowrap}
.medal{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:700 14px var(--f-display);background:var(--sunk);border:1px solid var(--line);flex:none}
.medal.m1{background:var(--gold);color:var(--gold-ink);border:0}
.medal.m2{background:#C9D2DB;color:#1E2B36;border:0}
.medal.m3{background:#D9A574;color:#2A1606;border:0}
.ph{display:inline-block;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk)}
.ph-i{display:inline-grid;place-items:center;background:var(--cab-2);color:var(--gold);font-family:var(--f-display);font-weight:700}
.top .ph{flex:none}
.hero-grid .rank{font-size:52px;line-height:.95}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:6px 0 4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.pod b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .num{font-size:20px}
.pod-ph{position:relative}
.pod-ph .ph{border:3px solid var(--line)}
.pod1 .pod-ph .ph{border-color:var(--gold)}
.pod-ph .medal{position:absolute;bottom:-6px;inset-inline-end:-6px;width:26px;height:26px;font-size:13px}
.pod-me b{color:var(--info)}
.step{width:100%;border-radius:10px 10px 0 0;background:var(--sunk);margin-top:4px}
.pod1 .step{height:46px;background:color-mix(in srgb,var(--gold) 28%,var(--sunk))}
.pod2 .step{height:30px}
.pod3 .step{height:20px}
.bn-ov{position:fixed;inset:0;z-index:9000;background:rgba(8,20,36,.78);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.bn-card{width:100%;max-width:440px;margin:auto;border-radius:28px;padding:22px 20px 16px;color:#fff;text-align:center;position:relative;overflow:hidden;box-shadow:0 24px 60px #0007;animation:bnpop .45s ease}
@keyframes bnpop{from{transform:scale(.92);opacity:0}}
.bn-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.3),transparent 60%);pointer-events:none}
.bn-card>*{position:relative}.bn-sal{font-size:15px;font-weight:700;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.16);margin-bottom:12px}
.bn-med{font-size:60px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}.bn-card h2{font-size:22px;margin:10px 0 6px;line-height:1.3;color:#fff}.bn-card p{font-size:14.5px;line-height:1.65;opacity:.96}
.bn-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.bn-chips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 14px;font-weight:700;font-size:13.5px}
.bn-dua{margin-top:14px;font-size:13.5px;font-weight:600;opacity:.95}.bn-hint{font-size:11.5px;opacity:.75;margin-top:8px}
.bn-sura{text-align:center}.bn-li.bn-sura div.bn-ay{display:block;margin:9px 0}.bn-li.bn-sura .bn-aya{display:block;text-align:center}.bn-li.bn-sura .bn-tr{font-size:19px;font-weight:700;line-height:1.7;text-align:center}.bn-aya{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;font-size:23px;line-height:1.9;font-weight:700;display:block;margin:0}.bn-ay small{margin-top:0}
.bn-jum{background:linear-gradient(160deg,#06352a,#0f7a55 55%,#d7b24a)}
.bn-t3{background:linear-gradient(160deg,#3a2400,#b7791f 45%,#f6c453)}.bn-t10{background:linear-gradient(160deg,#0b2a5c,#1769c9 60%,#4fb3ff)}.bn-oth{background:linear-gradient(160deg,#0b4a3a,#14946b 60%,#6fe0b0)}
.bn-warn{background:linear-gradient(160deg,#4a0d12,#c2312f 60%,#f08a4b);padding:26px 20px 18px;min-height:68vh}
.bn-gb{width:64px;height:64px;border-radius:20px;background:#fff;color:#c2312f;font:800 36px/64px Inter,sans-serif;margin:0 auto;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.bn-sub{font-weight:800;font-size:14px;text-align:start;margin:14px 2px 2px}.bn-li{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;margin-top:8px;text-align:start}
.bn-li div{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}.bn-li small{display:block;font-size:12.5px;line-height:1.5;opacity:.92;margin-top:3px}
.t3home .hero{background:radial-gradient(130% 120% at 85% -20%,#f6c453 0%,#b7791f 45%,#3a2400 100%)!important;box-shadow:0 18px 44px -14px rgba(246,196,83,.55)!important}
.t3home .hero .rank{color:#fff8dc!important;text-shadow:0 2px 22px rgba(255,220,120,.8)}

@keyframes egfly{0%{opacity:0;transform:translateX(0)}10%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(var(--w))}}
@keyframes egflap{to{rotate:-6deg}}
.t3-badge{position:absolute;right:14px;bottom:14px;z-index:2;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:16px;background:linear-gradient(135deg,#fff3c4,#f6c453);color:#4a2f00;box-shadow:0 8px 20px rgba(0,0,0,.35);font-size:14px}
.t3-badge span{font-size:22px;animation:t3bob 2s ease-in-out infinite}.t3-badge em{font-style:normal;font-weight:800;background:#4a2f00;color:#fff3c4;border-radius:8px;padding:1px 7px}
@keyframes t3bob{50%{transform:translateY(-3px) rotate(-8deg)}}
.t3-strip{border-radius:20px;padding:14px 16px;margin-bottom:12px;color:#fff8dc;background:linear-gradient(135deg,#5a3a00,#b7791f);border:1px solid rgba(246,196,83,.6);font-size:13.5px;line-height:1.6}
.t3-strip b{display:block;font-size:15px;margin-bottom:4px;color:#ffe08a}
.hm-wrap{display:flex;flex-direction:column;gap:9px}
.t3home{display:flex;flex-direction:column;gap:9px}
.t3home .tile{border-color:rgba(246,196,83,.5)!important;box-shadow:0 8px 22px -12px rgba(246,196,83,.6)}
.t3home .card:not(.hero){border-color:rgba(246,196,83,.28)}
.pf-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.pf-grade{display:flex;gap:10px;align-items:center}
.bigg{display:grid;place-items:center;width:58px;height:58px;border-radius:16px;font:700 34px var(--f-display);color:#fff}
.g-a{background:#1D8358} .g-b{background:#2F6FB5} .g-c{background:#C98C14} .g-d{background:#C0392B} .g-x{background:#7A8794}
.pf-rank{min-width:0;border-inline-start:1px solid var(--line);padding-inline-start:16px}
.warnv{color:#B26A00}
.pf-date{display:inline-block;margin:-4px 0 10px;padding:4px 10px;border-radius:9px;background:var(--info-soft);color:var(--info);font-size:13px;font-weight:600}
.pf-past{margin:0 4px 10px;padding:10px 12px;border-radius:12px;background:#FFF6E3;color:#7A5200;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.subhead .cal-btn{margin-inline-start:auto;width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:18px;color:var(--ink)} .subhead .cal-btn.on{background:var(--info-soft);border-color:var(--info)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px} .cal-h .iconbtn.sm{width:34px;height:34px;border:1px solid var(--line);color:var(--ink);font-size:18px} .cal-h .iconbtn:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w{font-size:11px;color:var(--muted);padding:2px 0}
.cal-d{height:38px;display:grid;place-items:center;border-radius:10px;font-size:14px;color:var(--muted);opacity:.45;border:0;background:none;font:inherit}
.cal-d.on{opacity:1;color:var(--ink);background:var(--sunk);font-weight:700;cursor:pointer}
.cal-d.sel{background:var(--cab-2,#1F4E78);color:#fff}
.lbl.asof{color:var(--gold)}
.ch-card{padding:14px} .ch-list{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:14px} .ch-list s{opacity:.8}
.ch-act{font-size:12px;font-weight:700;padding:1px 8px;border-radius:8px;background:var(--sunk)} .ch-create{color:var(--good)} .ch-delete{color:var(--bad)} .ch-update{color:var(--info)}
.ch-reason{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--info-soft);font-size:14px}
.ch-q{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--sunk);font-size:14px} .ch-a{margin-top:4px;color:var(--good)}
.ep{display:flex;flex-direction:column;gap:12px} .ep h3{margin:0}
.ep-f{display:flex;flex-direction:column;gap:5px} .ep-f span{font-size:12.5px;font-weight:600;color:var(--muted)}
.ep-f input{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:12px;padding:12px 14px;font:500 16px var(--f-body);width:100%}
.ep-f input:focus{outline:none;border-color:var(--cab-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.ep-f .ep-ro{border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:12px 14px;font:600 16px var(--f-body);width:100%}
.ep-locknote{font-size:12px;margin:-2px 2px 2px;opacity:.9}
.ep-f select{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:12px;padding:12px 14px;font:500 16px var(--f-body);width:100%;appearance:none;-webkit-appearance:none}
.ep-f select:focus{outline:none;border-color:var(--cab-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.card-wrap{display:flex;align-items:stretch;border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;overflow:hidden}
.card-wrap .card-pre{display:flex;align-items:center;padding:0 12px;background:color-mix(in srgb,var(--line) 45%,transparent);color:var(--muted);font:600 15px var(--f-body);white-space:nowrap}
.card-wrap input{border:none;background:transparent;color:var(--ink);padding:12px 14px;font:600 17px var(--f-body);width:100%;letter-spacing:.04em}
.card-wrap input:focus{outline:none}
.card-wrap:focus-within{border-color:var(--cab-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.loc-consent{justify-content:center;gap:18px;padding:24px 16px} .loc-list{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.loc-alert{margin-bottom:12px;background:#FFF4E5;border-color:#F0C17A;color:#5A3B00}
.ph-cam{position:absolute;bottom:-4px;left:calc(50% + 34px);width:36px;height:36px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.rp-cats{display:flex;flex-wrap:wrap;gap:6px} .rp-cats button{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--f-body)}
.rp-cats button[aria-pressed="true"]{background:var(--cab-2);border-color:var(--cab-2);color:#fff}
.rp-ta{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:15px var(--f-body);background:var(--sunk);color:var(--ink)}
.pill.rp-NEW{background:#E7EEF8;color:#1F4E8C}.pill.rp-PENDING{background:#FFF1D6;color:#8A5A00}.pill.rp-APPROVED{background:#DDF5E6;color:#14703D}.pill.rp-REJECTED{background:#FDE3E3;color:#A1262B}
.tg-pos{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--f-display);background:var(--sunk);color:var(--muted)}
.tg-pos.tg-top{background:linear-gradient(145deg,var(--gold-2),var(--gold));color:var(--gold-ink)}
.tg-mypos{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.tg-mypos b{font:700 20px var(--f-display)} .tg-mypos small{font-weight:600;opacity:.7}
.hl-wrap{position:relative;margin:0 0 12px}
.hl{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;cursor:pointer;color:#3A2A05;
  background:linear-gradient(100deg,#FFE9A8,#F2BD45 55%,#E0A526);border-radius:16px;padding:13px 40px 13px 14px;
  box-shadow:0 6px 16px rgba(224,165,38,.33);overflow:hidden;position:relative}
.hl::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:hlsheen 3.6s ease-in-out infinite}
@keyframes hlsheen{0%{left:-60%}55%,100%{left:130%}}
.hl-ic{font-size:22px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.hl-txt{display:flex;flex-direction:column;min-width:0;z-index:1}
.hl-txt b{font:700 15px var(--f-display,inherit);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-txt small{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-x{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:8px;width:26px;height:26px;border:0;border-radius:50%;
  background:rgba(58,42,5,.14);color:#3A2A05;font-size:13px;cursor:pointer;display:grid;place-items:center;z-index:2}
.ch-askbox{margin-top:10px;display:flex;flex-direction:column;gap:8px} .ch-askbox textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--sunk);color:var(--ink)}
.fuel-card{display:block;width:100%;text-align:start;color:inherit;font:inherit;border:1px solid var(--line)}

#camOv{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;color:#fff}
#camOv .ch{padding:14px 16px 10px;display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.6)}
#camOv .ch svg{width:54px;height:54px;flex:none;color:#F2BD45}
#camOv .ch b{display:block;font-size:15px;line-height:1.3}#camOv .ch small{opacity:.75;font-size:12px}
#camOv .cv{flex:1;min-height:0;position:relative;background:#000}
#camOv video,#camOv img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#camOv .cf{display:flex;justify-content:space-around;align-items:center;padding:16px 10px calc(18px + env(safe-area-inset-bottom));background:rgba(0,0,0,.6)}
#camOv .cf button{border:0;border-radius:50%;width:56px;height:56px;font-size:22px;color:#fff;background:#3a4654}
#camOv .cf .shut{width:70px;height:70px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
#camOv .cf .ok{background:#1F9D63;width:64px;height:64px}
#camOv .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:15px}
.sw{display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--sunk);cursor:pointer}
.sw i{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw.on{color:#fff;background:#D9542B;border-color:#D9542B}.sw.on i{background:rgba(255,255,255,.35)}.sw.on i::after{inset-inline-start:16px}
.fp-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.inet-rows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.inet-rows span{display:flex;flex-direction:column;gap:2px}
.inet-rows small{color:var(--muted);font-size:12px}
.inet-rows b{font:600 15px var(--f-body)}
.fp-mini span{background:var(--sunk);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.fp-mini small{color:var(--muted);font-size:11.5px} .fp-mini b{font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;text-align:start;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .12s ease}
.tile:active{transform:translateY(1px) scale(.99)}
.tile-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tile-ic{width:46px;height:46px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;color:#fff}
.tile[data-sub="vehicle"] .tile-ic{background:linear-gradient(135deg,#4C8DF6,#2457A6);box-shadow:0 6px 14px rgba(36,87,166,.3)}.tile[data-sub="vcond"] .tile-ic{background:linear-gradient(135deg,#F28B5B,#D4572A);box-shadow:0 6px 14px rgba(212,87,42,.3)}.vph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.vph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in}
.tile[data-sub="perf"] .tile-ic{background:linear-gradient(135deg,#8B6CF0,#2F6FD6);box-shadow:0 6px 14px rgba(76,90,220,.35)}
.tile[data-sub="target"] .tile-ic{background:linear-gradient(135deg,#F7B531,#EE6A1F);box-shadow:0 6px 14px rgba(238,106,31,.3)}
.tile[data-sub="ordd"] .tile-ic{background:linear-gradient(135deg,#2FB67C,#149B7F);box-shadow:0 6px 14px rgba(20,155,127,.3)}
.tile[data-sub="history"] .tile-ic{background:linear-gradient(135deg,#5B7089,#38495E);box-shadow:0 6px 14px rgba(56,73,94,.3)}
.hist-co{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 4px}
.hist-row{display:flex;align-items:center;gap:12px;width:100%;text-align:start}
.hist-row .hr-mo{flex:1;min-width:0}
.hist-notice{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:13px;margin:2px 0 12px}
.pf-lock{text-align:center;padding:14px 8px}
.pf-lock-ic{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--sunk);color:var(--muted);margin-bottom:6px}
.pf-lock-ic svg{width:19px;height:19px}
.pf-lock b{font:600 17px var(--f-display)}
.od-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.od-cell{background:var(--sunk);border-radius:12px;padding:10px 12px}
.od-cell small{color:var(--muted);font-size:12px;display:block;margin-bottom:2px}
.od-cell b{font:600 18px var(--f-display)}
.od-cell.bad{background:var(--bad-soft)}
.od-cell.bad small,.od-cell.bad b{color:var(--bad)}
.tile-ic svg{width:17px;height:17px}
.tile-go{font-size:22px;color:var(--muted)}
.tile b{font:600 18px var(--f-display);letter-spacing:.02em}
.tile small{color:var(--muted);font-size:13px}
.bigg.sm{width:44px;height:44px;font-size:24px;border-radius:12px}
.tbar2{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-top:6px}
.tbar2 span{display:block;height:100%;background:var(--gold);border-radius:6px}
.subhead{display:flex;align-items:center;gap:10px}
.subhead h2{margin:0;font:600 22px var(--f-display)}
.perf-head{border-radius:12px;padding:10px 12px;font-weight:600;margin-bottom:10px;font-size:14.5px}
.perf-head.up{background:var(--good-soft);color:var(--good)} .perf-head.down{background:var(--bad-soft);color:var(--bad)} .perf-head.same{background:var(--sunk);color:var(--muted)}
.pr{display:grid;grid-template-columns:1.2fr 1fr 1.3fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr.phd{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:0}
.pr.phd small{display:block;text-transform:none;letter-spacing:0;font-weight:500}
.pr .today{font-weight:600}
.pr .num.today{font-size:18px}
.chg{font-size:12px;font-family:var(--f-body);font-weight:600;margin-inline-start:4px}
.chg.up{color:var(--good)} .chg.down{color:var(--bad)} .chg.same{color:var(--muted)}
.gap{text-align:center;color:var(--muted);letter-spacing:.3em;padding:2px 0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.p-good{background:var(--good-soft);color:var(--good)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)}
.net{background:radial-gradient(130% 120% at 85% -10%, #1E5E97 0%, var(--cab) 58%), linear-gradient(135deg,var(--cab),var(--cab-2));color:var(--cab-ink);border-radius:22px;padding:24px;text-align:center;box-shadow:0 16px 36px -16px rgba(10,33,57,.55)}
.net .big{font-size:42px;color:var(--gold);text-shadow:0 2px 20px rgba(255,175,26,.35)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:15px;font-weight:600;font-size:16px;background:linear-gradient(135deg,var(--cab-2),var(--cab));color:var(--cab-ink);width:100%;box-shadow:0 8px 18px -9px rgba(10,33,57,.6)}
.btn.gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--gold-ink);box-shadow:0 9px 20px -8px rgba(255,175,26,.6)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.btn:disabled{opacity:.6}
.back{align-self:flex-start;background:none;border:0;color:var(--info);font-weight:600;padding:4px 0}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -8px 26px -12px rgba(10,33,57,.22)}
.nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:34px;height:26px;padding:4px 9px;border-radius:12px;color:var(--c);transition:background .15s,color .15s}
.nav button[data-tab="home"]{--c:#2F6FD6} .nav button[data-tab="fines"]{--c:#EA7A1B} .nav button[data-tab="salary"]{--c:#16A06A} .nav button[data-tab="profile"]{--c:#7C5CE0}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:#fff;background:var(--c);box-shadow:0 4px 12px color-mix(in srgb,var(--c) 45%,transparent)}
.nav .badge{position:absolute;top:3px;inset-inline-start:calc(50% + 7px);min-width:9px;height:9px;border-radius:9px;background:var(--bad)}
.updated{text-align:center;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* compact look */
body{font-size:14px;line-height:1.4}
main{padding-top:10px;gap:9px}
.card{border-radius:16px;padding:12px}
.card h3{font-size:11.5px;margin-bottom:7px}
.lbl{font-size:10.5px}
.big{font-size:24px}
.hero{border-radius:18px}
.hero .rank{font-size:46px}.hero-grid .rank{font-size:38px}
.hero-grid{gap:12px}
.hero-stats{margin-top:11px;padding-top:10px;gap:8px}
.tbar{height:8px;margin-top:8px}
.tiles{gap:9px}
.tile{border-radius:16px;padding:11px;gap:2px}
.tile-ic{width:34px;height:34px;border-radius:11px}
.tile-ic svg{width:16px;height:16px}
.tile-go{font-size:18px}
.tile b{font-size:15px}
.tile small{font-size:11.5px}
.subhead h2{font-size:18px}
.nav button{font-size:10.5px;padding:4px 0}
.pill{font-size:11px;padding:1px 8px}
.top{padding-bottom:10px}
.podium{margin:2px 0 0;gap:6px}
.pod{gap:2px}.pod b{font-size:12px}.pod .num{font-size:16px}
.pod-ph .medal{width:20px;height:20px;font-size:11px;bottom:-4px;inset-inline-end:-4px}
.pod1 .step{height:26px}.pod2 .step{height:18px}.pod3 .step{height:12px}.step{margin-top:2px}
.list .li{padding:6px 0;font-size:13px}
.inet-card{padding:9px 12px}
.inet-card h3{font-size:12px}
.inet-card .big{font-size:17px!important;margin-top:2px!important}
.inet-rows{margin-top:5px;gap:6px}.inet-rows small{font-size:10.5px}.inet-rows b{font-size:12.5px}

rgba(12,53,86,.82));--rim:inset 0 2px 1px rgba(220,255,255,.5),inset 0 -12px 20px rgba(0,180,220,.16),inset 8px 0 14px rgba(160,240,255,.08);color-scheme:dark}
body{background:linear-gradient(175deg,#06324f,#04203a 55%,#021224);background-color:#04203a}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 6%,rgba(60,220,255,.5) 0,transparent 36%),radial-gradient(circle at 8% 52%,rgba(60,120,255,.42) 0,transparent 40%),radial-gradient(circle at 88% 88%,rgba(40,230,200,.32) 0,transparent 38%);pointer-events:none;z-index:-2}
body::before{content:"";position:fixed;inset:0;background:var(--wm) center 54%/90% auto no-repeat;opacity:.42;pointer-events:none;z-index:-1}
.card,.tile{background:var(--glass);border:1px solid rgba(170,240,255,.42);box-shadow:var(--shadow-sm),var(--rim)}
.card.hero{background:linear-gradient(150deg,#1b86ab,#144a86);box-shadow:var(--shadow),var(--rim);overflow:hidden}
.hero::after{border-color:rgba(127,246,255,.2)!important;box-shadow:inset 0 0 60px rgba(127,246,255,.15)!important}
.card.hero:not(.x)::before{border-color:rgba(255,255,255,.14)}
.hero-wm{background-image:var(--wm)!important;opacity:.9!important}
.hero .rank,.hero .lbl.asof{color:#7ff6ff!important;text-shadow:0 0 18px rgba(127,246,255,.7)!important}
.tile-ic{box-shadow:0 12px 20px -6px rgba(0,8,30,.6),inset 0 2px 3px rgba(255,255,255,.5),inset 0 -4px 6px rgba(0,0,0,.2)!important}
.top{background:linear-gradient(180deg,#0f5278,#08304e);border-bottom:1px solid rgba(170,240,255,.3);box-shadow:0 18px 30px -16px rgba(0,8,30,.8)}
.top .iconbtn{background:rgba(160,240,255,.14);border:1px solid rgba(170,240,255,.4);box-shadow:var(--rim),0 10px 16px -8px rgba(0,8,30,.7)}
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:26px;background:#0c3556;border:1px solid rgba(170,240,255,.42);box-shadow:0 26px 40px -12px rgba(0,8,30,.9),var(--rim)}
.nav button[aria-current="page"] svg{color:#04304a;background:linear-gradient(145deg,#aaf8ff,#32c4ee);box-shadow:0 0 18px rgba(127,246,255,.75),inset 0 2px 3px rgba(255,255,255,.6)}
.nav button[aria-current="page"]{color:#aaf8ff}
main{padding-bottom:110px}
.btn{background:linear-gradient(145deg,rgba(60,190,235,.9),rgba(30,100,180,.9));box-shadow:0 18px 26px -12px rgba(0,8,30,.8),inset 0 2px 2px rgba(255,255,255,.4)}
.btn.gold{background:linear-gradient(145deg,#FFD166,#FFAF1A);box-shadow:0 0 18px rgba(255,175,26,.45),0 14px 22px -10px rgba(0,8,30,.7),inset 0 2px 3px rgba(255,255,255,.5)}
.btn.ghost{background:var(--glass);border:1px solid rgba(170,240,255,.4)}
.login{background:linear-gradient(175deg,#06324f,#04203a 55%,#021224)}
.sheet{background:var(--glass);border-top:1px solid rgba(170,240,255,.45);box-shadow:0 -20px 36px -14px rgba(0,8,30,.7),var(--rim)}
.logo-badge{box-shadow:0 0 38px rgba(127,246,255,.45),0 22px 36px rgba(0,8,30,.6),inset 0 0 0 1px rgba(255,255,255,.7)}
.field input,.card-wrap{background:rgba(3,22,40,.6);border-color:rgba(170,240,255,.35)}
.pad button{background:var(--glass);border:1px solid rgba(170,240,255,.3);box-shadow:0 12px 18px -10px rgba(0,8,30,.8),var(--rim)}
.bar span{background:linear-gradient(90deg,#32c4ee,#aaf8ff);box-shadow:0 0 12px rgba(127,246,255,.6)}
/* chat theme */
.tgc{background-color:#05273f}
.tgc::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 6%,rgba(60,220,255,.35) 0,transparent 40%),radial-gradient(circle at 8% 60%,rgba(60,120,255,.3) 0,transparent 42%),radial-gradient(circle at 88% 92%,rgba(40,230,200,.22) 0,transparent 40%);pointer-events:none;z-index:0}
.tgc>*{position:relative;z-index:1}
.tgc-h{background:linear-gradient(180deg,#0f5278,#08304e);border-bottom:1px solid rgba(170,240,255,.3);box-shadow:0 14px 24px -14px rgba(0,8,30,.8)}
.tgc-av{border:2px solid rgba(170,240,255,.6);box-shadow:0 0 14px rgba(127,246,255,.4)}
.tgc-d span{background:#0c3556;border:1px solid rgba(170,240,255,.3);color:#cfeef7}
.tgc .cb{box-shadow:0 10px 16px -8px rgba(0,8,30,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.tgc .cb.me{background:linear-gradient(145deg,#2fb6e6,#1c5fb8);border-end-end-radius:4px}
.tgc .cb.off{background:linear-gradient(150deg,#1d6384,#0c3556);border:1px solid rgba(170,240,255,.35);border-end-start-radius:4px}
.tgc-in{background:linear-gradient(180deg,transparent,rgba(3,22,40,.7))}
.tgc-pill{background:#0c3556;border:1px solid rgba(170,240,255,.4);box-shadow:0 12px 20px -10px rgba(0,8,30,.8),inset 0 2px 1px rgba(220,255,255,.25)}
.tgc-send{background:linear-gradient(145deg,#aaf8ff,#32c4ee);color:#04304a;box-shadow:0 0 18px rgba(127,246,255,.6),inset 0 2px 3px rgba(255,255,255,.6)}

/* hero logo: brighter + light float (transform only) */
.hero .hero-wm{opacity:1!important;will-change:transform;animation:hwf 7s ease-in-out infinite}
@keyframes hwf{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.05)}}

/* ── Skin: lavender light ── */
html[data-skin="lav"]{--bg:#EFE8FF;--card:#FFFFFF;--ink:#2A1D5C;--muted:#6B5D99;--line:rgba(150,120,230,.3);--sunk:#F3EDFF;--good:#12935C;--good-soft:#DDF5E8;--bad:#D6453A;--bad-soft:#FDE6E3;--info:#5A3BD0;--info-soft:#ECE6FF;--shadow:0 16px 26px -14px rgba(100,60,210,.4);--shadow-sm:0 12px 20px -12px rgba(100,60,210,.35);--glass:linear-gradient(160deg,#FFFFFF,#F3EDFF);--rim:inset 0 2px 0 #fff,inset 0 -3px 0 rgba(170,140,240,.2);color-scheme:light}
html[data-skin="lav"] body{background:linear-gradient(180deg,#E3D6FF,#F6F1FF 45%,#FCFAFF);background-color:#EFE8FF}
html[data-skin="lav"] body::after{display:none}
html[data-skin="lav"] body::before{opacity:.13}
html[data-skin="lav"] .card,html[data-skin="lav"] .tile{background:var(--glass);border:1px solid rgba(255,255,255,.95)}
html[data-skin="lav"] .card.hero{background:linear-gradient(150deg,#A77BFF,#7A4CF0 60%,#5A31D2);box-shadow:0 22px 32px -14px rgba(90,49,210,.6),inset 0 2px 0 rgba(255,255,255,.5)}
html[data-skin="lav"] .hero-wm{opacity:.5!important}
html[data-skin="lav"] .hero .rank,html[data-skin="lav"] .hero .lbl.asof{color:#FFD1F0!important;text-shadow:0 0 14px rgba(255,209,240,.7)!important}
html[data-skin="lav"] .hero .lbl{color:rgba(255,255,255,.85)}
html[data-skin="lav"] .hero{color:#fff}
html[data-skin="lav"] .hero .big{color:#fff}
html[data-skin="lav"] .top{background:linear-gradient(180deg,#fff,#F3EDFF);color:#2A1D5C;border-bottom:1px solid rgba(150,120,230,.25);box-shadow:0 10px 20px -14px rgba(100,60,210,.4)}
html[data-skin="lav"] .top .iconbtn{background:#fff;border:1px solid rgba(150,120,230,.3);box-shadow:var(--rim),0 8px 14px -8px rgba(100,60,210,.35);color:#2A1D5C}
html[data-skin="lav"] .top .ib{filter:invert(.2) sepia(1) hue-rotate(230deg) saturate(5) brightness(.7)}
html[data-skin="lav"] .nav{background:#fff;border:1px solid rgba(150,120,230,.25);box-shadow:0 20px 30px -12px rgba(100,60,210,.4),var(--rim)}
html[data-skin="lav"] .nav button[aria-current="page"] svg{color:#fff;background:linear-gradient(145deg,#B48CFF,#7A4CF0);box-shadow:0 0 14px rgba(122,76,240,.5),inset 0 2px 3px rgba(255,255,255,.5)}
html[data-skin="lav"] .nav button[aria-current="page"]{color:#5A31D2}
html[data-skin="lav"] .btn{background:linear-gradient(145deg,#B48CFF,#6A3FE0);color:#fff}
html[data-skin="lav"] .btn.gold{background:linear-gradient(145deg,#FFD166,#FFAF1A);color:#2A1A00}
html[data-skin="lav"] .btn.ghost{background:#fff;color:#2A1D5C;border:1px solid rgba(150,120,230,.3)}
html[data-skin="lav"] .bar span{background:linear-gradient(90deg,#B48CFF,#FFB3E6);box-shadow:none}
html[data-skin="lav"] .tile-ic{box-shadow:0 10px 16px -6px rgba(90,49,210,.4),inset 0 2px 3px rgba(255,255,255,.5),inset 0 -4px 6px rgba(0,0,0,.15)!important}
html[data-skin="lav"] .login{background:linear-gradient(180deg,#E3D6FF,#F6F1FF);color:#2A1D5C}
html[data-skin="lav"] .sheet{background:#fff;color:#2A1D5C;box-shadow:0 -16px 30px -14px rgba(100,60,210,.35)}
html[data-skin="lav"] .field input,html[data-skin="lav"] .card-wrap{background:#F3EDFF;border-color:rgba(150,120,230,.35);color:#2A1D5C}
html[data-skin="lav"] .pad button{background:linear-gradient(160deg,#fff,#F3EDFF);color:#2A1D5C;border:1px solid rgba(150,120,230,.25)}
html[data-skin="lav"] .tgc{background-color:#EFE8FF;color:#2A1D5C}
html[data-skin="lav"] .tgc::before{background:radial-gradient(circle at 80% 6%,rgba(190,160,255,.5) 0,transparent 45%),radial-gradient(circle at 10% 70%,rgba(255,190,230,.4) 0,transparent 45%)}
html[data-skin="lav"] .tgc-h{background:linear-gradient(180deg,#B48CFF,#7A4CF0);color:#fff}
html[data-skin="lav"] .tgc-d span{background:#fff;color:#5A31D2;border:1px solid rgba(150,120,230,.3)}

async function rpc(fn, args){
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 20000);   // a hung request must never block the next refresh

  if (!r.ok) throw new Error("http " + r.status);

}

async function doSignup(){
  const name = ($("#suName")?.value || "").trim(), rid = ($("#suRid")?.value || "").trim(), mob = ($("#suMob")?.value || "").trim();
  const pin = ($("#suPin")?.value || "").trim(), pin2 = ($("#suPin2")?.value || "").trim();
  S.su = { name, rid, mob }; S.err = "";
  if (name.length < 3) { S.err = t("su_e_name"); return render(); }
  if (!/^\d{10}$/.test(rid)) { S.err = t("need_iqama"); return render(); }
  if (!/^\d{4}$/.test(pin)) { S.err = t("su_e_pin"); return render(); }
  if (pin !== pin2) { S.err = t("su_e_match"); return render(); }
  S.busy = true; render();
  try {
    const r = await rpc("driver_signup", { p_rid: rid, p_pin: pin, p_name: name, p_mobile: mob });
    S.busy = false;
    if (r.ok) { S.view = "login"; S.rid = rid; S.su = null; S.err = ""; S.info = t("su_sent"); return render(); }
    S.err = r.error === "exists" ? t("su_e_exists") : r.error === "iqama" ? t("need_iqama") : r.error === "pin" ? t("su_e_pin") : r.error === "name" ? t("su_e_name") : r.error === "busy" ? t("su_e_busy") : t("offline");
  } catch { S.busy = false; S.err = t("offline"); }
  render();
}
async function tryLogin(){
  const rid = ($("#rid")?.value || S.rid).trim();
  S.rid = rid; S.err = ""; S.info = "";
  if (!/^\d{10}$/.test(rid)) { S.err = t("need_iqama"); S.pin = ""; return render(); }
  S.busy = true; render();
  try {
    const r = await rpc("driver_login", { p_rid: rid, p_pin: S.pin, p_remember: S.remember });
    S.busy = false; S.pin = "";
    if (r.ok) {
      S.token = r.token; store.set("asb-token", r.token, S.remember); store.set("asb-rid", rid); store.set("asb-remember", S.remember ? "1" : "0");
      S.view = "app"; S.tab = "home"; render(); await refresh(true); return;
    }
    S.err = r.error === "pending" ? t("su_pending") : r.error === "locked" ? t("locked", { n: r.minutes || 15 }) : r.error === "wrong" ? (r.left > 0 ? t("wrong", { n: r.left }) : t("wrong0")) : t("wrong0");
    render(); $("#dots")?.classList.add("shake");
  } catch { S.busy = false; S.pin = ""; S.err = t("offline"); render(); }
}

    jh:"জুমা মোবারক, {n}!", jp:["সপ্তাহের সেরা দিন। নিজের, পরিবারের আর কাজের জন্য আন্তরিক দোয়া করুন।", "আল্লাহ এই বরকতময় জুমায় আপনার ইবাদত কবুল করুন ও রিযিকে বরকত দিন।", "জুমার দিনে এমন এক সময় আছে যখন দোয়া কবুল হয়। দুনিয়া ও আখিরাতের কল্যাণ চান।", "আজ জুমার নামাজের জন্য সময় রাখুন, তারপর নতুন মন নিয়ে কাজে ফিরুন, ইনশাআল্লাহ।", "আপনাকে ও আপনার পরিবারকে জুমা মোবারক। পুরো সপ্তাহ সততার সাথে কাজ করার জন্য ধন্যবাদ।", "এই জুমা আপনাকে রাস্তায় নিরাপত্তা, কাজে সহজতা আর মনে প্রশান্তি দিক।", "আজ নবী (সা.)-এর ওপর দরুদ পাঠ করুন এবং আল্লাহর কাছে ক্ষমা ও হিদায়াত চান।", "পুরো সপ্তাহ সততার সাথে গ্রাহকদের সেবা দেওয়ার জন্য ধন্যবাদ। আল্লাহ এই জুমায় আপনাকে প্রতিদান দিন।", "আমাদের পরিশ্রমী টিমকে বরকতময় জুমা। নিরাপদে থাকুন, কৃতজ্ঞ থাকুন, ইনশাআল্লাহ।", "আল্লাহ কৃতজ্ঞদের ভালোবাসেন। এই জুমায় আপনার সুস্থতা ও কাজের জন্য তাঁকে ধন্যবাদ জানান।"], jt:[ "নবী (সা.)-এর ওপর দরুদ পাঠ করুন", "আজ সাবধানে গাড়ি চালান"],
    dua:["আল্লাহ আপনার কাজ ও রিযিকে বরকত দিন। ইনশাআল্লাহ আপনি পারবেন।", "সততার সাথে কাজ করুন, আল্লাহ রিযিকের দরজা খুলে দেবেন। চালিয়ে যান।", "ধৈর্য ও নিয়মিত থাকুন। যারা ভালো কাজ করে আল্লাহ তাদের পরিশ্রম নষ্ট করেন না।", "আল্লাহর উপর ভরসা রাখুন, নিজের সেরাটা দিন। “যে আল্লাহর উপর ভরসা করে, আল্লাহই তার জন্য যথেষ্ট।”", "আল্লাহ আপনাকে রাস্তায় হেফাজত করুন এবং নিরাপদে বাড়ি ফেরান।", "ইয়া আল্লাহ, আজকের দিনটা আমাদের জন্য সহজ ও বরকতময় করে দিন। সাবধানে চালান।", "বিসমিল্লাহ বলে শুরু করুন, সাবধানে চালান, আলহামদুলিল্লাহ বলে দিন শেষ করুন।", "আল্লাহ আপনার কাজ সহজ করুন এবং কবুল করুন।", "“তোমরা কৃতজ্ঞ হলে আমি অবশ্যই তোমাদের আরও বাড়িয়ে দেব।” আজ শুকরিয়া আদায় করুন।", "আল্লাহ আজ আপনাকে সুস্থতা, নিরাপত্তা ও হালাল রিযিক দিন।", "আল্লাহ ভালোবাসেন, তোমাদের কেউ কোনো কাজ করলে যেন সেটা দক্ষতার সাথে করে। আজ সেরাটা দিন।", "ধৈর্য ধরুন। আল্লাহ ধৈর্যশীলদের সাথে আছেন। ইনশাআল্লাহ ভালো দিন আসছে।", "আল্লাহ আপনার পরিবার ও আপনার চেষ্টায় বরকত দিন। রাস্তায় নিরাপদে থাকুন।", "শুরুর আগে ছোট একটা দোয়া করুন। আল্লাহ প্রতিটি আন্তরিক ডাক শোনেন।", "আল্লাহর উপর ভরসা করুন আর নিজের কাজটা করুন। আগে উট বাঁধুন, তারপর ভরসা করুন। ইনশাআল্লাহ।"],
    t3h:"অভিনন্দন, {n}!", t3p:["আল্লাহর রহমতে আপনি ASB LOGISTICS-এর সেরা ৩ জনের একজন। আপনার পরিশ্রম ও নিয়মানুবর্তিতা পুরো টিমকে অনুপ্রাণিত করে। বারাকাল্লাহু ফীক।", "মাশাআল্লাহ, আপনি সামনে থেকে নেতৃত্ব দিচ্ছেন। সততা আর পরিশ্রম ধরে রাখুন, ইনশাআল্লাহ সেরা ৩-এই থাকবেন।", "আপনি এখানে সব কর্মীর জন্য উদাহরণ। আপনার পরিশ্রমের জন্য ধন্যবাদ। আল্লাহ আপনাকে শক্তিশালী রাখুন।", "সেরা ৩ ভাগ্যের ব্যাপার নয়, এটা প্রতিদিনের নিয়মানুবর্তিতার ফল। আল্লাহ আপনার চেষ্টার প্রতিদান দিন ও আপনাকে অটল রাখুন।", "আজ আপনার নাম আমাদের টিমের সেরাদের মধ্যে। আপনার বিশ্বাস ও পরিশ্রমের জন্য ধন্যবাদ। বারাকাল্লাহু ফীক।", "সময়মতো প্রতিটি ডেলিভারিই আপনাকে এই জায়গায় এনেছে। আল্লাহ আপনার কাজ ও রিযিকে বরকত দিন।", "মাশাআল্লাহ, কী দারুণ একটি মাস। বিনয়ী থাকুন, নিয়মিত থাকুন, আর আল্লাহর অনুগ্রহের জন্য শুকরিয়া করুন।", "কোম্পানি আপনাকে নিয়ে গর্বিত। আপনার ভালো উদাহরণ দিয়ে সহকর্মীদের সাহায্য করুন, ইনশাআল্লাহ।", "“তোমরা কৃতজ্ঞ হলে আমি অবশ্যই তোমাদের আরও বাড়িয়ে দেব।” সেরা ৩-এর কর্মী, শুকরিয়া করুন আর চালিয়ে যান।", "ধৈর্য ও সততা দিয়ে আপনি এই জায়গা অর্জন করেছেন। আল্লাহ এটি রক্ষা করুন ও আপনার কল্যাণ বাড়িয়ে দিন।", "গ্রাহকরা আপনাকে বিশ্বাস করে, ফলাফলেই তা বোঝা যায়। আপনার প্রতিটি পথে আল্লাহ বরকত দিন।", "রাস্তায় এবং অ্যাপে, দুই জায়গাতেই আপনি এগিয়ে। যত্ন, গতি আর ভালো আচরণ ধরে রাখুন, ইনশাআল্লাহ।", "আপনি প্রমাণ করছেন পরিশ্রমের ফল আছে। ASB LOGISTICS-কে এত ভালোভাবে তুলে ধরার জন্য ধন্যবাদ।", "ইহসানের সাথে সেরা ৩-এ থাকুন: প্রতিটি অর্ডার এমনভাবে করুন যেন সেটাই প্রথম। আল্লাহ আপনার জন্য সহজ করুন।", "মাশাআল্লাহ, তাবারাকাল্লাহ। আপনার পরিশ্রমে আরেকটি দিন শীর্ষে। আল্লাহ আপনার কাছ থেকে কবুল করুন।"],
    t10h:"মাশাআল্লাহ, {n}!", t10p:["এই মাসে আপনি শীর্ষ ১০ জনের মধ্যে আছেন। আর একটু চেষ্টায় ইনশাআল্লাহ সেরা ৩-এ পৌঁছাবেন।", "আপনার নিয়মিত কাজ সবার চোখে পড়ছে। সেরা ৩ আপনার হাতের নাগালে, চালিয়ে যান।", "শীর্ষ ১০ দারুণ জায়গা। নিয়মিত থাকলে ইনশাআল্লাহ পরের ধাপ সেরা ৩।", "মাশাআল্লাহ, আপনি সেরা দশজনের একজন। প্রতিটি অর্ডার সময়মতো শেষ করুন, র‍্যাংক উঠতে দেখবেন।", "আপনি শীর্ষের কাছাকাছি। আরেকটা ভালো দিন, তারপর আরেকটা। আল্লাহ ধৈর্যশীলদের সাথে আছেন।", "আপনার পরিশ্রমের ফল আসছে। ডেলিভারি সময়মতো আর অর্ডার গ্রহণ বেশি রাখুন, ইনশাআল্লাহ।", "তালিকায় ভালো জায়গা। প্রতিদিনের ছোট ছোট উন্নতিই আপনাকে আরও ওপরে নেবে, ইনশাআল্লাহ।", "আপনি আগেই দেখিয়েছেন আপনি পারেন। একই উদ্যম রাখুন আর সেরা ৩-এর লক্ষ্য রাখুন।", "শীর্ষ ১০ মানে গ্রাহক আপনাকে বিশ্বাস করে। প্রতিটি অর্ডারে সেই বিশ্বাস রক্ষা করুন।", "চমৎকার। এখন গতি কমাবেন না, পরের ধাপগুলোই সবচেয়ে পুরস্কারের, ইনশাআল্লাহ।", "“নিশ্চয়ই কষ্টের সাথে স্বস্তি আছে।” চালিয়ে যান, আপনার পরিশ্রম দেখা হচ্ছে।", "আপনি একটি দারুণ মাস গড়ছেন। সময়মতো ডেলিভারি আর প্রতিটি অর্ডার শেষ করায় মনোযোগ দিন।", "বারাকাল্লাহু ফীক। প্রতিদিন আর কয়েকটা অর্ডারই আপনার র‍্যাংক বদলে দিতে পারে, ইনশাআল্লাহ।", "আপনি আমাদের অন্যতম শক্তিশালী কর্মী। সততা ও ধৈর্যের সাথে আরও ওপরে লক্ষ্য রাখুন।", "আজ শীর্ষ ১০, আল্লাহ চাইলে শিগগিরই সেরা ৩। ভালো নিয়ত নিয়ে কাজ করুন।"],
    oth:"ধন্যবাদ, {n}!", othp:["আপনার আগ্রহ ও পরিশ্রমকে আমরা সত্যিই মূল্য দিই। প্রতিটি অর্ডার আপনাকে এগিয়ে নিচ্ছে। চালিয়ে যান, ইনশাআল্লাহ সামনে আরও ভালো সময়।", "আপনার চেষ্টা আমরা দেখছি। প্রতিদিনের ছোট ছোট পদক্ষেপই বড় ফল আনে। চালিয়ে যান।", "আমাদের সাথে কাজ করার জন্য ধন্যবাদ। ধৈর্য ও নিয়মিত থাকুন, ইনশাআল্লাহ র‍্যাংক বাড়বে।", "প্রতিটি দিন নতুন সুযোগ। ভালো নিয়ত দিয়ে শুরু করুন, আল্লাহ সহজ করে দেবেন।", "“কাজের ফল নিয়তের ওপর নির্ভর করে।” খাঁটি নিয়তে কাজ করুন, আপনার রিযিকে বরকত হবে।", "আপনি এই টিমের অংশ, আমাদের আপনাকে দরকার। আরেকটা ভালো অর্ডার মানে আরেক ধাপ ওপরে।", "আজ কোথায় আছেন তা দেখবেন না, কতদূর যেতে পারেন তা দেখুন। হাঁটতে থাকুন, ইনশাআল্লাহ।", "সময়মতো থাকুন, ভদ্র থাকুন, যে অর্ডার নিয়েছেন তা শেষ করুন। এই তিনটি যেকোনো কর্মীকে এগিয়ে নেয়।", "আল্লাহ ধৈর্যশীলদের সাথে আছেন। স্থির থাকুন, ইনশাআল্লাহ ফল আসবে।", "রোদ আর যানজটে রাস্তায় এত পরিশ্রমের জন্য ধন্যবাদ। আল্লাহ আপনাকে প্রতিদান দিন।", "সেরা মানুষ সে, যে অন্যের উপকার করে। আপনার ডেলিভারি পরিবারের কাছে খাবার পৌঁছায়। ধন্যবাদ।", "প্রতিদিন ছোট কিছু শিখুন, কাল একটু ভালো করুন। এভাবেই র‍্যাংক বাড়ে।", "আমরা আপনার ওপর বিশ্বাস রাখি। একটি মনোযোগী সপ্তাহ আপনার র‍্যাংক বদলে দিতে পারে, ইনশাআল্লাহ।", "আল্লাহর উপর ভরসা রাখুন, নিজের সেরাটা দিন। চেষ্টার পেছনে সাফল্য আসে, ইনশাআল্লাহ।", "যে গ্রাহককে ভালো সেবা দেন, সেটা আপনার জন্য একটি ভালো কাজ। চালিয়ে যান আর হাসিমুখে থাকুন।"],
    wh:"আরও উন্নতি দরকার", whk:"{m} আপনার দুর্বল দিক", wp:["আপনার গ্রেড {g}। নিচের বিষয়গুলো ঠিক করলে ইনশাআল্লাহ গ্রেড ও র‍্যাংক বাড়বে।", "আজ গ্রেড {g}। এগুলোই ঠিক কারণ। এগুলোয় কাজ করলে ইনশাআল্লাহ ফল বদলাবে।", "আপনার গ্রেড {g}। ভালো কর্মী বেশি অর্ডার পায়, তাই এগুলো একসাথে ঠিক করি।", "আজকের গ্রেড {g}। চিন্তা নেই, ছোট সংশোধনেই দ্রুত পরিবর্তন আসে, ইনশাআল্লাহ।", "গ্রেড {g}। আপনার রিপোর্ট দেখাচ্ছে কোথায় মনোযোগ দিতে হবে। আজ এই ধাপগুলো মন দিয়ে মানুন।", "আপনি এখন গ্রেড {g}-এ। নিচের বিষয়গুলো ভালো করলে এটি বাড়াতে পারবেন।", "গ্রেড {g}। কেউ নিখুঁত নয়, ভালো কর্মী শেখে আর শুধরে নেয়। এই বিষয়গুলো দিয়ে শুরু করুন।", "আপনার বর্তমান গ্রেড {g}। আল্লাহ দক্ষতার সাথে করা কাজ ভালোবাসেন। এই বিষয়গুলো ভালো করুন।", "আজ গ্রেড {g}। একটি একটি করে বিষয় ঠিক করুন, ইনশাআল্লাহ পার্থক্য দেখবেন।", "সিস্টেম গ্রেড {g} দেখাচ্ছে। এই বিষয়গুলো আপনাকে পিছিয়ে রাখছে। ঠিক করলে অর্ডার বাড়বে।", "গ্রেড {g}। আমরা আপনাকে আরও ওপরে দেখতে চাই। পরের অর্ডার থেকেই নিচের ধাপগুলো মানুন।", "আজকের ফল গ্রেড {g}। নিজের প্রতি ধৈর্য রাখুন, এই বিষয়গুলোতে কাজ করুন, ইনশাআল্লাহ।", "গ্রেড {g}। ভালো গ্রেড মানে বেশি অর্ডার আর বেশি আয়। নিচের বিষয়গুলো দিয়ে শুরু করুন।", "আপনার গ্রেড {g}। এটাই শেষ নয়। চেষ্টা ও যত্নে উন্নতি হবে, ইনশাআল্লাহ।", "গ্রেড {g}। আজ এই বিষয়গুলো গুরুত্ব দিয়ে নিন, আর সাহায্য লাগলে অফিসকে জানান।"],
    dn:"{a}% থেকে নেমে {b}% হয়েছে", lw:"এখন {b}%", pace:"লক্ষ্যে পৌঁছাতে যে গতি দরকার, আপনার অর্ডার তার চেয়ে পিছিয়ে।",
    fa:"বাধ্যতামূলক অ্যাসাইনমেন্ট", fa_h:"সিস্টেম যে অর্ডার দেয় তা গ্রহণ করে শেষ করুন।", ot:"সময়মতো ডেলিভারি", ot_h:"সময়মতো গ্রাহকের কাছে পৌঁছান। রুট ঠিক করে নিন, দেরি করবেন না।",

/* the driver's own photo: cut to a square, shrink, send to the office */
async function sendPhoto(file){
  S.photoBusy = true; render();
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const side = Math.min(img.naturalWidth, img.naturalHeight), SZ = 400, c = document.createElement("canvas"); c.width = c.height = SZ;
    c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, SZ, SZ);
    // shrink quality until the data URL fits the server limit
    let data = c.toDataURL("image/jpeg", 0.82);
    for (let q = 0.72; data.length > 150000 && q >= 0.4; q -= 0.12) data = c.toDataURL("image/jpeg", q);
    const r = await rpc("driver_set_my_photo", { p_token: S.token, p_dataurl: data });
    if (r.ok) { if (S.data?.m?.profile) S.data.m.profile.photo = data; toast(t("ph_saved")); refresh(true); }
    else toast(r.error === "expired" ? t("expired") : t("ph_fail"));
  } catch { toast(t("ph_fail")); }
  S.photoBusy = false; render();
}

/* petrol meter photo — live camera only, no gallery */
const cam = { stream: null, data: "", cb: null };
function camStop(){ try { cam.stream && cam.stream.getTracks().forEach(x => x.stop()); } catch {} cam.stream = null; cam.data = ""; cam.cb = null; document.getElementById("camOv")?.remove(); }
async function camOpen(o){
  camStop(); cam.cb = o?.cb || null;
  const ov = document.createElement("div"); ov.id = "camOv";
  ov.innerHTML = `<div class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16a9 9 0 1 1 18 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.2"/><rect x="6" y="19" width="12" height="2.6" rx="1"/></svg><div><b>${esc(o?.hint || t("cam_hint"))}</b><small>${t("cam_sub")}</small></div></div>
    <div class="cv"><video id="camV" autoplay playsinline muted></video><img id="camI" alt="" hidden></div>
    <div class="cf"><button data-cam="x" aria-label="close">✕</button><button class="shut" data-cam="snap" aria-label="photo"></button><button data-cam="x" style="visibility:hidden">✕</button></div>`;
  document.body.append(ov);
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw 0;
    cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 800 }, height: { ideal: 600 }, frameRate: { ideal: 24 } }, audio: false });
    const v = document.getElementById("camV"); v.srcObject = cam.stream; await v.play().catch(() => {});
  } catch { ov.querySelector(".cv").innerHTML = `<div class="msg">${t("cam_err")}</div>`; ov.querySelector('[data-cam="snap"]').style.display = "none"; }
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-cam]"); if (!b) return; e.stopImmediatePropagation();
  const ov = document.getElementById("camOv"); if (!ov) return;
  const k = b.dataset.cam;
  if (k === "x") return camStop();
  if (k === "snap") {
    const v = document.getElementById("camV"); if (!v?.videoWidth) return;
    const sc = Math.min(1, 800 / v.videoWidth), c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    let q = 0.72, data = c.toDataURL("image/jpeg", q); while (data.length > 200000 && q > 0.3) { q -= 0.1; data = c.toDataURL("image/jpeg", q); }
    cam.data = data; const im = document.getElementById("camI"); im.src = data; im.hidden = false; v.hidden = true;
    ov.querySelector(".cf").innerHTML = `<button data-cam="retake" aria-label="${t("cam_retake")}">↺</button><button class="ok" data-cam="ok" aria-label="${t("cam_use")}">✓</button><button data-cam="x">✕</button>`;
    return;
  }
  if (k === "retake") { cam.data = ""; document.getElementById("camI").hidden = true; const v = document.getElementById("camV"); v.hidden = false; ov.querySelector(".cf").innerHTML = `<button data-cam="x">✕</button><button class="shut" data-cam="snap"></button><button style="visibility:hidden">✕</button>`; return; }
  if (k === "ok" && cam.data && cam.cb) {
    b.disabled = true; b.textContent = "…";
    let fin = false; try { fin = await cam.cb(cam.data); } catch {}
    if (fin) camStop(); else { b.disabled = false; b.textContent = "✓"; }
    return;
  }
  if (k === "ok" && cam.data) {
    b.disabled = true; b.textContent = "…";
    try {
      const ac = new AbortController(), to = setTimeout(() => ac.abort(), 40000); let r;
      try { const resp = await fetch(`${SB_URL}/functions/v1/fuel-photo`, { method: "POST", signal: ac.signal, headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ token: S.token, photo: cam.data }) }); r = await resp.json(); } finally { clearTimeout(to); }
      if (r.ok) { S.fuelNeed = true; camStop(); toast(t("fneed_on")); S.fuelBusy = false; return render(); }
      if (r.error === "locked") { camStop(); S.fuelRes = S.fuelRes || "approved"; toast(t("fres_lock")); return render(); }
      b.disabled = false; b.textContent = "✓"; toast(t("cam_fail"));
    } catch { b.disabled = false; b.textContent = "✓"; toast(t("cam_fail")); }
  }
}, true);
document.addEventListener("click", async e => {

      if (r.ok) { DM.msgs = (DM.msgs || []).filter(x => +x.at !== at); DM.sig = dmSig(DM.msgs); render(); return; }
      toast(t("offline"));
    } catch { toast(t("offline")); }
    render(); return;
  }
  if (el.matches("[data-dmzoom]")) {
    const o = document.createElement("div"); o.className = "dmzoom"; o.innerHTML = `<img src="${el.src}" alt="">`; o.onclick = () => o.remove(); document.body.append(o); return;
  }
  if (el.matches("[data-dmsend]")) {
    const txt = ($("#dmText")?.value || "").trim(); if (!txt) return;

      if (r.ok) { DM.draft = ""; DM.msgs = (DM.msgs || []).concat([{ at: r.at, from: "driver", text: txt }]); DM.sig = dmSig(DM.msgs); render(); dmBottom(); return; }
      toast(r.error === "slow" ? t("dm_slow") : t("offline"));

  }
  if (el.matches("[data-rpsend]")) {
    const txt = ($("#rpText")?.value || "").trim(); if (txt.length < 5) return toast(t("rp_short"));
    el.disabled = true;
    try {
      const r = await rpc("driver_report_add", { p_token: S.token, p_cat: RP.cat, p_text: txt });
      if (r.ok) { RP.draft = ""; RP.items = null; toast(t("rp_sent")); return render(); }
      toast(r.error === "limit" ? t("rp_limit") : r.error === "short" ? t("rp_short") : t("offline"));
    } catch { toast(t("offline")); }
    el.disabled = false; return;
  }
  if (el.matches("[data-epsave]")) {
    const p = S.data?.m?.profile || {}, patch = {};
    for (const k of EP_F) if (S.ep && k in S.ep) patch[k] = S.ep[k];
    // petrol card: driver edits only the number; the "logistic" prefix is fixed
    if (S.ep && "cardnum" in S.ep) { const n = String(S.ep.cardnum).replace(/\D/g, "").slice(0, 2); patch.card = n ? ("logistic " + n) : ""; }
    if (!Object.keys(patch).length) { S.sub = null; S.ep = null; return render(); }
    el.disabled = true;
    try {
      const r = await rpc("driver_update_profile", { p_token: S.token, p_patch: patch, p_pin: S.ep?.pin || null });
      if (r.ok) { toast(t("ep_saved")); S.ep = null; S.sub = null; await refresh(true); window.scrollTo(0, 0); return; }
      if (r.error === "expired") return toLogin(t("expired"));
      toast(r.error === "pin" ? t("ep_err_pin") : r.error === "dup" ? t("ep_err_dup") : t("ep_err_bad", { f: ({ fullName: t("ep_name"), residentId: t("resident"), mobile: t("mobile"), iban: t("iban") })[r.field] || r.field || "" }));
    } catch { toast(t("offline")); }
    el.disabled = false; return;
  }
  if (el.dataset.lang) { lang = el.dataset.lang; store.set("asb-lang", lang); return render(); }
  if (el.dataset.skin) { document.documentElement.dataset.skin = el.dataset.skin; store.set("asb-skin", el.dataset.skin); return render(); }
  if (el.dataset.k !== undefined) {
    $("#rid")?.blur(); S.rid = ($("#rid")?.value || S.rid).trim();
    const k = el.dataset.k;
    if (k === "del") S.pin = S.pin.slice(0, -1); else if (k === "clear") S.pin = ""; else if (S.pin.length < 4) S.pin += k;
    navigator.vibrate?.(8);

    return render();
  }
  if (el.matches("[data-signup]")) { S.view = "signup"; S.err = ""; S.info = ""; S.su = null; return render(); }
  if (el.matches("[data-tologin]")) { S.view = "login"; S.err = ""; S.pin = ""; return render(); }
  if (el.matches("[data-dosignup]")) { doSignup(); return; }

document.addEventListener("change", e => { if (e.target.id === "remember") S.remember = e.target.checked; });
