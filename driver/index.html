<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0A2A47">
<title>ASB Driver</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ASB Driver">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter+Tight:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* ASB Driver: a road-going dashboard. Navy cab, signal-gold accents, one card per instrument. */
:root{
  --cab:#0B2439; --cab-2:#16517F; --cab-ink:#EEF5FB; --gold:#FFAF1A; --gold-2:#FFC94D; --gold-ink:#2A1A00;
  --bg:#E9ECF1; --card:#FFFFFF; --ink:#0D1B28; --muted:#5B6B7B; --line:#DCE3EB; --sunk:#F2F5F9;
  --good:#0E9D62; --good-soft:#E3F6EC; --bad:#D63A2C; --bad-soft:#FCE7E4; --info:#2A6FD0; --info-soft:#E7F0FB;
  --shadow:0 14px 34px -16px rgba(11,36,57,.30); --shadow-sm:0 3px 12px -5px rgba(11,36,57,.20);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter Tight","Hind Siliguri","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#06121E; --card:#0E2334; --ink:#E7EEF5; --muted:#93A6B8; --line:#20394E; --sunk:#0A1C2B;
  --good:#5FCB97; --good-soft:#123222; --bad:#F08A7E; --bad-soft:#3B1814; --info:#86BCF0; --info-soft:#13304B;
  --shadow:0 16px 36px -18px rgba(0,0,0,.6); --shadow-sm:0 3px 12px -5px rgba(0,0,0,.45); color-scheme:dark}}
:lang(bn){--f-body:"Hind Siliguri","Inter Tight",system-ui,sans-serif}
:lang(ar){--f-body:"IBM Plex Sans Arabic","Inter Tight",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--f-display);font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}
.neg{color:var(--bad)} .pos{color:var(--good)}

/* ── Login ── */
.login{min-height:100%;display:flex;flex-direction:column;background:var(--cab);color:var(--cab-ink)}
.login-top{padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:flex-end}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 20px 30px;position:relative}
.logo-badge{width:132px;height:132px;border-radius:34px;background:linear-gradient(160deg,#fff,#EAF1FB);display:grid;place-items:center;box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.6)}
.logo-badge img{width:90%;height:90%;object-fit:contain}
.brand h1{margin:0;font:700 30px/1 var(--f-display);letter-spacing:.08em}
.brand p{margin:0;opacity:.75;font-size:13.5px;letter-spacing:.04em}
.road{position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--gold) 0 24px,transparent 24px 44px);opacity:.9}
.sheet{flex:1;background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:520px;width:100%;margin:0 auto}
.sheet h2{margin:0;font:600 24px var(--f-display);letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{border:1.5px solid var(--line);background:var(--sunk);border-radius:14px;padding:14px 16px;font:600 22px var(--f-display);letter-spacing:.12em;width:100%}
.field input:focus{outline:none;border-color:var(--cab-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.dots{display:flex;gap:14px;justify-content:center;padding:4px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);transition:background .15s,border-color .15s}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{border:0;background:var(--sunk);border-radius:16px;height:58px;font:600 26px var(--f-display);color:var(--ink)}
.pad button:active{background:color-mix(in srgb,var(--gold) 35%,var(--sunk))}
.pad .ghost{background:none;font-size:15px;font-family:var(--f-body);font-weight:500;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* compact login: everything fits on one phone screen without scrolling */
.login{height:100dvh;min-height:0;overflow:hidden}
.login .brand{flex-direction:row;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 20px;justify-content:flex-start}
.login .logo-badge{width:clamp(62px,9.5vh,84px);height:clamp(62px,9.5vh,84px);border-radius:22px;flex:none;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.login .brand-t{flex:1;min-width:0}
.login .brand h1{font-size:clamp(19px,3vh,24px);letter-spacing:.06em;white-space:nowrap}
.login .brand p{font-size:12.5px;margin-top:4px}
.login .langs{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);inset-inline-end:12px;transform:scale(.86);transform-origin:top right}
.login .brand{padding-top:calc(env(safe-area-inset-top,0px) + 34px)}
.login .road{height:4px}
.login .sheet{gap:clamp(8px,2vh,18px);padding-top:clamp(14px,2.4vh,22px);border-radius:24px 24px 0 0;overflow:hidden}
.login .sheet h2{font-size:clamp(19px,2.8vh,23px)}
.login .field{gap:4px}
.login .field input{padding:clamp(8px,1.4vh,13px) 14px;font-size:clamp(18px,2.6vh,21px);border-radius:12px}
.login .dots{padding:2px 0}
.login .dots i{width:14px;height:14px}
.login .pad{gap:clamp(6px,1vh,10px)}
.login .pad button{height:clamp(44px,7.4vh,62px);font-size:clamp(21px,3.1vh,26px);border-radius:14px}
.login .sheet{justify-content:center}
.login .sheet>.row{padding-top:2px}
.login .brand{min-height:0}
.login .row{font-size:13.5px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.su-new{text-align:center;font-size:14px;color:var(--muted);margin-top:2px}
.check input{width:20px;height:20px;accent-color:var(--cab-2)}
.link{background:none;border:0;color:var(--info);font-weight:600;font-size:14px;padding:6px 0}
.msg{border-radius:12px;padding:10px 12px;font-size:14px}
.msg.err{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--good-soft);color:var(--good)}
.langs{display:flex;gap:4px}
.langs button{border:1px solid rgba(255,255,255,.35);background:none;color:inherit;border-radius:8px;padding:4px 9px;font-size:12.5px}
.langs button[aria-pressed="true"]{background:var(--cab-ink);color:var(--cab)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── App shell ── */
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--cab-2),var(--cab));color:var(--cab-ink);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;box-shadow:0 8px 22px -10px rgba(10,33,57,.55)}
.av{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--gold-2),var(--gold));color:var(--gold-ink);display:grid;place-items:center;font:700 21px var(--f-display);flex:none;box-shadow:0 5px 14px -3px rgba(255,175,26,.5)}
.who{min-width:0;flex:1}
.who b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font:600 19px/1.15 var(--f-display);letter-spacing:.02em;overflow:hidden;overflow-wrap:anywhere}
.who small{opacity:.8;font-size:12.5px;display:flex;gap:8px;align-items:center}
.plate{display:inline-flex;border:1.5px solid currentColor;border-radius:4px;overflow:hidden;font:600 11.5px var(--f-display);letter-spacing:.05em}
.plate i{font-style:normal;background:currentColor;padding:0 3px}
.plate i span{color:var(--cab);font-size:8.5px}
.card .plate i span{color:var(--card)}
.plate em{font-style:normal;padding:0 6px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:none;color:inherit;display:grid;place-items:center;flex:none}
.iconbtn svg{width:15px;height:15px}
.bellbtn{position:relative}
.iconbtn img.ib{width:24px;height:24px;display:block}
.cb .dd{display:inline-block;margin-inline-start:8px;background:none;border:0;color:inherit;opacity:.75;font-size:12px;padding:0}
.cb .dd.ask{opacity:1;font-weight:700;color:var(--gold-2)}

.tgc-m{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.tgc-d{align-self:center;margin:6px 0}.tgc-d span{display:inline-block;background:rgba(23,33,43,.85);border-radius:14px;padding:4px 12px;font-size:12.5px;color:#C5D2DE;text-align:center}
.tgc .cb{max-width:80%;padding:7px 10px 5px;border-radius:14px;font-size:15px;color:#fff}
.tgc .cb.me,.tgc .cb.off{color:#fff}
.tgc .cb.me{background:#2B5278;border-end-end-radius:4px}.tgc .cb.off{background:#182533;border-end-start-radius:4px}
.tgc .cb small{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;opacity:.6;margin-top:2px}
.tgc .cb .dd{margin:0;font-size:11px}
.dmimg{display:block;max-width:100%;width:230px;border-radius:10px;margin-bottom:4px;object-fit:cover}.dmph{width:230px;height:150px;border-radius:10px;background:rgba(255,255,255,.08);margin-bottom:4px}
.dmzoom{position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.92);display:grid;place-items:center}.dmzoom img{max-width:100%;max-height:100%}
.tgc-in{display:flex;gap:8px;align-items:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tgc-pill{flex:1;display:flex;align-items:flex-end;background:#17212B;border-radius:24px;padding:2px 6px 2px 14px;min-height:48px}
.tgc-pill textarea{flex:1;min-height:44px;max-height:120px;border:0;background:none;color:#fff;font:inherit;font-size:16px;resize:none;padding:11px 0;outline:none}
.tgc-pill textarea::placeholder{color:#7D8E9E}
.tgc-clip{width:42px;height:46px;display:grid;place-items:center;cursor:pointer;border:0;background:none;font-size:21px;color:#9BB0C2;filter:grayscale(1) brightness(1.6)}
.tgc-send{width:48px;height:48px;flex:none;border:0;border-radius:50%;background:#2AABEE;color:#fff;font-size:20px;display:grid;place-items:center}
.chat{display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.cb{max-width:82%;padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.cb small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.cb.me{align-self:flex-end;background:var(--cab-2,#2F6FD6);color:#fff;border-end-end-radius:5px}
.cb.off{align-self:flex-start;background:var(--sunk,#eef1f5);color:var(--ink,#111);border-end-start-radius:5px}
.chat-in{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg,#fff);padding:8px 0}
.chat-in textarea{flex:1;min-height:44px;max-height:120px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;resize:none}
.chat-in .btn{flex:none;width:auto;padding:0 18px;height:44px}
.bell-n{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#E5484D;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--cab,#0A2A47)}
.ntc-list,.ntc-home{display:flex;flex-direction:column;gap:8px}
.ntc-home{margin-bottom:12px}
.ntc{display:flex;gap:12px;align-items:center;width:100%;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;color:inherit;font:inherit}
.ntc.unread{border-color:var(--gold);background:linear-gradient(0deg,rgba(242,189,69,.10),rgba(242,189,69,.10)),var(--card)}
.ntc-ic{width:38px;height:38px;border-radius:11px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--ink)}
.ntc-ic{color:#fff}
.ntc-ic.k-perf{background:linear-gradient(135deg,#8B6CF0,#2F6FD6)} .ntc-ic.k-orders{background:linear-gradient(135deg,#F7B531,#EE6A1F)}
.ntc-ic.k-salary{background:linear-gradient(135deg,#2BC48A,#13895A)} .ntc-ic.k-due{background:linear-gradient(135deg,#F59E5B,#E5484D)} .ntc-ic.k-fuel{background:linear-gradient(135deg,#22B8CF,#1C7ED6)} .ntc-ic.k-msg{background:linear-gradient(135deg,#3B82F6,#1E4FA8)}
.ntc-ic svg{width:15px;height:15px}
.ntc-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ntc-t b{font-weight:700} .ntc-t small{color:var(--muted);font-size:13px} .ntc-t em{font-style:normal;color:var(--muted);font-size:12px}
.iconbtn.busy svg{animation:sp 1s linear infinite}
main{flex:1;padding:14px max(14px,env(safe-area-inset-right,0px)) 96px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0;box-shadow:var(--shadow-sm)}
.card h3{margin:0 0 10px;font:600 13px var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font:600 30px/1.1 var(--f-display)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:12px;padding:11px 4px;font-weight:600;font-size:13.5px;color:var(--muted);display:flex;gap:7px;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.hero{background:radial-gradient(135% 130% at 88% -15%, #1E5E97 0%, var(--cab) 58%), linear-gradient(135deg,var(--cab),var(--cab-2));color:var(--cab-ink);border:0;position:relative;overflow:hidden;border-radius:24px;box-shadow:0 18px 40px -18px rgba(10,33,57,.6)}
.hero::after{content:"";position:absolute;inset:auto -44px -54px auto;width:196px;height:196px;border-radius:50%;border:16px solid rgba(255,175,26,.20);box-shadow:inset 0 0 60px rgba(255,175,26,.16)}

.hero::before{content:"";position:absolute;inset:auto -84px -94px auto;width:272px;height:272px;border-radius:50%;border:1px solid rgba(255,255,255,.10)}
.hero .rank{font:700 66px/0.88 var(--f-display);color:var(--gold);text-shadow:0 2px 24px rgba(255,175,26,.4)}
.hero .lbl{color:rgba(243,246,250,.7)}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:relative;z-index:1}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);position:relative;z-index:1}
.gauge{display:flex;gap:16px;align-items:center}
.gauge svg{width:92px;height:92px;flex:none}
.bar{height:8px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--cab-2);border-radius:6px}
.bar.over span{background:var(--bad)}
.tbar{height:10px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:10px}
.tbar span{display:block;height:100%;background:var(--gold);border-radius:8px}
.tbar.done span{background:#5FCB97}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:16px;padding:14px 16px;font-weight:600;width:100%;text-align:start;color:var(--ink)}
.new{background:var(--gold);color:var(--gold-ink);border-radius:16px;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;width:100%;text-align:start}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.u-next{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft,rgba(201,154,46,.14));font-weight:600;font-size:14px}
.u-next svg{width:15px;height:15px;flex:none}
.u-grid{display:grid;grid-template-columns:34px 1fr 1fr;gap:10px 12px;align-items:center}
.u-grid .bigg{width:30px;height:30px;font-size:16px;border-radius:9px}
.u-grid .mine{outline:3px solid var(--gold);outline-offset:2px}

/* ── API ── */
async function rpc(fn, args){
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 20000);   // a hung request must never block the next refresh
  let r; try { r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: "POST", signal: ac.signal, headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(args) }); } finally { clearTimeout(tm); }
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

async function doSignup(){
  const name = ($("#suName")?.value || "").trim(), rid = ($("#suRid")?.value || "").trim(), mob = ($("#suMob")?.value || "").trim();
  const pin = ($("#suPin")?.value || "").trim(), pin2 = ($("#suPin2")?.value || "").trim();
  S.su = { name, rid, mob }; S.err = "";
  if (name.length < 3) { S.err = t("su_e_name"); return render(); }
  if (!/^\d{10}$/.test(rid)) { S.err = t("need_iqama"); return render(); }
  if (!/^\d{4}$/.test(pin)) { S.err = t("su_e_pin"); return render(); }
  if (pin !== pin2) { S.err = t("su_e_match"); return render(); }
  S.busy = true; render();
  try {
    const r = await rpc("driver_signup", { p_rid: rid, p_pin: pin, p_name: name, p_mobile: mob });
    S.busy = false;
    if (r.ok) { S.view = "login"; S.rid = rid; S.su = null; S.err = ""; S.info = t("su_sent"); return render(); }
    S.err = r.error === "exists" ? t("su_e_exists") : r.error === "iqama" ? t("need_iqama") : r.error === "pin" ? t("su_e_pin") : r.error === "name" ? t("su_e_name") : r.error === "busy" ? t("su_e_busy") : t("offline");
  } catch { S.busy = false; S.err = t("offline"); }
  render();
}
async function tryLogin(){
  const rid = ($("#rid")?.value || S.rid).trim();
  S.rid = rid; S.err = ""; S.info = "";
  if (!/^\d{10}$/.test(rid)) { S.err = t("need_iqama"); S.pin = ""; return render(); }
  S.busy = true; render();
  try {
    const r = await rpc("driver_login", { p_rid: rid, p_pin: S.pin, p_remember: S.remember });
    S.busy = false; S.pin = "";
    if (r.ok) {
      S.token = r.token; store.set("asb-token", r.token, S.remember); store.set("asb-rid", rid); store.set("asb-remember", S.remember ? "1" : "0");
      S.view = "app"; S.tab = "home"; render(); await refresh(true); return;
    }
    S.err = r.error === "pending" ? t("su_pending") : r.error === "locked" ? t("locked", { n: r.minutes || 15 }) : r.error === "wrong" ? (r.left > 0 ? t("wrong", { n: r.left }) : t("wrong0")) : t("wrong0");
    render(); $("#dots")?.classList.add("shake");
  } catch { S.busy = false; S.pin = ""; S.err = t("offline"); render(); }
}

function notices(m){
  const seenF = +store.get("asb-seen-fines") || 0, seenS = store.get("asb-seen-slip") || "";
  const out = [];
  const dl = duesOf(m);
  if (dl.length > seenF && seenF >= 0 && store.get("asb-seen-fines") !== null) { const f = dl[0]; out.push(`<button class="new" data-seen="fines"><span>${t("new_fine", { a: fmt(f.amount) })}</span><span>${t("see")} →</span></button>`); }
  if (m.payslips[0] && seenS && m.payslips[0].month !== seenS) out.push(`<button class="new" data-seen="slip"><span>${t("new_slip", { m: esc(m.payslips[0].month) })}</span><span>${t("see")} →</span></button>`);
  if (store.get("asb-seen-fines") === null) store.set("asb-seen-fines", String(dl.length));
  if (!seenS && m.payslips[0]) store.set("asb-seen-slip", m.payslips[0].month);

/* the driver's own photo: cut to a square, shrink, send to the office */
async function sendPhoto(file){
  S.photoBusy = true; render();
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const side = Math.min(img.naturalWidth, img.naturalHeight), SZ = 400, c = document.createElement("canvas"); c.width = c.height = SZ;
    c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, SZ, SZ);
    // shrink quality until the data URL fits the server limit
    let data = c.toDataURL("image/jpeg", 0.82);
    for (let q = 0.72; data.length > 150000 && q >= 0.4; q -= 0.12) data = c.toDataURL("image/jpeg", q);
    const r = await rpc("driver_set_my_photo", { p_token: S.token, p_dataurl: data });
    if (r.ok) { if (S.data?.m?.profile) S.data.m.profile.photo = data; toast(t("ph_saved")); refresh(true); }
    else toast(r.error === "expired" ? t("expired") : t("ph_fail"));
  } catch { toast(t("ph_fail")); }
  S.photoBusy = false; render();
}

    try {
      const ac = new AbortController(), to = setTimeout(() => ac.abort(), 40000); let r;
      try { const resp = await fetch(`${SB_URL}/functions/v1/fuel-photo`, { method: "POST", signal: ac.signal, headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ token: S.token, photo: cam.data }) }); r = await resp.json(); } finally { clearTimeout(to); }
      if (r.ok) { S.fuelNeed = true; camStop(); toast(t("fneed_on")); S.fuelBusy = false; return render(); }
      if (r.error === "locked") { camStop(); S.fuelRes = S.fuelRes || "approved"; toast(t("fres_lock")); return render(); }
      b.disabled = false; b.textContent = "✓"; toast(t("cam_fail"));
    } catch { b.disabled = false; b.textContent = "✓"; toast(t("cam_fail")); }
  }
}, true);
document.addEventListener("click", async e => {
  const el = e.target.closest("button,[data-k],[data-fneed]"); if (!el) return;
  if (el.dataset.fneed !== undefined) {
    if (S.fuelRes) return toast(t("fres_lock"));
    if (S.working === false) return toast(t("fneed_blocked"));
    if (!S.fuelNeed) return camOpen();
    if (S.working === false) return toast(t("fneed_blocked"));
    const prev = !!S.fuelNeed; S.fuelNeed = !prev; S.fuelBusy = true; render();
    try { const r = await rpc("driver_fuel_need", { p_token: S.token, p_on: S.fuelNeed }); if (!r.ok) { S.fuelNeed = prev; if (r.error === "locked") { S.fuelRes = S.fuelRes || "approved"; toast(t("fres_lock")); } else toast(t("offline")); } else toast(t(S.fuelNeed ? "fneed_on" : "fneed_off")); } catch { S.fuelNeed = prev; toast(t("offline")); }
    S.fuelBusy = false; return render();
  }
  if (el.matches("[data-locok]")) {
    el.disabled = true;
    try { const r = await rpc("driver_loc_consent", { p_token: S.token }); if (!r.ok) { el.disabled = false; return toast(t("offline")); } } catch { el.disabled = false; return toast(t("offline")); }
    if (S.data?.m?.profile) S.data.m.profile.locConsent = true;
    S.locStarted = true; try { window.ASBAndroid.locStart(); } catch {}
    return render();
  }
  if (el.dataset.hlx) { const cur = (store.get("asb-hl-x") || "").split(",").filter(Boolean); cur.push(el.dataset.hlx); store.set("asb-hl-x", [...new Set(cur)].slice(-40).join(",")); return render(); }
  if (el.dataset.locfix) {
    const A = window.ASBAndroid;
    if (el.dataset.locfix === "gps_off") { try { A.locSettings("gps"); } catch {} return; }
    if (S.locAsked) { try { A.locSettings("app"); } catch {} return; }
    S.locAsked = true; try { A.locStart(); } catch {} return;
  }
  if (el.dataset.rpcat) { RP.cat = el.dataset.rpcat; RP.draft = $("#rpText")?.value ?? RP.draft; return render(); }
  if (el.dataset.dmdel) {
    const at = +el.dataset.dmdel;
    if (DM.ask !== at) { DM.ask = at; render(); return; }
    DM.ask = null; el.disabled = true;
    try {
      const r = await rpc("driver_msg_del", { p_token: S.token, p_at: at });
      if (r.ok) { DM.msgs = (DM.msgs || []).filter(x => +x.at !== at); DM.sig = dmSig(DM.msgs); render(); return; }
      toast(t("offline"));
    } catch { toast(t("offline")); }
    render(); return;
  }
  if (el.matches("[data-dmzoom]")) {
    const o = document.createElement("div"); o.className = "dmzoom"; o.innerHTML = `<img src="${el.src}" alt="">`; o.onclick = () => o.remove(); document.body.append(o); return;
  }
  if (el.matches("[data-dmsend]")) {
    const txt = ($("#dmText")?.value || "").trim(); if (!txt) return;
    el.disabled = true;
    try {
      const r = await rpc("driver_msg_send", { p_token: S.token, p_text: txt });
      if (r.ok) { DM.draft = ""; DM.msgs = (DM.msgs || []).concat([{ at: r.at, from: "driver", text: txt }]); DM.sig = dmSig(DM.msgs); render(); dmBottom(); return; }
      toast(r.error === "slow" ? t("dm_slow") : t("offline"));
    } catch { toast(t("offline")); }
    el.disabled = false; return;
  }
  if (el.matches("[data-rpsend]")) {
    const txt = ($("#rpText")?.value || "").trim(); if (txt.length < 5) return toast(t("rp_short"));
    el.disabled = true;
    try {
      const r = await rpc("driver_report_add", { p_token: S.token, p_cat: RP.cat, p_text: txt });
      if (r.ok) { RP.draft = ""; RP.items = null; toast(t("rp_sent")); return render(); }
      toast(r.error === "limit" ? t("rp_limit") : r.error === "short" ? t("rp_short") : t("offline"));
    } catch { toast(t("offline")); }
    el.disabled = false; return;
  }
  if (el.matches("[data-epsave]")) {
    const p = S.data?.m?.profile || {}, patch = {};
    for (const k of EP_F) if (S.ep && k in S.ep) patch[k] = S.ep[k];
    // petrol card: driver edits only the number; the "logistic" prefix is fixed
    if (S.ep && "cardnum" in S.ep) { const n = String(S.ep.cardnum).replace(/\D/g, "").slice(0, 2); patch.card = n ? ("logistic " + n) : ""; }
    if (!Object.keys(patch).length) { S.sub = null; S.ep = null; return render(); }
    el.disabled = true;
    try {
      const r = await rpc("driver_update_profile", { p_token: S.token, p_patch: patch, p_pin: S.ep?.pin || null });
      if (r.ok) { toast(t("ep_saved")); S.ep = null; S.sub = null; await refresh(true); window.scrollTo(0, 0); return; }
      if (r.error === "expired") return toLogin(t("expired"));
      toast(r.error === "pin" ? t("ep_err_pin") : r.error === "dup" ? t("ep_err_dup") : t("ep_err_bad", { f: ({ fullName: t("ep_name"), residentId: t("resident"), mobile: t("mobile"), iban: t("iban") })[r.field] || r.field || "" }));
    } catch { toast(t("offline")); }
    el.disabled = false; return;
  }
  if (el.dataset.lang) { lang = el.dataset.lang; store.set("asb-lang", lang); return render(); }
  if (el.dataset.k !== undefined) {
    $("#rid")?.blur(); S.rid = ($("#rid")?.value || S.rid).trim();
    const k = el.dataset.k;
    if (k === "del") S.pin = S.pin.slice(0, -1); else if (k === "clear") S.pin = ""; else if (S.pin.length < 4) S.pin += k;
    navigator.vibrate?.(8);
    if (S.pin.length === 4) { render(); return tryLogin(); }
    return render();
  }
  if (el.matches("[data-signup]")) { S.view = "signup"; S.err = ""; S.info = ""; S.su = null; return render(); }
  if (el.matches("[data-tologin]")) { S.view = "login"; S.err = ""; S.pin = ""; return render(); }
  if (el.matches("[data-dosignup]")) { doSignup(); return; }
  if (el.matches("[data-forgot]")) {
    S.rid = ($("#rid")?.value || S.rid).trim(); S.err = ""; S.info = "";
    if (!/^\d{10}$/.test(S.rid)) { S.err = t("need_iqama"); return render(); }
    try { await rpc("driver_forgot_pin", { p_rid: S.rid }); S.info = t("forgot_sent"); } catch { S.err = t("offline"); }
    return render();
  }
  if (el.closest(".ntc") && S.data?.m) markNoticesSeen(S.data.m);
  if (el.dataset.sub === "changes") { CH.items = null; CH.ask = null; }
  if (el.dataset.sub === "editp") S.ep = null;
  if (el.dataset.sub === "reports") RP.items = null;
  if (el.dataset.sub === "perf") { S.perfDay = null; S.perfDayData = null; S.calOpen = false; }
  if (el.dataset.sub === "history") S.archMonth = null;
  if (el.dataset.arch) { S.archMonth = el.dataset.arch; S.sub = "history"; S.tab = "home"; render(); window.scrollTo(0, 0); return; }
  if (el.matches("[data-histback]")) { S.archMonth = null; render(); window.scrollTo(0, 0); return; }
  if (el.matches("[data-cal]")) { S.calOpen = !S.calOpen; return render(); }
  if (el.dataset.calm !== undefined) { if (el.dataset.calm) S.calMonth = el.dataset.calm; return render(); }
  if (el.matches("[data-platest]")) { S.perfDay = null; S.perfDayData = null; return render(); }
  if (el.dataset.pday) {
    const d = el.dataset.pday; S.calOpen = false;
    if (d === (S.data?.m?.perf?.dates || [])[0]) { S.perfDay = null; S.perfDayData = null; return render(); }
    S.perfDay = d; S.perfDayLoading = true; render();
    try { const r = await rpc("driver_perf_day", { p_token: S.token, p_date: d }); S.perfDayData = r.ok ? r : null; } catch { S.perfDayData = null; toast(t("offline")); }
    S.perfDayLoading = false; render(); window.scrollTo(0, 0); return;
  }
  if (el.dataset.chask) { CH.ask = +el.dataset.chask; render(); setTimeout(() => $("#chText")?.focus(), 50); return; }
  if (el.matches("[data-chcancel]")) { CH.ask = null; return render(); }
  if (el.dataset.chsend) {
    const txt = ($("#chText")?.value || "").trim(); if (txt.length < 2) return;
    el.disabled = true;
    try { const r = await rpc("driver_ask", { p_token: S.token, p_audit: +el.dataset.chsend, p_text: txt }); if (r.ok) { CH.ask = null; toast(t("ch_sent")); CH.items = null; return render(); } toast(t("offline")); }
    catch { toast(t("offline")); }
    el.disabled = false; return;
  }
  if (el.dataset.sub) { S.sub = el.dataset.sub; if (S.sub !== "notices" && S.sub !== "editp" && S.sub !== "reports") S.tab = S.sub === "changes" ? S.tab : "home"; render(); window.scrollTo(0, 0); return; }
  if (el.matches("[data-subback]")) { S.sub = null; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.tq !== undefined) { S.tq = el.dataset.tq; return render(); }
  if (el.dataset.tab) { S.tab = el.dataset.tab; S.slip = null; S.sub = null; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.slip) { S.slip = el.dataset.slip; render(); window.scrollTo(0, 0); return; }
  if (el.matches("[data-back]")) { S.slip = null; return render(); }
  if (el.matches("[data-refresh]")) return refresh(true);
  if (el.dataset.duty) {
    const prev = S.duty; S.duty = el.dataset.duty; render();
    try { const r = await rpc("driver_set_duty", { p_token: S.token, p_status: S.duty }); if (!r.ok) { S.duty = prev; render(); } } catch { S.duty = prev; render(); toast(t("offline")); }
    return;
  }
  if (el.dataset.seen === "fines") { store.set("asb-seen-fines", String(duesOf(S.data.m).length)); S.tab = "fines"; return render(); }
  if (el.dataset.seen === "slip") { store.set("asb-seen-slip", S.data.m.payslips[0].month); S.tab = "salary"; S.slip = S.data.m.payslips[0].month; return render(); }
  if (el.dataset.pdf) return pdf(el.dataset.pdf);
  if (el.matches("[data-signout]")) { try { await rpc("driver_logout", { p_token: S.token }); } catch {} store.del("asb-seen-fines"); store.del("asb-seen-slip"); return toLogin(""); }
});
document.addEventListener("change", e => { if (e.target.id === "remember") S.remember = e.target.checked; });
document.addEventListener("input", e => { if (e.target.id === "rid") { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10); S.rid = e.target.value; } });
document.addEventListener("submit", e => { if (e.target.id === "loginForm") { e.preventDefault(); if (S.pin.length === 4) tryLogin(); } });
document.addEventListener("keydown", e => {
  if (S.view !== "login" || document.activeElement?.id === "rid" || S.busy) return;
  if (/^\d$/.test(e.key) && S.pin.length < 4) { S.pin += e.key; render(); if (S.pin.length === 4) tryLogin(); }
  else if (e.key === "Backspace") { S.pin = S.pin.slice(0, -1); render(); }
});

if (S.token) { S.view = "app"; render(); refresh(true); } else render();
</script>
