let signingOut = false;
function adminSignOut(){
  if (signingOut) return; signingOut = true;
  document.body.style.opacity = ".5";
  // forget the session on this device right away, then tell the server in the background
  try { for (const k of Object.keys(localStorage)) if (k.startsWith("sb-")) localStorage.removeItem(k); } catch {}
  try { sb.auth.signOut({ scope: "local" }).catch(() => {}); } catch {}
  setTimeout(() => { location.replace(location.pathname); }, 150);
}
document.addEventListener("click", e => { if (e.target.closest("[data-signout-admin]")) adminSignOut(); });

let started = false, starting = false;
async function startAdmin(session){
  auth.session = session;
  if (started || starting) return; starting = true;
  const { data: role, error } = await sb.rpc("my_admin_role");
  if (error || !role) { starting = false; auth.err = t("au_notadmin"); await sb.auth.signOut(); return renderAuth(); }
  auth.role = role;
  try { const em = (session.user?.email || "").toLowerCase(); const { data: me } = await sb.from("admins").select("perms").eq("email", em).limit(1); auth.perms = (me && me[0] && me[0].perms) || null; } catch { auth.perms = null; }
  if (started) return; started = true;
  state.mode = "admin"; state.canWrite = role !== "VIEWER";
  $("#emp").hidden = true; $("#app").hidden = false;
  db = makeDb();
  let loaded = 0; const done = () => { if (++loaded >= 3 && !state.ready) { state.ready = true; render(); } };
  db.collection("employees").onSnapshot(s => { state.emp = docsMap(s); done(); soon(); }, console.warn);
  db.collection("fines").onSnapshot(s => { state.fines = docsMap(s); done(); soon(); }, console.warn);
  db.collection("advances").onSnapshot(s => { state.adv = docsMap(s); done(); soon(); }, console.warn);
  db.collection("fuelneed").onSnapshot(s => { state.fuelneed = docsMap(s); soon(); }, console.warn);
  db.doc("config/whatsapp").onSnapshot(s => { state.wa = s.exists ? s.data() : null; soon(); }, console.warn);
  db.doc("config/tgmanagers").onSnapshot(s => { state.tgm = s.exists ? s.data() : null; soon(); }, console.warn);
  db.doc("config/tgchannel").onSnapshot(s => { state.tgc = s.exists ? s.data() : null; soon(); }, console.warn);
  db.doc("config/tgfound").onSnapshot(s => { state.tgf = s.exists ? s.data() : null; soon(); }, console.warn);
  db.doc("config/tgalerts").onSnapshot(s => { state.tga = s.exists ? s.data() : null; soon(); }, console.warn);
  db.doc("config/telegram").onSnapshot(s => { state.tg = s.exists ? s.data() : null; soon(); }, console.warn);
  db.collection("ledger").onSnapshot(s => { state.ledger = docsMap(s); soon(); }, console.warn);
  db.collection("vehicle").onSnapshot(s => { state.vehicles = docsMap(s); soon(); }, console.warn);
  db.doc("config/vehicle").onSnapshot(d => { state.vcfg = d.exists ? d.data() : {}; soon(); }, console.warn);
  db.collection("expense").onSnapshot(s => { state.expenses = docsMap(s); soon(); }, console.warn);
  db.collection("internet").onSnapshot(s => { state.internet = docsMap(s); soon(); }, console.warn);
  db.doc("config/rules").onSnapshot(s => { state.rules = { ...DEFAULT_RULES, ...(s.exists ? s.data() : {}) }; soon(); }, console.warn);
  db.doc("daily/" + todayKey()).onSnapshot(s => { state.todayDoc = s.exists ? s.data() : null; soon(); }, console.warn);
  db.collection("duty").onSnapshot(s => { state.duty = docsMap(s); soon(); }, console.warn);
  db.collection("presence").onSnapshot(s => { state.presence = docsMap(s); calmRender(); }, console.warn);
  db.collection("pinreq").onSnapshot(s => { state.pinreq = docsMap(s); soon(); }, console.warn);
  db.collection("payroll").onSnapshot(s => { state.payroll = docsMap(s); soon(); }, console.warn);
  db.collection("invoice").onSnapshot(s => { state.invoice = docsMap(s); soon(); }, console.warn);
  db.collection("orddetail").onSnapshot(s => { state.ordd = docsMap(s); soon(); }, console.warn);
  db.doc("config/month").onSnapshot(s => { state.curMonth = (s.exists && s.data().cur) || ""; soon(); }, console.warn);
  db.collection("monthly").onSnapshot(s => { state.monthly = docsMap(s); soon(); }, console.warn);
  db.collection("daily").onSnapshot(s => { state.dailyAll = docsMap(s); soon(); }, console.warn);
  db.collection("totals").onSnapshot(s => { state.totals = docsMap(s); soon(); }, console.warn);
  db.collection("fuel").onSnapshot(s => { state.fuel = docsMap(s); soon(); }, console.warn);
  let perfCleaned = false;
  db.collection("perf").onSnapshot(s => { state.perf = docsMap(s); if (!perfCleaned) { perfCleaned = true; cleanupPerf(); } soon(); }, console.warn);
  loadAdmins();
  sb.rpc("admin_log_login", { p_device: navigator.userAgent }).then(() => {}, () => {});
  sb.rpc("audit_cleanup").then(() => {}, () => {});
  purgeOldDeleted();
  setInterval(async () => {
    const { data, error } = await sb.rpc("my_admin_role");
    if (!error && !data) { toast(t("au_notadmin")); setTimeout(adminSignOut, 1500); }
    loadActivityCount();
  }, 60000);
  loadActivityCount();
  render();
}

async function boot(){
  const { data } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "SIGNED_OUT") { if (!signingOut && started) { started = false; starting = false; adminSignOut(); } return; }
    if (ev === "PASSWORD_RECOVERY") { location.hash = "admins"; setTimeout(() => { toast(t("pw_set")); $("#pwNew")?.focus(); }, 1500); }
    // never call supabase from inside this callback directly (auth-lock deadlock → endless Loading…)
    if (session && (ev === "SIGNED_IN" || ev === "INITIAL_SESSION")) setTimeout(() => startAdmin(session), 0);
  });
  if (data.session) setTimeout(() => startAdmin(data.session), 0); else renderAuth();
  // watchdog: if the panel is still loading after 12 s, reload once automatically
  setTimeout(() => { if (data.session && !state.ready) { let n = 0; try { n = +sessionStorage.getItem("asb-wd") || 0; sessionStorage.setItem("asb-wd", n + 1); } catch {} if (n < 2) location.reload(); } else { try { sessionStorage.removeItem("asb-wd"); } catch {} } }, 12000);
}
boot();
