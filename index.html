.alog .p-lang button{border:1px solid rgba(47,107,255,.35);background:#fff;color:#2f6bff;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}
.alog-wrap{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:4vw;padding:2vh 5vw 4vh 4vw}
.alog-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.alog-lg{position:relative;width:min(46vh,340px);height:min(46vh,340px);animation:alFl 6s ease-in-out infinite}

.alog-lg .rg{position:absolute;inset:0;margin:auto;border-radius:50%;border:2px solid rgba(47,107,255,.4);transform:rotateX(72deg)}
.alog-lg .rg.a{width:124%;height:124%;animation:alRz 14s linear infinite}
.alog-lg .rg.b{width:104%;height:104%;border-style:dashed;border-color:rgba(47,107,255,.28);animation:alRz 22s linear infinite reverse}
@keyframes alRz{to{transform:rotateX(72deg) rotateZ(360deg)}}@keyframes alFl{50%{transform:translateY(-14px) scale(1.03)}}
.alog-mid h1{margin:0;font:900 min(5vh,40px)/1 "Inter",system-ui,sans-serif;letter-spacing:-.02em;white-space:nowrap;background:linear-gradient(90deg,#13264f,#2f6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.alog-card{background:rgba(255,255,255,.86);border:1px solid rgba(47,107,255,.18);border-radius:26px;padding:34px;box-shadow:0 30px 70px rgba(20,50,120,.16);display:flex;flex-direction:column;gap:2px;width:100%;max-width:440px;justify-self:end}
.alog-sec{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:#5d6b88;text-transform:uppercase}.alog-sec b{color:#2f6bff;font-weight:600}
.alog-card h2{font:800 34px/1.1 "Inter","Hind Siliguri","IBM Plex Sans Arabic",sans-serif;letter-spacing:-.02em;margin:16px 0 4px}
.alog-s{color:#5d6b88;font-size:14px;margin:0 0 10px}
.alog-card label{display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:.2em;color:#5d6b88;margin-top:12px;text-transform:uppercase}

.alog-in:focus{border-color:#2f6bff;box-shadow:0 0 0 3px rgba(47,107,255,.15)}
.alog-btn{margin-top:20px;background:linear-gradient(90deg,#2f6bff,#6f9bff);color:#fff;border:0;border-radius:999px;padding:16px;font:800 13px "Inter",system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 24px rgba(47,107,255,.35)}
.alog-btn:disabled{opacity:.6}
.alog-links{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:12px}
.alog-links button{background:none;border:0;color:#5d6b88;font:13px "Inter",system-ui,sans-serif;padding:6px;cursor:pointer}
.alog-err{color:#c0392b;font-size:13px;margin:10px 0 0}.alog-note{background:#e8f0ff;color:#1f3f8f;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
@media (max-width:860px){.alog-wrap{grid-template-columns:1fr;gap:18px;padding:12px 18px 28px;align-content:start}.alog-lg{width:min(28vh,210px);height:min(28vh,210px)}.alog-lg .rg.a{width:112%;height:112%}.alog-mid{gap:16px}.alog-mid h1{font-size:min(6.2vw,28px)}.alog-card{justify-self:center;padding:24px}.alog-tag{font-size:9px;letter-spacing:.18em}}

<title>ASB Admin Panel</title>

<style>
/* Layout: fixed left rail of sections (top scroller on phones) + one working surface; tables are the main object */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#F6F8FA; --ink:#0E2233; --muted:#5A6B7A; --line:#D8E0E7;

  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1520; --surface:#112131; --sunk:#0D1A27; --ink:#E4ECF2; --muted:#8EA2B4; --line:#203546;
  --brand:#6FA8DC; --brand-ink:#08131D; --gold:#E2AE45; --gold-soft:#33280F;
  --good:#5CC492; --good-soft:#12301F; --warn:#E2AE45; --warn-soft:#33280F; --bad:#EE7F75; --bad-soft:#3A1715; --info:#7DB5E8; --info-soft:#132B42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1520; --surface:#112131; --sunk:#0D1A27; --ink:#E4ECF2; --muted:#8EA2B4; --line:#203546;
  --brand:#6FA8DC; --brand-ink:#08131D; --gold:#E2AE45; --gold-soft:#33280F;
  --good:#5CC492; --good-soft:#12301F; --warn:#E2AE45; --warn-soft:#33280F; --bad:#EE7F75; --bad-soft:#3A1715; --info:#7DB5E8; --info-soft:#132B42; color-scheme:dark}
:lang(bn){--f-body:"Hind Siliguri","IBM Plex Sans",system-ui,sans-serif}
:lang(ar){--f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;padding-block:20px;position:sticky;top:0;height:100vh}
:root[data-theme="dark"] .rail,.rail{border-inline-end:1px solid var(--line)}
.brand{padding:0 20px 18px;display:flex;gap:10px;align-items:center}
.mark{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden}
.mark img{width:92%;height:92%;object-fit:contain}
.brand b{font:700 19px/1.1 var(--f-display);letter-spacing:.03em;display:block}
.brand small{opacity:.75;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav a{color:inherit;text-decoration:none;padding:9px 12px;border-radius:8px;font-weight:500;display:flex;justify-content:space-between;gap:8px;opacity:.85}
.nav a:hover{background:color-mix(in srgb,var(--brand-ink) 10%,transparent);opacity:1}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--brand-ink) 16%,transparent);opacity:1;font-weight:600}
.nav a.nav-driver{margin-top:8px;background:var(--gold);color:#1a1205;opacity:1;font-weight:600}
.nav a.nav-sub{padding-inline-start:24px;font-size:14px}
.nav-l{display:flex;align-items:center;gap:10px;min-width:0}
.nav-ic{width:18px;text-align:center;font-size:13px;flex:none;line-height:1}.menu-btn{display:none}.dmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;position:relative}.dmbar .dm-lbl{font:600 15px var(--f-display);min-width:130px;text-align:center}.dmbar .btn.sm{padding:5px 10px}.dmpop{position:absolute;top:100%;inset-inline-start:0;z-index:30;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);width:min(300px,100%)}.dmpop .dm-y{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}.dmpop .dm-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dmpop button.dm-m{padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:none;color:inherit;font-size:13px;cursor:pointer}.dmpop button.dm-m[disabled]{opacity:.3;cursor:default}.dmpop button.dm-m.cur{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.nav .count{font-size:12px;background:var(--gold);color:#1a1205;border-radius:20px;padding:0 7px;font-weight:600}
.rail-foot{margin-top:auto;padding:16px 20px 0;display:flex;flex-direction:column;gap:10px;font-size:13px}
.lang{display:flex;gap:4px}
.lang button{flex:1;border:1px solid color-mix(in srgb,var(--brand-ink) 35%,transparent);background:none;color:var(--brand-ink);border-radius:6px;padding:4px 0;cursor:pointer;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.head h1{font:600 30px/1.1 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.gold{background:var(--gold);color:#1a1205}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.input.num{width:96px;text-align:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
label.f.check{flex-direction:row;align-items:center;text-transform:none;font-size:14px;color:var(--ink);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel h2{font:600 18px var(--f-display);letter-spacing:.02em;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font:600 30px/1.2 var(--f-display);margin-top:2px}
.kpi small{color:var(--muted);font-size:13px}
.kpi.alert{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:var(--bad-soft)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.dash-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.ordd-star{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.ordd-bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.ordd-badh{color:var(--bad)}
.dash-sec{margin:22px 0 12px;display:flex;align-items:center;gap:10px;font:600 16px var(--f-display)}
.dash-sec a{margin-inline-start:auto}
.dash-rows{display:flex;flex-direction:column}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dr:last-child{border-bottom:0}
.dr>span{font-size:13px;font-weight:600;color:var(--muted)}
.dr-v{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
a.kpi{display:block}
.scrollfab{position:fixed;inset-inline-end:10px;bottom:90px;z-index:40;display:flex;flex-direction:column;gap:8px}
.scrollfab button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:15px;cursor:pointer;opacity:.9}
@media print{.scrollfab{display:none}}
.scroll{overflow-x:auto;scrollbar-width:auto;scrollbar-color:var(--muted) transparent}
.scroll::-webkit-scrollbar{height:12px}.scroll::-webkit-scrollbar-thumb{background:var(--muted);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
.kc .kpi{padding:9px 11px}.kc .kpi b{font-size:20px}.kc .kpi span{font-size:10.5px}.dpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px;align-items:start;margin-top:4px}.dcol{min-width:0}.dcol .grid2{grid-template-columns:1fr}.vcond{border-top:1px solid var(--line,#e5e7eb);padding:10px 0}.vph{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}.vph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in}.vph-i{display:flex;flex-direction:column;gap:2px;font-size:11px}.vpill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700}.vp-ok{background:#E3F4EA;color:#1F7A4D}.vp-service{background:#E4EEFB;color:#2457A6}.vp-repair{background:#FDE8E4;color:#B42318}.vp-sub{background:#FFF0D6;color:#9A5B00}tr.clk{cursor:pointer}tr.clk:hover{background:rgba(0,0,0,.03)}.vtl{display:flex;flex-direction:column;gap:12px;padding:4px 2px}.vtl-i{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}.vtl-d{font-size:18px;line-height:1.2}.sm-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.sm-cols h4{margin:0 0 6px;font-size:12px;letter-spacing:.05em;text-transform:uppercase}.sm-ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.sm-ul li{font-size:12.5px;line-height:1.3;display:flex;flex-direction:column;gap:1px}.dsub-h{margin:10px 2px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#6b7a8a)}.fn-list{display:flex;flex-direction:column;gap:6px}.fn-i{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line,#e5e7eb)}.fn-pic{width:72px;height:54px;object-fit:cover;border-radius:8px;cursor:zoom-in;border:1px solid var(--line,#ccc)}.fn-big{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:10px;cursor:zoom-out}.fn-big img{max-width:100%;max-height:100%;border-radius:8px}.fn-i .name{flex:1}.fneed-panel{margin-bottom:12px;border-color:#D9542B}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:end}
td.nowrap{white-space:nowrap}
.name{font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.mono{font-family:var(--f-mono);font-size:13px;letter-spacing:.02em}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)}
/* Saudi plate chip */
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;font:500 12.5px var(--f-mono);white-space:nowrap}
.plate i{font-style:normal;background:var(--ink);color:var(--surface);padding:1px 4px;font-size:9px;display:grid;place-items:center;letter-spacing:.05em}
.plate em{font-style:normal;padding:1px 7px}
.rank{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:700 14px var(--f-display);background:var(--sunk);border:1px solid var(--line)}
.rank.r1{background:var(--gold);color:#1a1205;border-color:transparent}
.rank.r2{background:color-mix(in srgb,var(--muted) 30%,var(--surface))}
.rank.r3{background:color-mix(in srgb,var(--gold) 35%,var(--surface))}
.bar{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--brand)}
.bar.over span{background:var(--bad)}
.bar.done span{background:var(--good)}
.pill.nodot::before{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--card,#fff);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip b{font-weight:700;margin-inline-end:2px} .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.warn{border-color:#E7B65A;background:#FFF6E3;color:#8A5A00} .chip.warn.on{background:#8A5A00;color:#fff}
.chip-sep{width:1px;height:22px;background:var(--line);margin:0 4px}
table.emps tr.grp td{background:var(--sunk,rgba(0,0,0,.04));font-size:13px;padding-block:8px;position:sticky;top:0}
table.emps tr.dim td{opacity:.55}
table.emps td{padding-block:10px} table.emps .row-actions{flex-wrap:nowrap;white-space:nowrap}
a.tel{color:inherit;text-decoration:none} a.tel:hover{text-decoration:underline}

.rp-quote{background:var(--sunk,#F1F4F7);border-radius:10px;padding:10px;white-space:pre-wrap;font-size:14px}
.rp-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.rp-btns .btn{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.rp-b-ok.on{background:#16A34A;border-color:#16A34A;color:#fff}.rp-b-wait.on{background:#F59E0B;border-color:#F59E0B;color:#fff}.rp-b-no.on{background:#DC2626;border-color:#DC2626;color:#fff}
.pill.rp-NEW{background:#E7EEF8;color:#1F4E8C}.pill.rp-PENDING{background:#FFF1D6;color:#8A5A00}.pill.rp-APPROVED{background:#DDF5E6;color:#14703D}.pill.rp-REJECTED{background:#FDE3E3;color:#A1262B}
.iban{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;white-space:nowrap}
.seg2-o{position:relative;display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.seg2-o input{position:absolute;opacity:0;pointer-events:none}
.seg2-o b{font:600 17px var(--f-display)}
.seg2-o span{font-size:12.5px;color:var(--muted)}
.seg2-o:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
.seg2-o:has(input:focus-visible){outline:2px solid var(--gold)}
.preview-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.preview-wrap{grid-template-columns:1fr}.phone-frame{margin:0 auto}}

/* ===== Theme v2 — clean light dashboard (white cards, soft borders, violet accent) ===== */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --card:#FFFFFF; --sunk:#F7F8FC; --ink:#1B2236; --muted:#7A8196; --line:#E8EAF2;
  --brand:#6D28D9; --brand-ink:#FFFFFF; --brand-soft:#F1EBFD; --gold:#F5A524; --gold-soft:#FEF3DC;
  --good:#16A34A; --good-soft:#E6F6EC; --warn:#D97706; --warn-soft:#FEF1DC; --bad:#DC2626; --bad-soft:#FDEBEB; --info:#2563EB; --info-soft:#E8F0FE;
  --f-body:"Inter","IBM Plex Sans","Hind Siliguri","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:var(--f-body); --r:14px;
}
:lang(bn){--f-body:"Inter","Hind Siliguri",system-ui,sans-serif}
:lang(ar){--f-body:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1220; --surface:#171B2E; --card:#171B2E; --sunk:#1C2136; --ink:#E7EAF6; --muted:#97A0BC; --line:#262C45;
  --brand:#A78BFA; --brand-ink:#0F1220; --brand-soft:#262046; --gold:#F5B94A; --gold-soft:#33280F;
  --good:#4ADE80; --good-soft:#12301F; --warn:#FBBF24; --warn-soft:#33280F; --bad:#F87171; --bad-soft:#3A1715; --info:#7DB0FF; --info-soft:#132B42}}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#171B2E; --card:#171B2E; --sunk:#1C2136; --ink:#E7EAF6; --muted:#97A0BC; --line:#262C45;
  --brand:#A78BFA; --brand-ink:#0F1220; --brand-soft:#262046; --gold:#F5B94A; --gold-soft:#33280F;
  --good:#4ADE80; --good-soft:#12301F; --warn:#FBBF24; --warn-soft:#33280F; --bad:#F87171; --bad-soft:#3A1715; --info:#7DB0FF; --info-soft:#132B42}
body{font-size:14.5px;letter-spacing:0}
/* sidebar: white, text-only page names */
.rail{background:var(--surface);color:var(--ink);border-inline-end:1px solid var(--line)}
.brand b{font:700 17px/1.15 var(--f-body);letter-spacing:.01em;color:var(--ink)}
.brand small{opacity:1;color:var(--muted)}
.mark{box-shadow:none;border:1px solid var(--line)}
.nav{gap:1px;overflow-y:auto;scrollbar-width:thin;flex:1;min-height:0}
.nav a{color:var(--muted);opacity:1;font-weight:500;font-size:14px;padding:9px 14px;border-radius:10px}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a.nav-driver{background:none;color:var(--brand);border:1px dashed color-mix(in srgb,var(--brand) 45%,transparent);margin-top:10px}
.nav-ic{display:none!important}
.nav a.nav-sub{padding-inline-start:26px;font-size:13.5px}
.nav .count{background:var(--brand);color:#fff}
.lang button{border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.lang button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.rail-foot{border-top:1px solid var(--line);margin-top:8px;color:var(--muted)}
/* top bar */
.col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(28px,env(safe-area-inset-right,0px)) 14px max(28px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.topbar b{font:600 17px var(--f-body)}
.topbar .tb-r{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.topbar .tb-date{padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
main{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
/* headings, buttons, inputs */
.head h1{font:700 24px/1.2 var(--f-body);letter-spacing:-.01em}
.head p{color:var(--muted)}
.btn{background:var(--brand);color:#fff;border-radius:10px;font-weight:600;padding:8px 16px}
.btn:hover{filter:none;background:color-mix(in srgb,var(--brand) 88%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.gold{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--bad);color:#fff}
.input,select.input,textarea.input{border-radius:10px;border-color:var(--line);background:var(--surface)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
label.f{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500}
:focus-visible{outline-color:var(--brand)}
/* cards */
.panel,.kpi,.note,.gs,.cs-i,table.inner{border-radius:var(--r)}
.panel{border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,24,50,.03)}
.panel h2{font:600 15px var(--f-body);letter-spacing:0;padding:15px 18px;color:var(--ink)}
.kpis{gap:14px}
.kpi{padding:16px 18px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,24,50,.03)}
.kpi span{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--muted)}
.kpi b{font:600 26px/1.25 var(--f-body);letter-spacing:-.01em;margin-top:4px}
.kc .kpi{padding:11px 13px}.kc .kpi b{font-size:19px}.kc .kpi span{font-size:11.5px}
.dash-sec{font:600 15px var(--f-body);margin:20px 0 12px;color:var(--ink)}
.dpair{gap:16px}
/* tables */
table{font-size:13.5px}
th{background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.07em;border-bottom:1px solid var(--line);padding:12px 14px}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
tbody tr:hover td{background:var(--sunk)}
tr.clk:hover{background:var(--sunk)}
/* badges */
.pill{border-radius:99px;padding:3px 10px;font-size:12px}
.chip{border-radius:99px}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grade{border-radius:9px}
.rank.r1{background:var(--brand);color:#fff}
.bar{height:7px;border-radius:99px;background:var(--sunk)}.bar span{border-radius:99px;background:var(--brand)}
.dmbar .dm-lbl{font:600 15px var(--f-body)}
.topbar .lang button{flex:none;padding:5px 11px;font-size:12.5px;border-radius:8px}
.panel>.dash-rows{padding:2px 18px 8px}
.panel>.dash-rows .dr:first-child{padding-top:10px}
.dmpop button.dm-m.cur{background:var(--brand);color:#fff}.dmpop button.dm-m.has:not(.cur){box-shadow:inset 0 -3px 0 var(--gold,#F5A623)}.dmpop button.dm-m:disabled{opacity:.35}.dmbar.mp{display:inline-flex;vertical-align:middle}
dialog{border-radius:16px;box-shadow:0 20px 60px rgba(20,24,50,.25)}
.dlg-h h3{font:600 18px var(--f-body)}
.toast{border-radius:12px}
.monthbar{border-radius:var(--r);background:var(--surface)}
.monthbar .mb-txt b{font:600 16px var(--f-body)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{background:var(--surface)!important}
  .rail{border-inline-end:0;border-bottom:1px solid var(--line)}
  .topbar{display:none}
  .menu-btn{border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
  .mobile-tools .out-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .nav a{padding:10px 12px}
  main{padding-block:16px 60px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .head h1{font-size:21px}
}

/* ===== Theme v3 — match the reference template ===== */
:root{--bg:#F4F5FA}
.rail{width:232px}
.nav a{gap:10px;justify-content:flex-start;padding:9px 12px}
.nav a .nav-l{flex:1}
.nav-ic{display:grid!important;place-items:center;width:30px;height:30px;border-radius:50%;font-size:0}
.nav-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"] .nav-ic{background:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 20%,transparent)}
.nav a.nav-sub{padding-inline-start:30px}.nav a.nav-sub .nav-ic{width:24px;height:24px}.nav a.nav-sub .nav-ic svg{width:14px;height:14px}
.topbar{gap:16px;padding-block:12px}
.topbar .tb-title{display:none}
.tb-search{display:flex;align-items:center;gap:8px;flex:1;max-width:460px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface)}
.tb-search svg,.tb-ib svg,.tb-user svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb-search span{color:var(--muted);display:grid}
.tb-search input{border:0;outline:0;background:none;padding:11px 0;flex:1;min-width:0;font-size:14px}
.tb-r{margin-inline-start:auto}
.tb-ib{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;text-decoration:none}
.tb-ib:hover{background:var(--sunk);color:var(--ink)}
.tb-plus{border-color:color-mix(in srgb,var(--brand) 45%,transparent);background:var(--brand-soft);color:var(--brand)}
.tb-user{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;color:var(--ink);font:500 14px var(--f-body);padding:2px 4px 2px 2px}
.tb-av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.tb-user #tbOut{color:var(--muted);display:grid}
.topbar .tb-date{display:none}
@media (min-width:1180px){.topbar .tb-date{display:block}}
/* grouped KPI cards */
.kgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;margin-bottom:18px}
.kgrp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;box-shadow:0 1px 2px rgba(20,24,50,.03)}
.kgrp h3{margin:0 0 12px;font:600 15px var(--f-body)}
.kbox{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.km{flex:1;min-width:0;padding:14px 16px;color:inherit;text-decoration:none;display:block}
.km+.km{border-inline-start:1px solid var(--line)}
.km:hover{background:var(--sunk)}
.km span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.km b{display:block;font:500 25px/1.2 var(--f-body);letter-spacing:-.01em}
.km small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.km b span.dec,.kpi b span.dec,.dec{display:inline!important;margin:0!important;font-size:inherit!important;color:var(--muted);opacity:.65;text-transform:none;letter-spacing:0}
.kpi b .dec,.km b .dec{font-weight:400}
@media (max-width:860px){.kbox{flex-wrap:wrap}.km{flex:1 1 130px}.km b{font-size:22px}.rail{width:auto}.nav-ic{width:26px;height:26px}}

/* ===== Theme v4 — tighter layout, bigger nav icons ===== */
.dpair{align-items:stretch;gap:16px;margin:4px 0 16px}
.dcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;box-shadow:0 1px 2px rgba(20,24,50,.03)}
.dcol .dash-sec{margin:0 0 12px;flex-wrap:wrap}
.dcol .dash-sec a{margin-inline-start:auto}
.dcol .kpis{margin-bottom:12px}
.dcol .kc .kpi{border-radius:12px;box-shadow:none;background:var(--sunk)}
.dcol .dsub-h{margin:14px 0 6px}
.dcol>.panel{border:0;box-shadow:none}
.grid2{align-items:start}
.dcol .dash-rows .dr{padding:8px 0}
.dash-sec{margin:16px 0 10px}
.nav a{padding:6px 10px;gap:12px;font-size:14.5px}
.nav-ic{width:36px;height:36px}
.nav-ic svg{width:21px;height:21px;stroke-width:1.6}
.nav a.nav-sub .nav-ic{width:30px;height:30px}.nav a.nav-sub .nav-ic svg{width:17px;height:17px}
.tb-ib{width:44px;height:44px}.tb-ib svg,.tb-search svg,.tb-user svg{width:21px;height:21px}
.tb-av{width:42px;height:42px}
@media (max-width:860px){.nav-ic{width:30px;height:30px}.nav-ic svg{width:18px;height:18px}.dcol{padding:14px}}

.mk-stop b{display:block;background:#E8590C;color:#fff;border-radius:11px;font:700 11px/22px system-ui;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px #0005;white-space:nowrap}

/* Theme v5: Employees and Payroll fit the page width on desktop (no sideways scroll) */
@media(min-width:900px){
 table.emps th,table.emps td{padding-inline:6px;font-size:12.5px} table.emps th{white-space:normal}
 table.emps .row-actions{flex-wrap:wrap;white-space:normal;gap:4px}
 table.emps td:first-child{max-width:190px}
 table.pay th,table.pay td{padding:7px 3px;font-size:11px;line-height:1.25} table.pay th{white-space:normal;vertical-align:bottom;word-break:normal;letter-spacing:0;text-transform:none;font-size:10.5px;font-weight:600}
 table.pay .input.num{width:46px;min-width:0;padding:5px 3px;font-size:11px} table.pay td *{min-width:0} table.pay .row-actions{flex-wrap:wrap}
 table.pay td:first-child{max-width:130px;white-space:normal}
}

body{background:linear-gradient(175deg,#06324f,#04203a 55%,#021224);background-color:#04203a}
body::after{content:"";position:fixed;inset:-12%;background:radial-gradient(circle at 80% 6%,rgba(60,220,255,.45) 0,transparent 36%),radial-gradient(circle at 8% 55%,rgba(60,120,255,.38) 0,transparent 40%),radial-gradient(circle at 88% 90%,rgba(40,230,200,.28) 0,transparent 38%);pointer-events:none;z-index:-2}
html::before{content:"";position:fixed;inset:0;background:var(--wm) center 52%/min(90%,760px) auto no-repeat;opacity:.34;pointer-events:none;z-index:-1}
.rail{background:linear-gradient(180deg,#0f5278,#08304e);border-inline-end:1px solid rgba(170,240,255,.3);box-shadow:14px 0 30px -16px rgba(0,8,30,.8)}
.nav a[aria-current="page"]{background:linear-gradient(145deg,rgba(170,248,255,.95),rgba(50,196,238,.9));color:#04304a;box-shadow:0 0 16px rgba(127,246,255,.5),inset 0 2px 2px rgba(255,255,255,.6)}
.nav a.nav-driver{background:linear-gradient(145deg,#FFD166,#FFAF1A);box-shadow:0 0 14px rgba(255,175,26,.4),inset 0 2px 3px rgba(255,255,255,.5)}
.mark{box-shadow:0 0 22px rgba(127,246,255,.45),0 6px 14px rgba(0,8,30,.5)}
.panel,.kpi,dialog,.card{background:var(--glass);border:1px solid rgba(170,240,255,.4);border-radius:16px;box-shadow:var(--shd),var(--rim)}
.kpi b{color:#fff;text-shadow:0 0 14px rgba(127,246,255,.35)}
.panel h2{border-bottom:1px solid rgba(170,240,255,.25)}
.btn{background:linear-gradient(145deg,#3cbeeb,#1e64b4);box-shadow:0 12px 20px -10px rgba(0,8,30,.8),inset 0 2px 2px rgba(255,255,255,.4)}
.btn.gold{background:linear-gradient(145deg,#FFD166,#FFAF1A);color:#2A1A00}
.btn.ghost{background:rgba(160,240,255,.12);border-color:rgba(170,240,255,.4)}
.btn.danger{background:linear-gradient(145deg,#ff8a7e,#d8473a);color:#fff}
.input,select.input,textarea.input{background:rgba(3,22,40,.55);border-color:rgba(170,240,255,.35);color:#fff}
.input:focus{border-color:#7ff6ff;box-shadow:0 0 0 3px rgba(127,246,255,.25)}
table thead th,table th{color:#cfeef7}
table td,table th{border-color:rgba(170,240,255,.18)}
table.emps tr.grp td{background:rgba(3,22,40,.55)}
.chip{background:rgba(160,240,255,.12);border-color:rgba(170,240,255,.35);color:#fff}
.chip.on{background:linear-gradient(145deg,#aaf8ff,#32c4ee);color:#04304a;border-color:#aaf8ff}
.chip.warn{background:rgba(255,201,77,.18);color:#FFD98A;border-color:rgba(255,201,77,.5)}
.chip.online{background:rgba(95,224,170,.18);color:#8DF0C4;border-color:rgba(95,224,170,.5)}
.pill.p-bad{background:rgba(255,154,142,.2);color:#FFB3AA}.pill.p-ok{background:rgba(95,224,170,.2);color:#8DF0C4}
dialog::backdrop{background:rgba(2,12,24,.7)}
.scrollfab button{background:#0f3a5c;border-color:rgba(170,240,255,.4)}

@keyframes lgb{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.05);opacity:.42}}
@keyframes mkg{0%,100%{box-shadow:0 0 14px rgba(127,246,255,.35),0 6px 14px rgba(0,8,30,.5)}50%{box-shadow:0 0 30px rgba(127,246,255,.8),0 6px 14px rgba(0,8,30,.5)}}
@keyframes nvg{0%,100%{box-shadow:0 0 10px rgba(127,246,255,.35),inset 0 2px 2px rgba(255,255,255,.6)}50%{box-shadow:0 0 22px rgba(127,246,255,.75),inset 0 2px 2px rgba(255,255,255,.6)}}
html::before{animation:lgb 9s ease-in-out infinite;will-change:transform,opacity}
.mark{animation:mkg 3.5s ease-in-out infinite}
.nav a[aria-current="page"]{animation:nvg 3.5s ease-in-out infinite}

/* interactive square crop: drag to move, slider to zoom, so the face sits in the middle */
let photoCrop = null;
const CROP_F = 220;
function drawCrop(){
  const p = photoCrop, cv = $("#cropCanvas"); if (!p || !cv) return;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#0A2A47"; ctx.fillRect(0, 0, p.F, p.F);
  ctx.drawImage(p.img, p.ox, p.oy, p.img.width * p.scale, p.img.height * p.scale);
}
function clampCrop(){
  const p = photoCrop, w = p.img.width * p.scale, h = p.img.height * p.scale;
  // allow the image to be smaller than the frame (zoom-out shows navy padding around it)
  p.ox = Math.min(Math.max(0, p.F - w), Math.max(Math.min(0, p.F - w), p.ox));
  p.oy = Math.min(Math.max(0, p.F - h), Math.max(Math.min(0, p.F - h), p.oy));
}
function openCropUI(file){
  const img = new Image();
  img.onload = () => {
    const F = CROP_F, baseScale = F / Math.min(img.width, img.height), scale = baseScale;
    // minimum zoom = whole photo fits inside the frame (contain), so the face can be made smaller
    const minZoom = Math.min(img.width, img.height) / Math.max(img.width, img.height);
    photoCrop = { img, F, baseScale, scale, ox: (F - img.width * scale) / 2, oy: (F - img.height * scale) / 2 };
    $("#empPhotoPrev").innerHTML = `<div class="cropwrap"><canvas id="cropCanvas" width="${F}" height="${F}"></canvas><input type="range" id="cropZoom" min="${minZoom}" max="4" step="0.01" value="1" aria-label="zoom"><span class="sub">${t("photo_crop_hint")}</span></div>`;
    const cv = $("#cropCanvas"); drawCrop();
    let dragging = false, lx = 0, ly = 0;
    const pt = ev => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
    cv.addEventListener("pointerdown", ev => { dragging = true; cv.setPointerCapture(ev.pointerId); const q = pt(ev); lx = q.x; ly = q.y; ev.preventDefault(); });
    cv.addEventListener("pointermove", ev => { if (!dragging) return; const q = pt(ev); photoCrop.ox += q.x - lx; photoCrop.oy += q.y - ly; lx = q.x; ly = q.y; clampCrop(); drawCrop(); });
    cv.addEventListener("pointerup", () => { dragging = false; });
    $("#cropZoom").addEventListener("input", ev => {
      const ns = photoCrop.baseScale * (+ev.target.value), old = photoCrop.scale, cx = photoCrop.F / 2, cy = photoCrop.F / 2;
      photoCrop.ox = cx - (cx - photoCrop.ox) * (ns / old); photoCrop.oy = cy - (cy - photoCrop.oy) * (ns / old);
      photoCrop.scale = ns; clampCrop(); drawCrop();
    });
  };
  img.src = URL.createObjectURL(file);
}
async function cropBlob(){
  const p = photoCrop, OUT = 480, k = OUT / p.F;
  const c = document.createElement("canvas"); c.width = c.height = OUT;
  const g = c.getContext("2d");
  g.fillStyle = "#0A2A47"; g.fillRect(0, 0, OUT, OUT);
  g.drawImage(p.img, p.ox * k, p.oy * k, p.img.width * p.scale * k, p.img.height * p.scale * k);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", 0.86));
}

/* a stop = the phone stayed within ~120 m for 5+ minutes (gaps over 20 min break it) */
function findStops(P){

    if (min >= 5) { const seg = P.slice(i, j + 1); out.push({ a: P[i].at, b: P[j].at, min, lat: seg.reduce((x, q) => x + q.lat, 0) / seg.length, lng: seg.reduce((x, q) => x + q.lng, 0) / seg.length }); i = j + 1; } else i++;
  }
  return out;
}

/* read a Keeta invoice (Excel/CSV): match by Courier ID, map columns by their Arabic headers */
function parseKeetaInvoice(text){
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).map(l => l.split(/\t|,|;/).map(c => c.trim().replace(/^"|"$/g, "")));
  let hi = lines.findIndex(c => c.some(x => /إجمالي|الطلبات|التسعير|الخصم|حوافز|المستحق|المُسلمة/.test(x)));
  const cols = {};
  if (hi >= 0) lines[hi].forEach((h, i) => {
    if (/إجمالي|المستحق/.test(h)) cols.total = i; else if (/المُسلمة|المسلمة|الطلبات/.test(h)) cols.o = i;
    else if (/التسعير/.test(h)) cols.price = i; else if (/سعة/.test(h)) cols.cap = i; else if (/تجربة/.test(h)) cols.exp = i;
    else if (/الخصم/.test(h)) cols.disc = i; else if (/تلف|الطعام/.test(h)) cols.food = i;
    else if (/التسجيل|رسوم/.test(h)) cols.reg = i; else if (/تعديل/.test(h)) cols.adj = i;
  });
  const num = v => { const n = parseFloat(String(v ?? "").replace(/[^\d.\-]/g, "")); return isNaN(n) ? undefined : n; };
  const out = [];
  for (let r = 0; r < lines.length; r++) { if (r === hi) continue; const c = lines[r];
    const id = c.find(x => /^\d{12,20}$/.test(x)); if (!id) continue;
    const row = {}; for (const f of ["o", "price", "cap", "exp", "disc", "food", "reg", "adj", "total"]) if (cols[f] != null) { const v = num(c[cols[f]]); if (v !== undefined) row[f] = v; }
    if (row.total == null) { const nums = c.map(num).filter(v => v !== undefined); if (nums.length) row.total = nums[nums.length - 1]; }
    out.push({ id, row });
  }
  return out;
}

/* read a Keeta order report (Excel/CSV): map columns by header, keyed by Courier ID (column A) */
function parseOrderDetails(text){
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).map(l => l.split(/\t|,|;/).map(c => c.trim().replace(/^"|"$/g, "")));
  const mapHead = h => { h = h.toLowerCase();
    if (/courier id/.test(h)) return "id";
    if (/severely overdue/.test(h)) return "p";
    if (/overdue order tasks/.test(h)) return "o";
    if (/over 55|prop\./.test(h)) return "n";
    if (/avg delivery time/.test(h)) return "m";
    if (/large order on-time|large.*on-time/.test(h)) return "l";
    if (/on-time rate/.test(h)) return "k";
    if (/completion rate/.test(h)) return "j";
    if (/cancellation/.test(h)) return "i";
    if (/rejected.*courier/.test(h)) return "g";
    if (/rejected.*auto/.test(h)) return "h";
    if (/rejected/.test(h)) return "f";
    if (/large order tasks completed/.test(h)) return "e";
    if (/delivered/.test(h)) return "d";
    if (/restaurant arrivals/.test(h)) return "c";
    if (/accepted/.test(h)) return "b";
    return null;
  };
  let hi = lines.findIndex(c => c.some(x => /courier id/i.test(x)) && c.some(x => /delivered/i.test(x)));
  const col = {};
  if (hi >= 0) lines[hi].forEach((h, idx) => { const k = mapHead(h); if (k && col[k] == null) col[k] = idx; });
  const byPos = Object.keys(col).length <= 3; // header not found/usable → fall back to fixed A..P order
  const num = v => { const n = parseFloat(String(v ?? "").replace(/[^\d.\-]/g, "")); return isNaN(n) ? undefined : n; };
  const keys = ["b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o", "p"];
  const out = [];
  for (let r = 0; r < lines.length; r++) { if (r === hi) continue; const c = lines[r];
    const id = (col.id != null ? c[col.id] : c[0]) || c.find(x => /^\d{12,20}$/.test(x));
    if (!id || !/^\d{12,20}$/.test(id)) continue;
    const row = {};
    if (byPos) keys.forEach((k, i) => { const v = num(c[i + 1]); if (v !== undefined) row[k] = v; });
    else for (const k of keys) if (col[k] != null) { const v = num(c[col[k]]); if (v !== undefined) row[k] = v; }
    out.push({ id, row });
  }
  return out;
}

async function jpegBlob(file, max = 1100, q = 0.72){
  const img = await createImageBitmap(file), sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, "image/jpeg", q));
}

    out.push({ url: sb.storage.from("vehicle-photos").getPublicUrl(path).data.publicUrl, path }); }

/* ───────── Payroll ───────── */
const numOrNull = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
function planOf(e){
  const R = state.rules, rank = (e.payType || "TARGET") === "TARGET", P = rank ? "r" : "u";
  const abc = f => ({ A: +f("A"), B: +f("B"), C: +f("C") });
  return { rank, min: +R[P + "Min"], rate: +R[P + "Rate"], t1: +R[P + "T1"], t2: +R[P + "T2"],
    b1: rank ? abc(g => R["rB1" + g]) : abc(() => R.uB1), b2: rank ? abc(g => R["rB2" + g]) : abc(() => R.uB2),
    ex1: rank ? abc(g => R["rx1" + g]) : abc(g => R["ex1" + g]), ex2: rank ? abc(g => R["rx2" + g]) : abc(g => R["ex2" + g]),
  };
}
/* Pay rating: the one set on the Target page, else the latest Keeta grade, else C. */
function payGrade(id, e){
  if (e.tGrade) return { g: e.tGrade, src: "set" };
  const j = perfDays().slice(0, 3).map(d => state.perf[d]?.rows?.[id]?.g).find(g => ["A", "B", "C", "D"].includes(g));
  if (j) return { g: j, src: "jahez" };
  return { g: "C", src: "default" };
}
/* Next order milestone: 380 → 500 → 600 (from the pay rules). */
function targetFor(e, orders){
  const p = planOf(e);
  return orders < p.min ? p.min : orders < p.t1 ? p.t1 : p.t2;
}
/* Rank and Unrank use the same ladder with their own prices:
   under 380 orders or D rating (500+) → the company decides (manual salary);
   380–499 → price per order; 500–599 → level-2 salary (by rating for Rank) + orders above 500 × rating price;
   600+ → level-3 salary + orders above 600 × rating price. */
function payFor(e, orders, grade = "C"){
  if (e.payType === "FLAT") { const r = +e.poRate || 0; return r > 0 ? { base: orders * r, bonus: 0, shortfall: 0, tier: 0, flat: true } : { base: 0, bonus: 0, shortfall: 0, manual: "norate", tier: 0 }; }
  const p = planOf(e), g = ["A", "B", "C"].includes(grade) ? grade : "C";
  if (orders < p.min) return { base: 0, bonus: 0, shortfall: 0, manual: "below", tier: 0 };
  if (orders >= p.t1 && grade === "D") return { base: 0, bonus: 0, shortfall: 0, manual: "gradeD", tier: orders < p.t2 ? 2 : 3 };
  if (orders < p.t1) return { base: orders * p.rate, bonus: 0, shortfall: 0, tier: 1 };
  if (orders < p.t2) return { base: p.b1[g], bonus: (orders - p.t1) * p.ex1[g], shortfall: 0, tier: 2 };
  return { base: p.b2[g], bonus: (orders - p.t2) * p.ex2[g], shortfall: 0, tier: 3 };
}
/* Fuel allowance (separate from salary): 380–499 → 2 SAR/order, 500+ → 2.5 SAR/order. */
function fuelAllowance(e, orders){
  if (e.payType === "FLAT") return 0;
  const n = Math.min(Math.max(0, +orders || 0), 1000); // orders 1..1000
  return r2(n * (+state.rules.fuelPer || 0));           // one rate per order, Rank/Unrank same
}

/* Keeta daily driver report: g grade (A best … D, "-" not graded), rp ranking % (lower is better),
   fa forced-assignment score, ot on-time, cr completion (not delivery related), ne "Delivered" not pressed too early. */
const PERF_F = [["g", "pf_grade"], ["rp", "pf_rank"], ["fa", "pf_forced"], ["ot", "pf_ontime"], ["cr", "pf_complete"], ["ne", "pf_early"]];
const GRADES = ["A", "B", "C", "D", "-"];
const gradeCls = g => ({ A: "g-a", B: "g-b", C: "g-c", D: "g-d" }[g] || "g-x");
function perfDelta(k, y, v){
  if (y === undefined || y === null || v === undefined || v === null || y === "" || v === "") return 0;
  if (k === "g") return GRADES.indexOf(y) - GRADES.indexOf(v);            // A after B = better
  if (k === "rp") { if (+v === 0 || +y === 0) return 0; return +y - +v; }   // lower % is better
  return +v - +y;
}
function perfCell(k, y, v){
  if (v === undefined || v === null || v === "") return `<span class="sub">${t("none")}</span>`;
  const d = perfDelta(k, y, v), arrow = d > 0 ? `<span class="chg up">▲</span>` : d < 0 ? `<span class="chg down">▼</span>` : "";
  const main = k === "g" ? `<span class="grade ${gradeCls(v)}">${esc(v)}</span>` : `${(+v).toFixed(2)}%`;
  const prev = y === undefined || y === null || y === "" ? "" : `<div class="sub">${t("perf_yest")}: ${k === "g" ? esc(y) : (+y).toFixed(2) + "%"}</div>`;
  return `<div class="pc">${main} ${arrow}</div>${prev}`;
}

/* Parse rows copied from the Keeta report (Excel, Sheets or CSV). Columns:
   driver ID, name, grade, ranking %, forced assignment %, on-time %, completion %, not-early % [, order volume].
   The new Keeta export gives rates as fractions (0.9993 = 99.93%) and adds the month's total orders up to yesterday. */
function parseJahez(text){
  const out = [];
  for (const line of text.replace(/^﻿/, "").split(/\r?\n/)) {
    let cells = line.split(/\t|,|;/).map(c => c.trim().replace(/^"|"$/g, "")).filter(c => c !== "");
    if (cells.length < 4) continue;
    if (/^\d{12,20}$/.test(cells[cells.length - 1]) && !/^\d{12,20}$/.test(cells[0])) cells.reverse(); // copied right-to-left
    const id = cells.find(c => /^\d{12,20}$/.test(c)) || "";
    const grade = (cells.find(c => /^[A-Da-d]$|^[-–—]$/.test(c)) || "").toUpperCase().replace(/[–—]/, "-");
    const nums = cells.filter(c => c !== id && /^-?\d+(\.\d+)?\s*%?$/.test(c)).map(c => parseFloat(c));
    const name = cells.find(c => c !== id && c.toUpperCase() !== grade && !/^-?\d+(\.\d+)?\s*%?$/.test(c) && !/^[-–—]$/.test(c)) || "";
    if (!id && !name) continue;
    if (nums.length < 5) continue;
    let vol = null, five = nums.slice(-5);
    if (nums.length >= 6 && five.slice(0, 4).every(v => v <= 1) && nums[nums.length - 1] > 1) { vol = Math.round(nums[nums.length - 1]); five = nums.slice(-6, -1); }
    if (!line.includes("%") && five.every(v => v <= 1)) five = five.map(v => Math.round(v * 10000) / 100);
    const [rp, fa, ot, cr, ne] = five;
    out.push({ id, name, vol, row: { g: grade || "-", rp, fa, ot, cr, ne } });
  }
  return out;
}
const normName = n => String(n || "").toLowerCase().replace(/\s+/g, " ").trim();
/* read an uploaded report: Excel (.xlsx/.xls) via SheetJS, or plain CSV/TSV text */
async function reportText(file){
  const name = (file.name || "").toLowerCase();
  if (/\.(xlsx|xlsm|xls)$/.test(name)) {
    if (!window.XLSX) throw new Error("xlsx-missing");
    const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: "array" });
    let out = "";
    for (const sh of wb.SheetNames) { const ws = wb.Sheets[sh]; if (ws) out += XLSX.utils.sheet_to_csv(ws, { FS: "\t", blankrows: false }) + "\n"; }
    return out;
  }
  return await file.text();
}
/* keep yesterday and today, plus every report taken on the 2nd (it closes a pay month and stays for good) */

  for (const id of Object.keys(state.perf)) if (id < cut) { try { await db.doc("perf/" + id).delete(); } catch {} }
}

/* ───────── Payroll ↔ Dues: what a payroll would take from each driver's dues (used by the confirm screen and by Publish itself) ───────── */
const dueLeftOf = (eid, cat) => r2(openDuesOf(eid).filter(x => x.type === cat).reduce((s, x) => s + dueRemaining(x), 0));
function dedPlan(slips){
  const take = {}, over = [], rows = [];
  for (const s of slips) {
    const mine = {};
    for (const [key, cat] of Object.entries(PAY_LINK)) {
      let left = r2(+s[key] || 0); if (left <= 0) continue;
      for (const x of openDuesOf(s.id).filter(x => x.type === cat)) {
        if (left <= 0) break;
        const tk = r2(Math.min(left, dueRemaining(x))); if (tk <= 0) continue;
        mine[x.coll + "/" + x.id] = r2((mine[x.coll + "/" + x.id] || 0) + tk); left = r2(left - tk);
      }
      if (left > 0.001) over.push({ id: s.id, key, cat, amt: s[key], left: dueLeftOf(s.id, cat) });
    }
    for (const p of s.planned ?? []) { const path = (p.kind === "fine" ? "fines/" : "advances/") + p.id; mine[path] = r2((mine[path] || 0) + (+p.amount || 0)); }
    if (!Object.keys(mine).length) continue;
    take[s.id] = mine;
    const byCat = {};
    for (const [path, amt] of Object.entries(mine)) { const d = dueAt(path); if (d) byCat[d.type] = r2((byCat[d.type] || 0) + amt); }
    for (const [cat, amt] of Object.entries(byCat)) { const before = dueLeftOf(s.id, cat); rows.push({ id: s.id, name: state.emp[s.id]?.fullName || s.name || s.id, cat, before, amt, after: r2(before - amt) }); }
  }
  rows.sort((a, b) => a.name.localeCompare(b.name));
  return { take, over, rows };
}
/* put a payroll's deductions back on the dues and write the reversal in the ledger */
async function giveBackDues(m, one, why){
  const today = todayKey(), by = auth.session?.user?.email || "";
  for (const [coll, map] of [["fines", state.fines], ["advances", state.adv]]) for (const [did, x] of Object.entries(map)) {
    if (one && x.employeeId !== one) continue;
    const h = x.history ?? [], gone = h.filter(z => z.month === m && isPayrollEntry(z)); if (!gone.length) continue;
    for (const z of gone) {
      await db.doc("ledger/R" + uid()).set({ kind: "REVERSE", employeeId: x.employeeId, cat: coll === "advances" ? "ADVANCE" : (x.category || "OTHER"), dueRef: coll + "/" + did,
        amount: r2(+z.amount || 0), month: m, date: today, original: z.lid || "", reason: why, by, createdAt: Date.now() });
      if (z.lid && state.ledger[z.lid]) await db.doc("ledger/" + z.lid).update({ reversed: true, reversedAt: Date.now() });
    }
    await db.doc(coll + "/" + did).update(withHistory(+x.amount || 0, h.filter(z => !(z.month === m && isPayrollEntry(z)))));
  }
}
function computePayroll(){
  const R = state.rules, m = state.payMonth;
  const tot = monthRows(m);
  const savedAdj = payDoc()?.adj ?? {};
  // nothing is deducted automatically: deductions are entered by hand at month end
  const schedules = [];

  const manual = {};
  for (const [kind, map] of [["fine", state.fines], ["adv", state.adv]]) for (const x of Object.values(map)) for (const h of x.history ?? [])
    if (h.src === "manual" && !h.cash && h.month === m) { const k = (manual[x.employeeId] ??= { fine: 0, adv: 0 }); k[kind] = r2(k[kind] + (+h.amount || 0)); }
  return payEmps().map(([id, e]) => {
    const orders = tot[id]?.o ?? 0, fuelSpent = r2(tot[id]?.f ?? 0);
    const a = { ...(savedAdj[id] ?? {}), ...(state.adjDraft[id] ?? {}) };
    const pg = payGrade(id, e), pay = payFor(e, orders, pg.g);
    let { base, bonus, shortfall } = pay;
    if (pay.manual) base = +a.man || 0;
    const incent = +a.incent || 0, overtime = +a.overtime || 0, other = +a.other || 0;
    // named deduction / bonus columns (entered by hand, matching the salary sheet)
    const traffic = +a.traffic || 0, accident = +a.accident || 0, company = +a.company || 0, akash = +a.akash || 0, keeta = +a.keeta || 0, advanceM = +a.advance || 0, duesBonus = +a.duesBonus || 0;
    const namedDed = r2(traffic + accident + company + akash + keeta + advanceM);
    const allowance = r2(fuelAllowance(e, orders));
    const fuelAdj = r2((+a.fuel || 0) + allowance - (e.payType === "FLAT" ? 0 : fuelSpent));
    const absDed = r2((+a.abs || 0) * (+R.absence || 0));
    const gross = r2(base + bonus + incent + overtime + duesBonus + Math.max(0, fuelAdj) + Math.max(0, other));
    let avail = r2(gross - shortfall - absDed - namedDed + Math.min(0, fuelAdj) + Math.min(0, other));
    const planned = []; let fineDed = manual[id]?.fine || 0, advDed = manual[id]?.adv || 0;
    avail = r2(avail - fineDed - advDed);
    // a hand-typed amount in a Dues-linked column replaces the automatic instalment of that category
    const typedCats = new Set(Object.entries(PAY_LINK).filter(([k]) => (+a[k] || 0) > 0).map(([, c]) => c));
    for (const s of schedules.filter(s => s.employeeId === id && !typedCats.has(s.kind === "adv" ? "ADVANCE" : (s.category || "OTHER")))) {
      if (avail <= 0) break;
      const take = r2(Math.min(+s.monthly || 0, +s.remaining || 0, avail)); if (take <= 0) continue;
      planned.push({ id: s.id, kind: s.kind, amount: take });
      if (s.kind === "fine") fineDed += take; else advDed += take;
      avail = r2(avail - take);
    }
    const net = Math.max(0, avail);
    const lk = {}; for (const [k, cat] of Object.entries(PAY_LINK)) { const v = r2(+a[k] || 0), left = dueLeftOf(id, cat); lk[k] = { left, over: v > left + 0.001 }; }
    // sheet-style total deductions: L+M+N+P+Q+R + petrol over-spend + shortfall + absence + dues taken
    const sded = r2(namedDed + Math.max(0, -fuelAdj) + shortfall + absDed + fineDed + advDed);
    return { id, name: e.fullName, residentId: e.residentId, payType: e.payType || "TARGET", orders, fuelSpent,
      base: r2(base), bonus: r2(bonus), due: r2(base + bonus), incent, overtime, shortfall: r2(shortfall), fuelAdj, other, absDed, absShifts: +a.abs || 0, allowance, grade: pg.g, gradeSrc: pg.src, manual: pay.manual || "",
      traffic: r2(traffic), accident: r2(accident), company: r2(company), akash: r2(akash), keeta: r2(keeta), advance: r2(advanceM), duesBonus: r2(duesBonus),
      valid: a.valid !== false, reason: a.reason || "", extraOrders: +a.extraOrders || null, extraRate: +a.extraRate || null,
      fineDed: r2(fineDed), advDed: r2(advDed), gross, deductions: r2(gross - net), sded, net: r2(net), planned, lk, adj: a };
  });
}

      const m = state.payMonth, nm = id => state.emp[id]?.fullName || id;
      const overTxt = o => t("pa_over", { n: nm(o.id), c: t(o.cat), a: fmt(o.amt), l: fmt(o.left) });
      const plan0 = dedPlan(computePayroll());
      const sumTbl = plan0.rows.length ? `<div class="scroll"><table class="inner"><thead><tr><th>${t("name")}</th><th>${t("lg_cat")}</th><th class="r">${t("pa_conf_before")}</th><th class="r">${t("pa_conf_cut")}</th><th class="r">${t("pa_conf_after")}</th></tr></thead><tbody>${plan0.rows.map(r =>
        `<tr><td>${esc(r.name)}</td><td>${esc(t(r.cat))}</td><td class="r nowrap">${fmt(r.before)}</td><td class="r nowrap neg"><b>−${fmt(r.amt)}</b></td><td class="r nowrap ${r.after <= 0 ? "pos" : ""}">${fmt(r.after)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="sub">${t("pa_conf_none")}</p>`;
      openDialog({ title: t("publish"), submit: t("publish"),
        body: `<p class="full">${t("publishQ", { m })}</p>
          ${plan0.over.length ? `<div class="full" style="color:var(--bad)"><b>${t("pa_over_pub")}</b><br>${plan0.over.map(o => esc(overTxt(o))).join("<br>")}</div>` : ""}
          <div class="full sec">${t("pa_conf_t")}</div><div class="full">${sumTbl}</div>`,
        onSubmit: async () => {
          // never twice: stop if this month is already published
          const cur0 = await db.doc("payroll/" + m).get();
          if (cur0.exists && cur0.data().status === "PUBLISHED") fail(t("pa_already"));
          const slips = computePayroll(), plan = dedPlan(slips);
          if (plan.over.length) fail(t("pa_over_pub") + " " + plan.over.map(overTxt).join(" · "));
          const today = todayKey(), by = auth.session?.user?.email || "";
          for (const [eid, paths] of Object.entries(plan.take)) for (const [path, amt] of Object.entries(paths)) {
            const [coll, did] = path.split("/"), cur = (coll === "fines" ? state.fines : state.adv)[did]; if (!cur) continue;
            if ((cur.history ?? []).some(z => z.month === m && isPayrollEntry(z))) continue;   // already taken for this month
            const before = r2(+cur.remaining || 0), remaining = r2(Math.max(0, before - amt)), lid = "L" + uid();
            await db.doc("ledger/" + lid).set({ kind: "DEDUCT", employeeId: eid, cat: coll === "advances" ? "ADVANCE" : (cur.category || "OTHER"), dueRef: path,
              amount: r2(amt), before, after: remaining, month: m, date: today, by, createdAt: Date.now() });
            await db.doc(path).update({ remaining, history: [...(cur.history ?? []), { month: m, date: today, amount: r2(amt), remaining, src: "payroll", lid }] });
          }
          const adj = { ...(payDoc()?.adj ?? {}) };
          for (const s of slips) adj[s.id] = s.adj;
          const dues = {}; for (const r of plan.rows) (dues[r.id] ??= []).push({ cat: r.cat, before: r.before, amt: r.amt, after: r.after });
          await db.doc("payroll/" + m).set({ month: m, status: "PUBLISHED", publishedAt: Date.now(), adj, rules: state.rules, ...(payDoc()?.extra ? { extra: payDoc().extra } : {}),
            slips: slips.map(({ adj, planned, lk, ...rest }) => ({ ...rest, adj, planned, ...(dues[rest.id] ? { dues: dues[rest.id] } : {}) })) });
          await sendNotice("salary", slips.map(s => s.id), { month: m });
          state.adjDraft = {}; toast(t("publishedOk"));
        }});
    }

    if (act === "pay-export") {
      const published = payDoc()?.status === "PUBLISHED";
      const slips = published ? payDoc().slips : computePayroll();
      // round-trip sheet: read-only auto columns + editable adjustment columns (keyed by Iqama)
      const EC = [["Iqama", "residentId"], ["Name", "name"], ["Grade", "grade"], ["Orders", "orders"], ["Base", "base"], ["Additional", "bonus"], ["Due", "due"], ["Petrol", "fuelSpent"], ["Petrol_Adj", "fuelAdj"],
        ["Traffic", "@traffic"], ["Accident", "@accident"], ["Company", "@company"], ["Supervisor", "@akash"], ["Advance", "@advance"], ["Keeta", "@keeta"], ["Bonus", "@duesBonus"], ["Incentive", "@incent"], ["Overtime", "@overtime"], ["Absent_Days", "@abs"], ["Petrol_Override", "@fuel"], ["Manual_Base", "@man"], ["Valid", "@valid"], ["Reason", "@reason"],
        ["Total_Deduction", "sded"], ["Net", "net"]];
      const val = (s, k) => { if (k[0] === "@") { const a = k.slice(1); if (a === "valid") return s.adj?.valid === false ? "0" : "1"; if (a === "reason") return s.adj?.reason || ""; return s.adj?.[a] ?? ""; } return s[k] ?? ""; };
      const csv = "﻿" + EC.map(c => c[0]).join(",") + "\n" + slips.map(s => EC.map(c => `"${String(val(s, c[1])).replace(/"/g, '""')}"`).join(",")).join("\n");
      if (!downloads) { toast(t("dbErr")); return; }
      try { await downloads.save({ filename: `ASB-payroll-${state.payMonth}${published ? "" : "-draft"}.csv`, data: csv }); } catch (x) { if (x?.code !== "declined") console.warn(x); }
    }

    if (act === "pay-import") {
      openDialog({ title: t("pay_import"), submit: t("csvImport"),
        body: `<p class="full sub">${t("pay_imp_help")}</p>
          <label class="f full">${t("perf_file")}<input class="input" type="file" accept=".xlsx,.xlsm,.xls,.csv,.txt,text/csv" id="payFile"></label>
          <p class="full sub" style="margin:-4px 0 0">${t("perf_file_help")}</p>
          <label class="f full">${t("perf_paste")} <span class="opt">· ${t("optional")}</span><textarea class="input mono" name="csv" rows="5" dir="ltr"></textarea></label>`,
        onSubmit: async fd => {
          let text = fd.csv || ""; const file = $("#payFile")?.files?.[0];
          if (file) { try { text = await reportText(file); } catch (e) { fail(e.message === "xlsx-missing" ? t("perf_xlsx_off") : t("perf_file_err")); } }
          const lines = text.replace(/^﻿/, "").split(/\r?\n/).map(l => l.split(/\t|,|;/).map(c => c.trim().replace(/^"|"$/g, "")));
          let hi = lines.findIndex(c => c.some(x => /iqama|residentid|الإقامة|الاقامة/i.test(x)));
          if (hi < 0) fail(t("pay_imp_nokey"));
          const H = lines[hi].map(x => x.toLowerCase());
          const col = kw => H.findIndex(h => kw.some(k => h.includes(k)));
          const M = { residentId: col(["iqama", "residentid", "الإقامة", "الاقامة"]), traffic: col(["traffic", "مخالفة"]), accident: col(["accident", "حادث"]), company: col(["company", "الشركة"]), akash: col(["supervisor", "akash", "المشرف", "اكاش", "أكاش"]), advance: col(["advance", "السلف"]), keeta: col(["keeta", "كيتا"]), duesBonus: col(["bonus", "المكافآت", "المستحقات"]), incent: col(["incent"]), overtime: col(["overtime"]), abs: col(["absent", "الغياب"]), fuel: col(["petrol_override", "petrol override", "override"]), man: col(["manual_base", "manual base"]), valid: col(["valid", "الصلاحية", "الصلاح"]), reason: col(["reason", "السبب"]) };
          if (M.residentId < 0) fail(t("pay_imp_nokey"));
          const byRid = {}; for (const [eid, e] of Object.entries(state.emp)) if (e.residentId) byRid[String(e.residentId)] = eid;
          const num = v => { const n = parseFloat(String(v ?? "").replace(/[^\d.\-]/g, "")); return isNaN(n) ? "" : n; };
          const parsed = {}; const miss = [];
          for (let r = 0; r < lines.length; r++) { if (r === hi) continue; const c = lines[r];
            const rid = (c[M.residentId] || "").replace(/\D/g, ""); if (!/^\d{10}$/.test(rid)) continue;
            const eid = byRid[rid]; if (!eid) { miss.push(rid); continue; }
            const a = { ...(payDoc()?.adj?.[eid] ?? {}) };
            for (const k of ["traffic", "accident", "company", "akash", "advance", "keeta", "duesBonus", "incent", "overtime", "abs", "fuel", "man"]) if (M[k] >= 0) { const v = num(c[M[k]]); a[k] = v === "" ? 0 : r2(v); }
            if (M.valid >= 0) { const vv = (c[M.valid] || "").toLowerCase().trim(); a.valid = !(vv === "0" || /غير|invalid|^no$|false/.test(vv)); }
            if (M.reason >= 0) a.reason = c[M.reason] || "";
            parsed[eid] = a;
          }
          if (!Object.keys(parsed).length) fail(t("perf_nothing"));
          // TEST / PREVIEW: show the result first; the user Submits or Cancels
          state.adjDraft = { ...parsed }; render();
          const slips = computePayroll(), byId = Object.fromEntries(slips.map(s => [s.id, s]));
          const rows = Object.keys(parsed).map(e => byId[e]).filter(Boolean);
          const prev = `<div class="full scroll" style="max-height:46vh"><table><thead><tr><th>${t("name")}</th><th class="r">${t("pa_totded")}</th><th class="r">${t("net")}</th></tr></thead><tbody>${rows.map(s => `<tr><td>${esc(s.name)}${s.valid === false ? ` <span class="pill p-bad nodot">${t("pa_invalid")}</span>` : ""}</td><td class="r ${s.sded ? "neg" : ""}">${s.sded ? "−" + fmt(s.sded) : fmt(0)}</td><td class="r"><b>${fmt(s.net)}</b></td></tr>`).join("")}</tbody></table></div>`;
          setTimeout(() => openDialog({ title: "🧪 " + t("pay_test_t"),
            body: `<p class="full">✓ ${t("pay_test_sum", { n: rows.length })}${miss.length ? ` · <b class="neg">${t("perf_unmatched")}: ${miss.length}</b>` : ""}</p>${miss.length ? `<p class="full mono sub">${miss.map(esc).join(", ")}</p>` : ""}${prev}<p class="full sub">${t("pay_test_note")}</p>`,
            footer: `<button type="button" class="btn ghost" data-act="pay-test-cancel">${t("cancel")}</button><button class="btn gold" id="dlgOk">✓ ${t("pay_test_submit")}</button>`,
            onSubmit: async () => {
              await db.doc("payroll/" + state.payMonth).set({ ...(payDoc() ?? {}), month: state.payMonth, status: "DRAFT", adj: { ...(payDoc()?.adj ?? {}), ...parsed }, updatedAt: Date.now() });
              state.adjDraft = {}; toast(t("pay_test_done"));
            } }), 70);
        }});
      return;
    }
    if (act === "pay-test-cancel") { state.adjDraft = {}; try { dlg.close(); } catch (e) {} render(); return; }
  } catch (x) { console.error(x); toast(t("dbErr")); }
});

});

const cyrb = s => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };
const pinCheckOf = (rid, pin) => sha("asb|" + rid + "|" + pin);
const SEG_RE = /^[A-Za-z0-9_\-.~:@+]{3,200}$/;
const pickX = x => ({ date: x.date, category: x.category || "", reason: x.reason || "", amount: +x.amount || 0, remaining: x.waived ? 0 : (+x.remaining || 0),
  monthly: +x.monthly || 0, waived: !!x.waived, history: (x.history || []).map(h => ({ month: h.month, amount: h.amount, remaining: h.remaining })) });

function buildMirror(id){
  const e = state.emp[id];
  const rk = monthRanked(monthKey()), mine = rk.find(r => r.id === id), row = monthRows(monthKey())[id] ?? {};
  const mo = +row.o || 0, mf = +row.f || 0;
  const byDate = (a, b) => String(b.date).localeCompare(String(a.date));
  return {
    v: 1, employeeId: id, pinCheck: e.pinCheck || "", pinVer: e.pinVer || 0,
    profile: { photo: e.photoUrl || "", fullName: e.fullName, fullNameAr: e.fullNameAr || "", residentId: e.residentId, mobile: e.mobile, city: e.city || "", plate: e.plate || "",
      vehicleModel: e.vehicleModel || "", card: e.card ? String(e.card).slice(-4) : "", dailyLimit: +e.dailyLimit || 0, monthlyLimit: +e.monthlyLimit || 0, payType: e.payType || "TARGET" },
    today: { date: todayKey(), rank: mine?.rank ?? null, of: rk.length, o: +row.o || 0, f: +row.f || 0 },
    perf: { today: { date: perfDays()[0], ...(state.perf[perfDays()[0]]?.rows?.[id] ?? {}) }, yest: { date: perfDays()[1], ...(state.perf[perfDays()[1]]?.rows?.[id] ?? {}) } },
    month: { key: monthKey(), o: mo, f: r2(mf), rank: mine?.rank ?? null, of: rk.length, at: row.at || 0, target: targetFor(e, mo) },
    board: rk.filter((r, i) => i < 5 || r.id === id).map(r => ({ r: r.rank, n: (state.emp[r.id]?.fullName || "").split(" ")[0], p: state.emp[r.id]?.photoUrl || "", o: r.o, me: r.id === id })),
    fines: Object.values(state.fines).filter(x => x.employeeId === id).sort(byDate).map(pickX),
    advances: Object.values(state.adv).filter(x => x.employeeId === id).sort(byDate).map(pickX),
    payslips: Object.values(state.payroll).filter(p => p.status === "PUBLISHED").sort((a, b) => b.month.localeCompare(a.month)).slice(0, 12)
      .map(p => { const s = (p.slips || []).find(x => x.id === id); if (!s) return null; const { adj, planned, ...rest } = s; return { ...rest, month: p.month }; }).filter(Boolean),
  };
}

let syncTimer = null, syncing = false, syncAgain = false;
const processedClaims = new Set();
function scheduleSync(){ return;
  if (state.mode === "employee" || !state.ready || !state.canWrite || !db) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(runSync, 1200);
}
async function runSync(){
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try { await processClaims(); await syncMirrors(); } catch (x) { console.warn("sync", x); }
  finally { syncing = false; if (syncAgain) { syncAgain = false; scheduleSync(); } }
}
async function processClaims(){
  for (const [u, s] of Object.entries(state.staff)) {
    const c = s.claim;
    if (!c || c.result || !c.at || processedClaims.has(u + c.at)) continue;
    processedClaims.add(u + c.at);
    const fails = +state.claimlog[u]?.fails || 0;
    if (fails >= 5) { await db.doc("staff/" + u).update({ claim: { residentId: c.residentId, at: c.at, result: "locked" } }); continue; }
    const hit = Object.entries(state.emp).find(([, e]) => e.residentId === c.residentId && e.status === "ACTIVE");
    if (hit && hit[1].pinCheck && hit[1].pinCheck === c.hash) {
      for (const [oid, oe] of Object.entries(state.emp)) if (oe.appUser === u && oid !== hit[0]) await db.doc("employees/" + oid).update({ appUser: "" });
      const prev = hit[1].appUser;
      await db.doc("employees/" + hit[0]).update({ appUser: u });
      if (prev && prev !== u) await revokeStaff(prev);
      await db.doc("staff/" + u).update({ claim: { residentId: c.residentId, at: c.at, result: "ok" } });
      await db.doc("claimlog/" + u).set({ fails: 0, at: Date.now() });
    } else {
      await db.doc("claimlog/" + u).set({ fails: fails + 1, at: Date.now() });
      await db.doc("staff/" + u).update({ claim: { residentId: c.residentId, at: c.at, result: fails + 1 >= 5 ? "locked" : "wrong" } });
    }
  }
}
async function syncMirrors(){
  for (const [id, e] of Object.entries(state.emp)) {
    const u = e.appUser; if (!u || !SEG_RE.test(u)) continue;
    const m = e.status === "ACTIVE" ? buildMirror(id) : { revoked: true, employeeId: id };
    const str = JSON.stringify(m), sig = cyrb(str), cur = state.staff[u];
    if (cur?.sig === sig) continue;
    const payload = { m: str, sig, syncedAt: Date.now() };
    if (cur) await db.doc("staff/" + u).update(payload); else await db.doc("staff/" + u).set(payload);
  }
}
async function revokeStaff(u){
  if (!u || !SEG_RE.test(u)) return;
  const str = JSON.stringify({ revoked: true }), p = { m: str, sig: cyrb(str), syncedAt: Date.now() };
  if (state.staff[u]) await db.doc("staff/" + u).update(p); else await db.doc("staff/" + u).set(p);
}

/* A small document store over the `docs` table, same calls the panel already uses:
   db.doc("coll/id").get/set/update/delete/onSnapshot, db.collection("coll")[.where(f,"==",v)].onSnapshot */
function makeDb(){
  const cache = {};          // coll -> Map(id -> data)
  const loading = {};        // coll -> Promise
  const listeners = new Set();
  const snapDoc = (id, data) => ({ id, exists: data !== undefined, data: () => data });
  const deliver = coll => { for (const l of listeners) if (l.coll === coll) l.fire(); };

  async function load(coll){
    if (cache[coll]) return;
    loading[coll] ??= (async () => {
      const m = new Map(); let from = 0;
      for (;;) {
        const { data, error } = await sb.from("docs").select("id,data").eq("coll", coll).range(from, from + 999);
        if (error) throw error;
        data.forEach(r => m.set(r.id, r.data));
        if (data.length < 1000) break; from += 1000;
      }
      cache[coll] = m;
    })();
    await loading[coll];
  }

  let channel = null;
  function startRealtime(){
    if (channel) return;
    channel = sb.channel("asb-docs")
      .on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => {
        const row = p.eventType === "DELETE" ? p.old : p.new;
        if (!row?.coll || !cache[row.coll]) return;
        if (p.eventType === "DELETE") cache[row.coll].delete(row.id); else cache[row.coll].set(row.id, row.data);
        deliver(row.coll);
      })
      .subscribe(status => {
        // after a reconnect, reload what we hold so nothing is missed
        if (status === "SUBSCRIBED" && channel._asbWasDown) {
          channel._asbWasDown = false;
          for (const c of Object.keys(cache)) { delete cache[c]; delete loading[c]; load(c).then(() => deliver(c)).catch(console.warn); }
        }
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") channel._asbWasDown = true;
      });
  }

  const split = path => { const i = path.indexOf("/"); return [path.slice(0, i), path.slice(i + 1)]; };
  const local = (coll, id, data) => { if (cache[coll]) { if (data === undefined) cache[coll].delete(id); else cache[coll].set(id, data); deliver(coll); } };

  function doc(path){
    const [coll, id] = split(path);
    return {
      id, path,
      async get(){ await load(coll); return snapDoc(id, cache[coll].get(id)); },
      async set(data){
        const { error } = await sb.from("docs").upsert({ coll, id, data, updated_at: new Date().toISOString() });
        if (error) throw error; local(coll, id, data);
      },
      async update(patch){
        const { data, error } = await sb.rpc("docs_merge", { p_coll: coll, p_id: id, p_patch: patch });
        if (error) throw error; local(coll, id, data);
      },
      async delete(){
        const { error } = await sb.from("docs").delete().eq("coll", coll).eq("id", id);
        if (error) throw error; local(coll, id, undefined);
      },
      /* gone for good, not to the recycle bin (super admin, moves, 12-month clean-up) */
      async purge(){
        const { error } = await sb.rpc("docs_purge", { p_coll: coll, p_id: id });
        if (error) throw error; local(coll, id, undefined);
      },
      onSnapshot(next, err){
        const l = { coll, fire: () => next(snapDoc(id, cache[coll]?.get(id))) };
        listeners.add(l); startRealtime();
        load(coll).then(l.fire).catch(e => err?.(e));
        return () => listeners.delete(l);
      },
    };
  }
  function query(coll, filters){
    const match = d => filters.every(([f, , v]) => d?.[f] === v);
    return {
      where(f, op, v){ return query(coll, [...filters, [f, op, v]]); },
      onSnapshot(next, err){
        const l = { coll, fire: () => {
          const docs = [...(cache[coll] ?? new Map())].filter(([, d]) => match(d)).sort((a, b) => a[0] < b[0] ? -1 : 1).map(([i, d]) => snapDoc(i, d));
          next({ docs, size: docs.length, empty: !docs.length });
        } };
        listeners.add(l); startRealtime();
        load(coll).then(l.fire).catch(e => err?.(e));
        return () => listeners.delete(l);
      },
      doc: id => doc(coll + "/" + id),
    };
  }
  return { doc, collection: c => query(c, []) };
}

function renderAuth(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("#app").hidden = true; const root = $("#emp"); root.hidden = false;
  const up = auth.mode === "signup";
  root.innerHTML = `<div class="alog"><div class="alog-top"><span class="alog-tag"><i></i>${t("au_tag")}</span><div class="p-lang">${langMini()}</div></div>
  <div class="alog-wrap">
    <div class="alog-mid"><div class="alog-lg"><div class="rg a"></div><div class="rg b"></div><img src="logo.png" alt="ASB"></div><h1>ASB LOGISTICS Company</h1></div>
    <form id="authForm" class="alog-card" novalidate>
      <div class="alog-sec"><span>${t("au_secure")}</span><b>● ${t("au_online")}</b></div>
      <h2>${up ? t("au_signup") : t("au_signin")}</h2><p class="alog-s">${t("au_wait")}</p>
      <label><span>${t("au_email")}</span><input class="alog-in" id="auEmail" type="email" autocomplete="username" required></label>
      <label><span>${t("au_pass")}</span><input class="alog-in" id="auPass" type="password" autocomplete="${up ? "new-password" : "current-password"}" minlength="8" required></label>
      ${auth.err ? `<p class="alog-err">${esc(auth.err)}</p>` : ""}${auth.msg ? `<div class="alog-note">${esc(auth.msg)}</div>` : ""}
      <button class="alog-btn" ${auth.busy ? "disabled" : ""}>${up ? t("au_signup") : t("au_signin")} →</button>
      <div class="alog-links">${up ? "" : `<button type="button" data-au="forgot">${t("au_forgot")}</button>`}<button type="button" data-au="${up ? "signin" : "signup"}">${up ? t("au_have") : t("au_new")}</button></div>
    </form>
  </div></div>`;
  try { const em = localStorage.getItem("asb-admin-email"); if (em) $("#auEmail").value = em; } catch {}
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-au]"); if (!b) return;
  const em = $("#auEmail")?.value.trim();
  auth.err = ""; auth.msg = "";
  if (b.dataset.au === "forgot") {
    if (!em) { auth.err = t("required"); return renderAuth(); }
    const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
    auth.msg = error ? error.message : t("au_reset_sent"); return renderAuth();
  }
  auth.mode = b.dataset.au; renderAuth(); if (em) $("#auEmail").value = em;
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "authForm") return;
  e.preventDefault();
  const email = $("#auEmail").value.trim(), password = $("#auPass").value;
  auth.err = ""; auth.msg = "";
  if (!email || password.length < 8) { auth.err = password.length < 8 ? t("au_short") : t("required"); return renderAuth(); }
  try { localStorage.setItem("asb-admin-email", email); } catch {}
  auth.busy = true; renderAuth(); $("#auEmail").value = email;
  if (auth.mode === "signup") {
    const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
    auth.busy = false;
    if (error) auth.err = error.message;
    else if (!data.session) { auth.msg = t("au_check"); auth.mode = "signin"; }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    auth.busy = false;
    if (error) auth.err = /confirm/i.test(error.message) ? t("au_unconfirmed") : t("au_err");
  }
  if (auth.err || auth.msg) { renderAuth(); $("#auEmail").value = email; }
});

/* Admins page (super admin adds other admin emails) */
async function loadAdmins(){
  const { data } = await sb.from("admins").select("email,role,name,perms").order("created_at");
  auth.admins = data ?? [];
  if (auth.role === "SUPER_ADMIN") { const r = await sb.from("admin_logins").select("email,at,device").order("at", { ascending: false }).limit(100); auth.logins = r.data ?? []; }
  if (view() === "admins") render();
}

  const pages = VIEWS.filter(v => v !== "admins");   // the Admins page stays super-admin only
  openDialog({ title: "⚙ " + t("adm_perms") + " · " + esc(email), submit: t("save"),
    body: `<p class="full sub" style="margin:0 0 6px">${t("adm_perms_help2")}</p>
