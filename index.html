<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3B60">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>ASB Admin Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: fixed left rail of sections (top scroller on phones) + one working surface; tables are the main object */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#F6F8FA; --ink:#0E2233; --muted:#5A6B7A; --line:#D8E0E7;
  --brand:#0B3B60; --brand-ink:#FFFFFF; --gold:#B9830F; --gold-soft:#FBF1D9;
  --good:#1E7F55; --good-soft:#E3F3EB; --warn:#9A6411; --warn-soft:#FBEFD7; --bad:#B4332A; --bad-soft:#F9E4E2; --info:#1F5F99; --info-soft:#E3EEF8;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Hind Siliguri","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1520; --surface:#112131; --sunk:#0D1A27; --ink:#E4ECF2; --muted:#8EA2B4; --line:#203546;
  --brand:#6FA8DC; --brand-ink:#08131D; --gold:#E2AE45; --gold-soft:#33280F;
  --good:#5CC492; --good-soft:#12301F; --warn:#E2AE45; --warn-soft:#33280F; --bad:#EE7F75; --bad-soft:#3A1715; --info:#7DB5E8; --info-soft:#132B42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1520; --surface:#112131; --sunk:#0D1A27; --ink:#E4ECF2; --muted:#8EA2B4; --line:#203546;
  --brand:#6FA8DC; --brand-ink:#08131D; --gold:#E2AE45; --gold-soft:#33280F;
  --good:#5CC492; --good-soft:#12301F; --warn:#E2AE45; --warn-soft:#33280F; --bad:#EE7F75; --bad-soft:#3A1715; --info:#7DB5E8; --info-soft:#132B42; color-scheme:dark}
:lang(bn){--f-body:"Hind Siliguri","IBM Plex Sans",system-ui,sans-serif}
:lang(ar){--f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;padding-block:20px;position:sticky;top:0;height:100vh}
:root[data-theme="dark"] .rail,.rail{border-inline-end:1px solid var(--line)}
.brand{padding:0 20px 18px;display:flex;gap:10px;align-items:center}
.mark{width:36px;height:36px;border-radius:8px;background:var(--gold);color:#1a1205;display:grid;place-items:center;font:700 15px var(--f-display);letter-spacing:.04em;flex:none}
.brand b{font:700 19px/1.1 var(--f-display);letter-spacing:.03em;display:block}
.brand small{opacity:.75;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav a{color:inherit;text-decoration:none;padding:9px 12px;border-radius:8px;font-weight:500;display:flex;justify-content:space-between;gap:8px;opacity:.85}
.nav a:hover{background:color-mix(in srgb,var(--brand-ink) 10%,transparent);opacity:1}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--brand-ink) 16%,transparent);opacity:1;font-weight:600}
.nav a.nav-driver{margin-top:8px;background:var(--gold);color:#1a1205;opacity:1;font-weight:600}
.nav a.nav-sub{padding-inline-start:30px;font-size:14px;position:relative}
.nav a.nav-sub::before{content:"";position:absolute;inset-inline-start:18px;top:50%;width:6px;height:1px;background:currentColor;opacity:.6}
.nav .count{font-size:12px;background:var(--gold);color:#1a1205;border-radius:20px;padding:0 7px;font-weight:600}
.rail-foot{margin-top:auto;padding:16px 20px 0;display:flex;flex-direction:column;gap:10px;font-size:13px}
.lang{display:flex;gap:4px}
.lang button{flex:1;border:1px solid color-mix(in srgb,var(--brand-ink) 35%,transparent);background:none;color:var(--brand-ink);border-radius:6px;padding:4px 0;cursor:pointer;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.head h1{font:600 30px/1.1 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.gold{background:var(--gold);color:#1a1205}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.input.num{width:96px;text-align:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
label.f.check{flex-direction:row;align-items:center;text-transform:none;font-size:14px;color:var(--ink);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel h2{font:600 18px var(--f-display);letter-spacing:.02em;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font:600 30px/1.2 var(--f-display);margin-top:2px}
.kpi small{color:var(--muted);font-size:13px}
.kpi.alert{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:var(--bad-soft)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:end}
td.nowrap{white-space:nowrap}
.name{font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.mono{font-family:var(--f-mono);font-size:13px;letter-spacing:.02em}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)}
/* Saudi plate chip */
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;font:500 12.5px var(--f-mono);white-space:nowrap}
.plate i{font-style:normal;background:var(--ink);color:var(--surface);padding:1px 4px;font-size:9px;display:grid;place-items:center;letter-spacing:.05em}
.plate em{font-style:normal;padding:1px 7px}
.rank{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:700 14px var(--f-display);background:var(--sunk);border:1px solid var(--line)}
.rank.r1{background:var(--gold);color:#1a1205;border-color:transparent}
.rank.r2{background:color-mix(in srgb,var(--muted) 30%,var(--surface))}
.rank.r3{background:color-mix(in srgb,var(--gold) 35%,var(--surface))}
.bar{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--brand)}
.bar.over span{background:var(--bad)}
.bar.done span{background:var(--good)}
.pill.nodot::before{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--card,#fff);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip b{font-weight:700;margin-inline-end:2px} .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.warn{border-color:#E7B65A;background:#FFF6E3;color:#8A5A00} .chip.warn.on{background:#8A5A00;color:#fff}
.chip-sep{width:1px;height:22px;background:var(--line);margin:0 4px}
table.emps tr.grp td{background:var(--sunk,rgba(0,0,0,.04));font-size:13px;padding-block:8px;position:sticky;top:0}
table.emps tr.dim td{opacity:.55}
table.emps td{padding-block:10px} table.emps .row-actions{flex-wrap:nowrap;white-space:nowrap}
a.tel{color:inherit;text-decoration:none} a.tel:hover{text-decoration:underline}
.plat{font-size:11px;padding:1px 8px} .plat-keeta{background:#FFF3C4;color:#7A5B00} .plat-hungerstation{background:#FDE3E3;color:#A1262B} .plat-other{background:var(--sunk);color:var(--muted)}
.on-dot::before{background:var(--good)!important;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,131,88,.5)}70%{box-shadow:0 0 0 6px rgba(29,131,88,0)}100%{box-shadow:0 0 0 0 rgba(29,131,88,0)}}
.chip.online{border-color:#9ED6BA;background:#E7F6EE;color:#14623F} .chip.online.on{background:#14623F;color:#fff}
.pin-in{letter-spacing:.5em;font-size:20px;text-align:center}
table.dues tr.due-emp{cursor:pointer} table.dues tr.due-emp:hover td{background:var(--sunk,rgba(0,0,0,.03))}
table.dues tr.due-emp.open td{background:var(--sunk,rgba(0,0,0,.04));border-bottom:0}
table.dues .chev{width:14px;color:var(--muted);font-size:12px}
table.dues tr.due-items>td{padding:0 0 12px 40px;background:var(--sunk,rgba(0,0,0,.04))}
table.inner{width:100%;background:var(--card,#fff);border:1px solid var(--line);border-radius:10px}
table.inner th{font-size:11px}
.danger-t{color:var(--bad)}
.hrow{display:grid;grid-template-columns:1.1fr .9fr .9fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
.chk-f .chk{margin-top:10px}
.rk-sw{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--muted)}
.rk-sw i{position:relative;width:38px;height:22px;border-radius:12px;background:var(--line);transition:.15s;flex:none}
.rk-sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.rk-sw.on{color:var(--good)} .rk-sw.on i{background:var(--good)} .rk-sw.on i::after{left:19px}
.rk-sw:disabled{opacity:.5;cursor:default}
.grade.sm{width:20px;height:20px;font-size:12px;border-radius:5px;vertical-align:middle}
.input.sm{padding:5px 8px;font-size:13px}
table.tgt .input.num{width:84px}
.input.num.own{border-color:var(--brand);font-weight:600}
.input.num.sm{width:76px}
.tgt-legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--muted);margin-bottom:12px}
.tgt-legend b{color:var(--ink)}
.grade{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font:700 16px var(--f-display);color:#fff}
.g-a{background:#1D8358} .g-b{background:#2F6FB5} .g-c{background:#C98C14} .g-d{background:#C0392B} .g-x{background:var(--muted)}
.pc{display:flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap}
.chg{font-size:12px;font-weight:600} .chg.up{color:var(--good)} .chg.down{color:var(--bad)}
.grade-sum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.gs{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px 6px 6px;cursor:pointer;font:inherit;color:inherit}
.gs.on{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.gs b{font:600 18px var(--f-display)}
table.perf th.grp{text-align:center;border-bottom:1px solid var(--line)}
table.perf th.today{background:color-mix(in srgb,var(--gold) 14%,var(--sunk))}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters .input{max-width:320px}
.filters select.input{max-width:180px}
.note{background:var(--info-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:16px;border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pinbox{font:600 34px var(--f-mono);letter-spacing:.35em;text-align:center;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:var(--r);padding:12px;margin:8px 0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:16px}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px)}
dialog::backdrop{background:rgba(5,15,25,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font:600 20px var(--f-display)}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-b .full{grid-column:1/-1}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.toast{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:min(420px,calc(100vw - 32px))}
.err{color:var(--bad);font-size:13px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;padding-block:10px 0;flex-direction:column}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--brand)}
  .brand{padding:0 max(16px,env(safe-area-inset-left,0px)) 8px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .nav{flex-direction:row;overflow-x:auto;padding:0 max(10px,env(safe-area-inset-left,0px)) 8px;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:7px 11px;font-size:14px}
  .rail-foot{display:none}
  .mobile-tools{display:flex!important}
  main{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2{grid-template-columns:1fr}
  .head h1{font-size:25px}
  .dlg-b{grid-template-columns:1fr}
}
.mobile-tools{display:none;gap:6px;margin-inline-start:auto}
.mobile-tools .lang button{padding:3px 8px}
@media (prefers-reduced-motion:no-preference){.panel,.kpi{transition:border-color .2s}}

/* ── employee app (phone) ── */
.phone{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100%}
.phone.full{min-height:100dvh}
.phone-frame{width:min(380px,100%);height:740px;max-height:calc(100dvh - 140px);min-height:520px;border:10px solid var(--ink);border-radius:36px;overflow:hidden;background:var(--bg)}
.phone-frame .phone{height:100%;overflow-y:auto;min-height:0}
.p-top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:14px 16px;display:flex;align-items:center;gap:12px}
.phone.full .p-top{top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p-av{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#1a1205;display:grid;place-items:center;font:700 18px var(--f-display);flex:none}
.p-top b{font:600 19px/1.1 var(--f-display);display:block;letter-spacing:.02em}
.p-top small{opacity:.85;font-size:12.5px}
.p-lang{display:flex;gap:4px;margin-inline-start:auto;flex:none}
.p-lang button{border:1px solid color-mix(in srgb,var(--brand-ink) 40%,transparent);background:none;color:var(--brand-ink);border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer}
.p-lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
.p-body{flex:1;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px}
.phone.full .p-body{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));width:100%;max-width:560px;margin:0 auto}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.p-card h3{margin:0 0 8px;font:600 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.p-rank{display:flex;align-items:center;gap:16px}
.p-rank .big{font:700 54px/1 var(--f-display);color:var(--gold)}
.p-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p-num{font:600 28px/1.15 var(--f-display)}
.p-lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.p-seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.p-seg button{border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.p-seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.p-nav{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px}
.phone.full .p-nav{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.p-nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer}
.p-nav button svg{width:23px;height:23px}
.p-nav button[aria-current="page"]{color:var(--brand)}
.p-badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
.p-list{display:flex;flex-direction:column}
.p-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;min-width:0}
.p-row:last-child{border-bottom:0}
.p-row.me{background:var(--info-soft);margin:0 -14px;padding-inline:14px}
.p-alert{width:100%;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:14px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:600;cursor:pointer;color:var(--ink)}
.p-net{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:18px;text-align:center}
.p-net .p-num{font-size:34px}
.p-login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:440px;margin:0 auto;width:100%}
.p-login .mark{width:58px;height:58px;font-size:20px;border-radius:14px}
.p-login h1{font:700 27px/1.1 var(--f-display);margin:0}
.p-btn{width:100%;padding:13px;font-size:16px;justify-content:center}
.p-big-input{font-size:20px;letter-spacing:.1em;padding:12px}
.p-code{font:500 13px var(--f-mono);background:var(--sunk);border:1px dashed var(--line);padding:8px;border-radius:8px;word-break:break-all}
.slip-row{width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;color:inherit;font:inherit}
.ava{border-radius:50%;object-fit:cover;flex:none;background:var(--sunk);display:inline-block;vertical-align:middle}
.ava-i{display:inline-grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-weight:700;font-family:var(--f-display)}
.photo-pick{display:flex;gap:14px;align-items:center}
.sec{font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--brand);border-bottom:1px solid var(--line);padding:8px 0 4px;margin-top:4px}
.opt{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg2-o{position:relative;display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.seg2-o input{position:absolute;opacity:0;pointer-events:none}
.seg2-o b{font:600 17px var(--f-display)}
.seg2-o span{font-size:12.5px;color:var(--muted)}
.seg2-o:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
.seg2-o:has(input:focus-visible){outline:2px solid var(--gold)}
.preview-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.preview-wrap{grid-template-columns:1fr}.phone-frame{margin:0 auto}}
</style>

async function squarePhoto(file){
  const img = await createImageBitmap(file);
  const side = Math.min(img.width, img.height), S = Math.min(480, side);
  const c = document.createElement("canvas"); c.width = c.height = S;
  c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", 0.86));
}
async function uploadPhoto(empId, file){
  const blob = await squarePhoto(file);
  const path = `emp/${empId}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
  if (error) throw error;
  return { photoUrl: sb.storage.from("photos").getPublicUrl(path).data.publicUrl, photoPath: path };
}

const numOrNull = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
function planOf(e){
  const R = state.rules, rank = (e.payType || "TARGET") === "TARGET", P = rank ? "r" : "u";
  const abc = f => ({ A: +f("A"), B: +f("B"), C: +f("C") });
  return { rank, min: +R[P + "Min"], rate: +R[P + "Rate"], t1: +R[P + "T1"], t2: +R[P + "T2"],
    b1: rank ? abc(g => R["rB1" + g]) : abc(() => R.uB1), b2: rank ? abc(g => R["rB2" + g]) : abc(() => R.uB2),
    ex1: rank ? abc(g => R["rx1" + g]) : abc(g => R["ex1" + g]), ex2: rank ? abc(g => R["rx2" + g]) : abc(g => R["ex2" + g]),
    fuelLow: +R.uFuelLow, fuelHigh: +R.uFuelHigh };
}
/* Pay rating: the one set on the Target page, else the latest Keeta grade, else C. */
function payGrade(id, e){
  if (e.tGrade) return { g: e.tGrade, src: "set" };
  const j = [state.perf[todayKey()]?.rows?.[id]?.g, state.perf[yesterdayKey()]?.rows?.[id]?.g].find(g => ["A", "B", "C", "D"].includes(g));
  if (j) return { g: j, src: "jahez" };
  return { g: "C", src: "default" };
}
/* Next order milestone: 380 → 500 → 600 (from the pay rules). */
function targetFor(e, orders){
  const p = planOf(e);
  return orders < p.min ? p.min : orders < p.t1 ? p.t1 : p.t2;
}
/* Rank and Unrank use the same ladder with their own prices:
   under 380 orders or D rating (500+) → the company decides (manual salary);
   380–499 → price per order; 500–599 → level-2 salary (by rating for Rank) + orders above 500 × rating price;
   600+ → level-3 salary + orders above 600 × rating price. */
function payFor(e, orders, grade = "C"){
  const p = planOf(e), g = ["A", "B", "C"].includes(grade) ? grade : "C";
  if (orders < p.min) return { base: 0, bonus: 0, shortfall: 0, manual: "below", tier: 0 };
  if (orders >= p.t1 && grade === "D") return { base: 0, bonus: 0, shortfall: 0, manual: "gradeD", tier: orders < p.t2 ? 2 : 3 };
  if (orders < p.t1) return { base: orders * p.rate, bonus: 0, shortfall: 0, tier: 1 };
  if (orders < p.t2) return { base: p.b1[g], bonus: (orders - p.t1) * p.ex1[g], shortfall: 0, tier: 2 };
  return { base: p.b2[g], bonus: (orders - p.t2) * p.ex2[g], shortfall: 0, tier: 3 };
}
/* Fuel allowance (separate from salary): 380–499 → 2 SAR/order, 500+ → 2.5 SAR/order. */
function fuelAllowance(e, orders){
  const p = planOf(e); if (orders < p.min) return 0;
  return orders * (orders < p.t1 ? p.fuelLow : p.fuelHigh);
}

   fa forced-assignment score, ot on-time, cr completion (not delivery related), ne "Delivered" not pressed too early. */

function perfDelta(k, y, v){
  if (y === undefined || y === null || v === undefined || v === null || y === "" || v === "") return 0;
  if (k === "g") return GRADES.indexOf(y) - GRADES.indexOf(v);            // A after B = better
  if (k === "rp") { if (+v === 0 || +y === 0) return 0; return +y - +v; }   // lower % is better
  return +v - +y;
}

/* Parse rows copied from the Keeta report (Excel, Sheets or CSV). Columns:
   driver ID, name, grade, ranking %, forced assignment %, on-time %, completion %, not-early % [, order volume].
   The new Keeta export gives rates as fractions (0.9993 = 99.93%) and adds the month's total orders up to yesterday. */
function parseJahez(text){
  const out = [];
  for (const line of text.replace(/^﻿/, "").split(/\r?\n/)) {
    let cells = line.split(/\t|,|;/).map(c => c.trim().replace(/^"|"$/g, "")).filter(c => c !== "");
    if (cells.length < 4) continue;
    if (/^\d{12,20}$/.test(cells[cells.length - 1]) && !/^\d{12,20}$/.test(cells[0])) cells.reverse(); // copied right-to-left
    const id = cells.find(c => /^\d{12,20}$/.test(c)) || "";
    const grade = (cells.find(c => /^[A-Da-d]$|^[-–—]$/.test(c)) || "").toUpperCase().replace(/[–—]/, "-");
    const nums = cells.filter(c => c !== id && /^-?\d+(\.\d+)?\s*%?$/.test(c)).map(c => parseFloat(c));
    const name = cells.find(c => c !== id && c.toUpperCase() !== grade && !/^-?\d+(\.\d+)?\s*%?$/.test(c) && !/^[-–—]$/.test(c)) || "";
    if (!id && !name) continue;
    if (nums.length < 5) continue;
    let vol = null, five = nums.slice(-5);
    if (nums.length >= 6 && five.slice(0, 4).every(v => v <= 1) && nums[nums.length - 1] > 1) { vol = Math.round(nums[nums.length - 1]); five = nums.slice(-6, -1); }
    if (!line.includes("%") && five.every(v => v <= 1)) five = five.map(v => Math.round(v * 10000) / 100);
    const [rp, fa, ot, cr, ne] = five;
    out.push({ id, name, vol, row: { g: grade || "-", rp, fa, ot, cr, ne } });
  }
  return out;
}

function computePayroll(){
  const R = state.rules, m = state.payMonth;
  const tot = monthRows(m);
  const savedAdj = payDoc()?.adj ?? {};
  const schedules = [
    ...Object.entries(state.fines).map(([id,x]) => ({ id, kind: "fine", ...x })),
    ...Object.entries(state.adv).map(([id,x]) => ({ id, kind: "adv", ...x })),
  ].filter(s => !s.waived && (+s.remaining||0) > 0 && (s.startMonth||"") <= m).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));

  return activeEmps().map(([id, e]) => {
    const orders = tot[id]?.o ?? 0, fuelSpent = r2(tot[id]?.f ?? 0);
    const a = { ...(savedAdj[id] ?? {}), ...(state.adjDraft[id] ?? {}) };
    const pg = payGrade(id, e), pay = payFor(e, orders, pg.g);
    let { base, bonus, shortfall } = pay;
    if (pay.manual) base = +a.man || 0;
    const incent = +a.incent || 0, overtime = +a.overtime || 0, other = +a.other || 0;
    const allowance = r2(fuelAllowance(e, orders));
    const fuelAdj = r2((+a.fuel || 0) + allowance - fuelSpent);
    const absDed = r2((+a.abs || 0) * (+R.absence || 0));
    const gross = r2(base + bonus + incent + overtime + Math.max(0, fuelAdj) + Math.max(0, other));
    let avail = r2(gross - shortfall - absDed + Math.min(0, fuelAdj) + Math.min(0, other));
    const planned = []; let fineDed = 0, advDed = 0;
    for (const s of schedules.filter(s => s.employeeId === id)) {
      if (avail <= 0) break;
      const take = r2(Math.min(+s.monthly || 0, +s.remaining || 0, avail)); if (take <= 0) continue;
      planned.push({ id: s.id, kind: s.kind, amount: take });
      if (s.kind === "fine") fineDed += take; else advDed += take;
      avail = r2(avail - take);
    }
    const net = Math.max(0, avail);
    return { id, name: e.fullName, residentId: e.residentId, payType: e.payType || "TARGET", orders, fuelSpent,
      base: r2(base), bonus: r2(bonus), incent, overtime, shortfall: r2(shortfall), fuelAdj, other, absDed, absShifts: +a.abs || 0, allowance, grade: pg.g, gradeSrc: pg.src, manual: pay.manual || "",
      fineDed: r2(fineDed), advDed: r2(advDed), gross, deductions: r2(gross - net), net: r2(net), planned, adj: a };
  });
}

const dlg = $("#dlg");
function openDialog({ title, body, submit, danger, onSubmit, footer }){
  dlg.innerHTML = `<form method="dialog" id="dlgForm" novalidate>
    <div class="dlg-h"><h3>${title}</h3><button type="button" class="x" data-close aria-label="${t("close")}">×</button></div>
    <div class="dlg-b">${body}<p class="err full" id="dlgErr" hidden></p></div>
    <div class="dlg-f">${footer ?? `<button type="button" class="btn ghost" data-close>${t("cancel")}</button><button class="btn ${danger?"danger":""}" id="dlgOk">${submit ?? t("save")}</button>`}</div></form>`;
  dlg.querySelectorAll("[data-close]").forEach(b => b.onclick = () => dlg.close());
  $("#dlgForm").onsubmit = async ev => {
    ev.preventDefault();
    if (!onSubmit) return dlg.close();
    const fd = Object.fromEntries(new FormData(ev.target));
    const err = $("#dlgErr"); err.hidden = true;
    const ok = $("#dlgOk"); if (ok) ok.disabled = true;
    try { const msg = await onSubmit(fd, ev.target); if (msg !== false) dlg.close(); }
    catch (x) { err.textContent = x?.userMsg ?? t("dbErr"); err.hidden = false; console.error(x); }
    finally { if (ok) ok.disabled = false; }
  };
  dlg.showModal();
}

            remaining: amount, startMonth: fd.startMonth || monthKey(), waived: false, history: [], createdAt: Date.now() };

          await db.doc((isFine ? "fines/f" : "advances/a") + uid()).set(rec);
          toast(isFine ? t("fineSaved") : t("advSaved"));
        }});
    }

    if (act === "fine-waive") {
      openDialog({ title: t("waive"), body: `<p class="full">${t("waiveQ")}</p>`, submit: t("waive"), danger: true, onSubmit: async () => {
        await db.doc("fines/" + id).update({ waived: true, waivedAt: Date.now() });
      }});
    }

    if (act === "adj-save") {
      const adj = { ...(payDoc()?.adj ?? {}) };
      for (const [eid, a] of Object.entries(state.adjDraft)) adj[eid] = { ...(adj[eid] ?? {}), ...Object.fromEntries(Object.entries(a).map(([k,v]) => [k, v === "" ? 0 : r2(v)])) };
      await db.doc("payroll/" + state.payMonth).set({ ...(payDoc() ?? {}), month: state.payMonth, status: "DRAFT", adj, updatedAt: Date.now() });
      state.adjDraft = {}; toast(t("adjSaved"));
    }

    if (act === "pay-publish") {
      const m = state.payMonth;
      openDialog({ title: t("publish"), body: `<p class="full">${t("publishQ", { m })}</p>`, submit: t("publish"), onSubmit: async () => {
        const slips = computePayroll();
        // one write per fine/advance doc
        const per = {};
        for (const s of slips) for (const p of s.planned) (per[(p.kind === "fine" ? "fines/" : "advances/") + p.id] ??= 0), per[(p.kind === "fine" ? "fines/" : "advances/") + p.id] += p.amount;
        for (const [path, amt] of Object.entries(per)) {
          const [coll, did] = path.split("/"); const cur = (coll === "fines" ? state.fines : state.adv)[did];
          const remaining = r2(Math.max(0, (+cur.remaining || 0) - amt));
          await db.doc(path).update({ remaining, history: [...(cur.history ?? []), { month: m, amount: r2(amt), remaining, src: "payroll" }] });
        }
        const adj = { ...(payDoc()?.adj ?? {}) };
        for (const s of slips) adj[s.id] = s.adj;
        await db.doc("payroll/" + m).set({ month: m, status: "PUBLISHED", publishedAt: Date.now(), adj, rules: state.rules,
          slips: slips.map(({ adj, planned, ...rest }) => ({ ...rest, adj, planned })) });
        await sendNotice("salary", slips.map(s => s.id), { month: m });
        state.adjDraft = {}; toast(t("publishedOk"));
      }});
    }

    if (act === "pay-export") {
      const published = payDoc()?.status === "PUBLISHED";
      const slips = published ? payDoc().slips : computePayroll();
      const cols = ["name","residentId","payType","orders","fuelSpent","base","bonus","incent","overtime","shortfall","fuelAdj","other","fineDed","advDed","gross","deductions","net"];
      const csv = "﻿" + cols.join(",") + "\n" + slips.map(s => cols.map(c => `"${String(s[c] ?? "").replace(/"/g,'""')}"`).join(",")).join("\n");
      if (!downloads) { toast(t("dbErr")); return; }
      try { await downloads.save({ filename: `ASB-payroll-${state.payMonth}${published?"":"-draft"}.csv`, data: csv }); } catch (x) { if (x?.code !== "declined") console.warn(x); }
    }
  } catch (x) { console.error(x); toast(t("dbErr")); }
});

const cyrb = s => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };
const pinCheckOf = (rid, pin) => sha("asb|" + rid + "|" + pin);
const SEG_RE = /^[A-Za-z0-9_\-.~:@+]{3,200}$/;
const pickX = x => ({ date: x.date, category: x.category || "", reason: x.reason || "", amount: +x.amount || 0, remaining: x.waived ? 0 : (+x.remaining || 0),
  monthly: +x.monthly || 0, waived: !!x.waived, history: (x.history || []).map(h => ({ month: h.month, amount: h.amount, remaining: h.remaining })) });

function buildMirror(id){
  const e = state.emp[id];
  const rk = monthRanked(monthKey()), mine = rk.find(r => r.id === id), row = monthRows(monthKey())[id] ?? {};
  const mo = +row.o || 0, mf = +row.f || 0;
  const byDate = (a, b) => String(b.date).localeCompare(String(a.date));
  return {
    v: 1, employeeId: id, pinCheck: e.pinCheck || "", pinVer: e.pinVer || 0,
    profile: { photo: e.photoUrl || "", fullName: e.fullName, fullNameAr: e.fullNameAr || "", residentId: e.residentId, mobile: e.mobile, city: e.city || "", plate: e.plate || "",
      vehicleModel: e.vehicleModel || "", card: e.card ? String(e.card).slice(-4) : "", dailyLimit: +e.dailyLimit || 0, monthlyLimit: +e.monthlyLimit || 0, payType: e.payType || "TARGET" },
    today: { date: todayKey(), rank: mine?.rank ?? null, of: rk.length, o: +row.o || 0, f: +row.f || 0 },
    perf: { today: { date: todayKey(), ...(state.perf[todayKey()]?.rows?.[id] ?? {}) }, yest: { date: yesterdayKey(), ...(state.perf[yesterdayKey()]?.rows?.[id] ?? {}) } },
    month: { key: monthKey(), o: mo, f: r2(mf), rank: mine?.rank ?? null, of: rk.length, at: row.at || 0, target: targetFor(e, mo) },
    board: rk.filter((r, i) => i < 5 || r.id === id).map(r => ({ r: r.rank, n: (state.emp[r.id]?.fullName || "").split(" ")[0], p: state.emp[r.id]?.photoUrl || "", o: r.o, me: r.id === id })),
    fines: Object.values(state.fines).filter(x => x.employeeId === id).sort(byDate).map(pickX),
    advances: Object.values(state.adv).filter(x => x.employeeId === id).sort(byDate).map(pickX),
    payslips: Object.values(state.payroll).filter(p => p.status === "PUBLISHED").sort((a, b) => b.month.localeCompare(a.month)).slice(0, 12)
      .map(p => { const s = (p.slips || []).find(x => x.id === id); if (!s) return null; const { adj, planned, ...rest } = s; return { ...rest, month: p.month }; }).filter(Boolean),
  };
}

let syncTimer = null, syncing = false, syncAgain = false;
const processedClaims = new Set();
function scheduleSync(){ return;
  if (state.mode === "employee" || !state.ready || !state.canWrite || !db) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(runSync, 1200);
}
async function runSync(){
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try { await processClaims(); await syncMirrors(); } catch (x) { console.warn("sync", x); }
  finally { syncing = false; if (syncAgain) { syncAgain = false; scheduleSync(); } }
}
async function processClaims(){
  for (const [u, s] of Object.entries(state.staff)) {
    const c = s.claim;
    if (!c || c.result || !c.at || processedClaims.has(u + c.at)) continue;
    processedClaims.add(u + c.at);
    const fails = +state.claimlog[u]?.fails || 0;
    if (fails >= 5) { await db.doc("staff/" + u).update({ claim: { residentId: c.residentId, at: c.at, result: "locked" } }); continue; }
    const hit = Object.entries(state.emp).find(([, e]) => e.residentId === c.residentId && e.status === "ACTIVE");
    if (hit && hit[1].pinCheck && hit[1].pinCheck === c.hash) {
      for (const [oid, oe] of Object.entries(state.emp)) if (oe.appUser === u && oid !== hit[0]) await db.doc("employees/" + oid).update({ appUser: "" });
      const prev = hit[1].appUser;
      await db.doc("employees/" + hit[0]).update({ appUser: u });
      if (prev && prev !== u) await revokeStaff(prev);
      await db.doc("staff/" + u).update({ claim: { residentId: c.residentId, at: c.at, result: "ok" } });
      await db.doc("claimlog/" + u).set({ fails: 0, at: Date.now() });
    } else {
      await db.doc("claimlog/" + u).set({ fails: fails + 1, at: Date.now() });
      await db.doc("staff/" + u).update({ claim: { residentId: c.residentId, at: c.at, result: fails + 1 >= 5 ? "locked" : "wrong" } });
    }
  }
}
async function syncMirrors(){
  for (const [id, e] of Object.entries(state.emp)) {
    const u = e.appUser; if (!u || !SEG_RE.test(u)) continue;
    const m = e.status === "ACTIVE" ? buildMirror(id) : { revoked: true, employeeId: id };
    const str = JSON.stringify(m), sig = cyrb(str), cur = state.staff[u];
    if (cur?.sig === sig) continue;
    const payload = { m: str, sig, syncedAt: Date.now() };
    if (cur) await db.doc("staff/" + u).update(payload); else await db.doc("staff/" + u).set(payload);
  }
}
async function revokeStaff(u){
  if (!u || !SEG_RE.test(u)) return;
  const str = JSON.stringify({ revoked: true }), p = { m: str, sig: cyrb(str), syncedAt: Date.now() };
  if (state.staff[u]) await db.doc("staff/" + u).update(p); else await db.doc("staff/" + u).set(p);
}

const appState = { doc: null, exists: false, loaded: false, err: "", info: "", canWriteOwn: true, justClaimed: false, remember: true, tries: 0, waitUntil: 0 };
const lockKey = () => "asb-unlock-" + state.myId;
function readUnlock(){ for (const st of ["localStorage", "sessionStorage"]) { try { const v = JSON.parse(window[st].getItem(lockKey()) || "null"); if (v) return v; } catch {} } return null; }
function writeUnlock(pinVer, remember){ try { (remember ? localStorage : sessionStorage).setItem(lockKey(), JSON.stringify({ pinVer })); } catch {} }
function clearUnlock(){ try { localStorage.removeItem(lockKey()); } catch {} try { sessionStorage.removeItem(lockKey()); } catch {} }
const myMirror = () => { try { return appState.doc?.m ? JSON.parse(appState.doc.m) : null; } catch { return null; } };

function loginScreen(kind, m){

      <label class="f check"><input type="checkbox" id="liRemember" name="remember" ${appState.remember ? "checked" : ""}> ${t("remember")}</label>

      ${appState.info ? `<p class="sub" style="margin:0">${esc(appState.info)}</p>` : ""}

      <button type="button" class="btn ghost sm" data-forgot style="align-self:center">${t("forgot")}</button>
    </form>`}
    ${kind === "login" ? `<div class="p-card"><div class="p-lbl">${t("code_title")}</div><p class="sub" style="margin:4px 0 8px">${t("code_hint")}</p>
      <div style="display:flex;gap:8px;align-items:center"><div class="p-code" id="myCode" style="flex:1">${esc(state.myId)}</div><button class="btn ghost sm" data-copycode>${t("copy")}</button></div></div>` : ""}

function renderEmployee(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("#app").hidden = true;
  const root = $("#emp"); root.hidden = false;
  let html;
  if (state.mode === "driverTest") { root.innerHTML = `<div class="phone full">${driverTestHtml()}</div>`; return; }
  const m = myMirror();
  if (state.offline) html = `<div class="p-login"><div class="mark">ASB</div><b>${t("offline")}</b></div>`;
  else if (!state.myId) html = `<div class="p-top" style="justify-content:flex-end"><div class="p-lang">${langMini()}</div></div><div class="p-login"><div class="mark">ASB</div><h1>${t("signin_needed")}</h1><p class="sub">${t("signin_needed_hint")}</p></div>`;
  else if (!appState.loaded) html = `<div class="p-login"><div class="mark">ASB</div><b>${t("loading")}</b></div>`;
  else if (m?.revoked) html = `<div class="p-top" style="justify-content:flex-end"><div class="p-lang">${langMini()}</div></div><div class="p-login"><div class="mark">ASB</div><h1>${t("deactivated")}</h1><p class="sub">${t("deactivated_hint")}</p></div>`;
  else if (!m) html = loginScreen("login");
  else {
    const u = readUnlock();
    if (!u || u.pinVer !== m.pinVer) html = loginScreen("unlock", m);
    else html = appScreens(m, { canDuty: appState.canWriteOwn, duty: appState.doc?.duty?.s });
  }
  root.innerHTML = `<div class="phone full">${html}</div>`;
}

function afterDoc(){
  const m = myMirror();
  if (m && !m.revoked && appState.justClaimed && appState.doc?.claim?.result === "ok") {
    writeUnlock(m.pinVer, appState.remember); appState.justClaimed = false; appState.err = "";
  }
}

async function writeOwn(data){
  const ref = db.doc("staff/" + state.myId);
  if (appState.exists) await ref.update(data); else await ref.set(data);
}

document.addEventListener("submit", async e => {
  if (e.target.id === "testForm") {
    e.preventDefault();
    const rid = $("#liIqama").value.trim(), pin = $("#liPin").value.trim();
    const hit = Object.entries(state.emp).find(([, x]) => x.residentId === rid && x.status === "ACTIVE");
    const ok = hit && hit[1].pinCheck && hit[1].pinCheck === await pinCheckOf(rid, pin);
    testState.err = ok ? "" : t("wrong_pin"); if (ok) { testState.id = hit[0]; state.appTab = "home"; state.appSlip = null; }
    return renderEmployee();
  }
  if (e.target.id !== "loginForm" && e.target.id !== "unlockForm") return;
  e.preventDefault();
  const rid = $("#liIqama").value.trim(), pin = $("#liPin").value.trim();
  appState.remember = $("#liRemember").checked; appState.err = ""; appState.info = "";
  if (!/^\d{10}$/.test(rid) || !/^\d{4}$/.test(pin)) { appState.err = t("required"); return renderEmployee(); }
  if (Date.now() < appState.waitUntil) { appState.err = t("wait", { n: Math.ceil((appState.waitUntil - Date.now()) / 1000) }); return renderEmployee(); }
  const hash = await pinCheckOf(rid, pin);
  if (e.target.id === "unlockForm") {
    const m = myMirror();
    if (m && hash === m.pinCheck) { appState.tries = 0; writeUnlock(m.pinVer, appState.remember); }
    else { appState.tries++; appState.err = t("wrong_pin"); if (appState.tries >= 5) { appState.waitUntil = Date.now() + 60000; appState.tries = 0; } }
    return renderEmployee();
  }
  try { appState.justClaimed = true; await writeOwn({ claim: { residentId: rid, hash, at: Date.now() } }); }
  catch (x) { console.warn(x); appState.canWriteOwn = false; appState.justClaimed = false; appState.err = t("app_cantwrite"); }
  renderEmployee();
});

async function payslipPdf(m, month){
  const s = m.payslips.find(x => x.month === month);
  const J = window.jspdf?.jsPDF;

/* A small document store over the `docs` table, same calls the panel already uses:
   db.doc("coll/id").get/set/update/delete/onSnapshot, db.collection("coll")[.where(f,"==",v)].onSnapshot */
function makeDb(){
  const cache = {};          // coll -> Map(id -> data)
  const loading = {};        // coll -> Promise
  const listeners = new Set();
  const snapDoc = (id, data) => ({ id, exists: data !== undefined, data: () => data });
  const deliver = coll => { for (const l of listeners) if (l.coll === coll) l.fire(); };

  async function load(coll){
    if (cache[coll]) return;
    loading[coll] ??= (async () => {
      const m = new Map(); let from = 0;
      for (;;) {
        const { data, error } = await sb.from("docs").select("id,data").eq("coll", coll).range(from, from + 999);
        if (error) throw error;
        data.forEach(r => m.set(r.id, r.data));
        if (data.length < 1000) break; from += 1000;
      }
      cache[coll] = m;
    })();
    await loading[coll];
  }

  let channel = null;
  function startRealtime(){
    if (channel) return;
    channel = sb.channel("asb-docs")
      .on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => {
        const row = p.eventType === "DELETE" ? p.old : p.new;
        if (!row?.coll || !cache[row.coll]) return;
        if (p.eventType === "DELETE") cache[row.coll].delete(row.id); else cache[row.coll].set(row.id, row.data);
        deliver(row.coll);
      })
      .subscribe(status => {
        // after a reconnect, reload what we hold so nothing is missed
        if (status === "SUBSCRIBED" && channel._asbWasDown) {
          channel._asbWasDown = false;
          for (const c of Object.keys(cache)) { delete cache[c]; delete loading[c]; load(c).then(() => deliver(c)).catch(console.warn); }
        }
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") channel._asbWasDown = true;
      });
  }

  const split = path => { const i = path.indexOf("/"); return [path.slice(0, i), path.slice(i + 1)]; };
  const local = (coll, id, data) => { if (cache[coll]) { if (data === undefined) cache[coll].delete(id); else cache[coll].set(id, data); deliver(coll); } };

  function doc(path){
    const [coll, id] = split(path);
    return {
      id, path,
      async get(){ await load(coll); return snapDoc(id, cache[coll].get(id)); },
      async set(data){
        const { error } = await sb.from("docs").upsert({ coll, id, data, updated_at: new Date().toISOString() });
        if (error) throw error; local(coll, id, data);
      },
      async update(patch){
        const { data, error } = await sb.rpc("docs_merge", { p_coll: coll, p_id: id, p_patch: patch });
        if (error) throw error; local(coll, id, data);
      },
      async delete(){
        const { error } = await sb.from("docs").delete().eq("coll", coll).eq("id", id);
        if (error) throw error; local(coll, id, undefined);
      },
      onSnapshot(next, err){
        const l = { coll, fire: () => next(snapDoc(id, cache[coll]?.get(id))) };
        listeners.add(l); startRealtime();
        load(coll).then(l.fire).catch(e => err?.(e));
        return () => listeners.delete(l);
      },
    };
  }
  function query(coll, filters){
    const match = d => filters.every(([f, , v]) => d?.[f] === v);
    return {
      where(f, op, v){ return query(coll, [...filters, [f, op, v]]); },
      onSnapshot(next, err){
        const l = { coll, fire: () => {
          const docs = [...(cache[coll] ?? new Map())].filter(([, d]) => match(d)).sort((a, b) => a[0] < b[0] ? -1 : 1).map(([i, d]) => snapDoc(i, d));
          next({ docs, size: docs.length, empty: !docs.length });
        } };
        listeners.add(l); startRealtime();
        load(coll).then(l.fire).catch(e => err?.(e));
        return () => listeners.delete(l);
      },
      doc: id => doc(coll + "/" + id),
    };
  }
  return { doc, collection: c => query(c, []) };
}

/* Browser file download (replaces the claude.ai downloads capability) */
downloads = {
  async save({ filename, data }){
    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith(".pdf") ? "application/pdf" : "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
};

const auth = { mode: "signin", msg: "", err: "", busy: false, session: null, role: null, admins: [] };
function renderAuth(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("#app").hidden = true; const root = $("#emp"); root.hidden = false;
  const up = auth.mode === "signup";
  root.innerHTML = `<div class="phone full"><div class="p-top" style="justify-content:flex-end"><div class="p-lang">${langMini()}</div></div>
  <div class="p-login">
    <div class="mark">ASB</div>
    <div><h1>${t("au_title")}</h1><p class="sub" style="margin:4px 0 0">${t("au_sub")}</p></div>
    <form id="authForm" novalidate style="display:flex;flex-direction:column;gap:12px">
      <label class="f">${t("au_email")}<input class="input" id="auEmail" type="email" autocomplete="username" required></label>
      <label class="f">${t("au_pass")}<input class="input" id="auPass" type="password" autocomplete="${up ? "new-password" : "current-password"}" minlength="8" required></label>
      ${auth.err ? `<p class="err" style="margin:0">${esc(auth.err)}</p>` : ""}${auth.msg ? `<div class="note" style="margin:0">${esc(auth.msg)}</div>` : ""}
      <button class="btn p-btn" ${auth.busy ? "disabled" : ""}>${up ? t("au_signup") : t("au_signin")}</button>
      ${up ? "" : `<button type="button" class="btn ghost sm" data-au="forgot" style="align-self:center">${t("au_forgot")}</button>`}
      <button type="button" class="btn ghost sm" data-au="${up ? "signin" : "signup"}" style="align-self:center">${up ? t("au_have") : t("au_new")}</button>
    </form>
  </div></div>`;
  try { const em = localStorage.getItem("asb-admin-email"); if (em) $("#auEmail").value = em; } catch {}
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-au]"); if (!b) return;
  const em = $("#auEmail")?.value.trim();
  auth.err = ""; auth.msg = "";
  if (b.dataset.au === "forgot") {
    if (!em) { auth.err = t("required"); return renderAuth(); }
    const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
    auth.msg = error ? error.message : t("au_reset_sent"); return renderAuth();
  }
  auth.mode = b.dataset.au; renderAuth(); if (em) $("#auEmail").value = em;
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "authForm") return;
  e.preventDefault();
  const email = $("#auEmail").value.trim(), password = $("#auPass").value;
  auth.err = ""; auth.msg = "";
  if (!email || password.length < 8) { auth.err = password.length < 8 ? t("au_short") : t("required"); return renderAuth(); }
  try { localStorage.setItem("asb-admin-email", email); } catch {}
  auth.busy = true; renderAuth(); $("#auEmail").value = email;
  if (auth.mode === "signup") {
    const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
    auth.busy = false;
    if (error) auth.err = error.message;
    else if (!data.session) { auth.msg = t("au_check"); auth.mode = "signin"; }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    auth.busy = false;
    if (error) auth.err = /confirm/i.test(error.message) ? t("au_unconfirmed") : t("au_err");
  }
  if (auth.err || auth.msg) { renderAuth(); $("#auEmail").value = email; }
});

/* Admins page (super admin adds other admin emails) */
async function loadAdmins(){
  const { data } = await sb.from("admins").select("email,role").order("created_at");
  auth.admins = data ?? []; if (view() === "admins") render();
}
function vAdmins(){
  const sup = auth.role === "SUPER_ADMIN";
  return `<div class="head"><div><h1>${t("admins_title")}</h1><p>${t("admins_hint")}</p></div></div>
  ${sup ? `<form class="filters" id="adminAdd"><input class="input" id="newAdmin" type="email" placeholder="${t("au_email")}" required>
     <select class="input" id="newRole"><option value="SUB_ADMIN">${t("role_SUB_ADMIN")}</option><option value="SUPER_ADMIN">${t("role_SUPER_ADMIN")}</option></select>
     <button class="btn">+ ${t("admins_add")}</button></form>` : ""}
  <section class="panel"><div class="scroll"><table><thead><tr><th>${t("au_email")}</th><th>${t("status")}</th><th></th></tr></thead><tbody>
  ${auth.admins.map(a => `<tr><td>${esc(a.email)}</td><td><span class="pill ${a.role === "SUPER_ADMIN" ? "p-info" : "p-mute"}">${t("role_" + a.role)}</span></td>
    <td class="r">${sup && a.email !== auth.session?.user?.email ? `<button class="btn ghost sm" data-deladmin="${esc(a.email)}">${t("remove")}</button>` : ""}</td></tr>`).join("")}
  </tbody></table></div></section>
  <form class="panel" id="pwForm" style="margin-top:16px"><h2>${t("pw_title")}</h2>
    <div class="rules"><label class="f">${t("pw_new")}<input class="input" id="pwNew" type="password" autocomplete="new-password" minlength="8" required></label>
    <label class="f">${t("pw_again")}<input class="input" id="pwAgain" type="password" autocomplete="new-password" minlength="8" required></label></div>
    <div class="dlg-f"><button class="btn">${t("save")}</button></div></form>`;
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "pwForm") return; e.preventDefault();
  const a = $("#pwNew").value, b = $("#pwAgain").value;
  if (a.length < 8) return toast(t("au_short"));
  if (a !== b) return toast(t("pw_mismatch"));
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) toast(error.message); else { toast(t("pw_done")); e.target.reset(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "adminAdd") return; e.preventDefault();
  const email = $("#newAdmin").value.trim().toLowerCase(), role = $("#newRole").value;
  if (!email) return;
  const { error } = await sb.from("admins").upsert({ email, role });
  if (error) toast(t("dbErr")); else { toast(t("empSaved")); loadAdmins(); }
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-deladmin]"); if (!b) return;
  const { error } = await sb.from("admins").delete().eq("email", b.dataset.deladmin);
  if (error) toast(t("dbErr")); else loadAdmins();
});
document.addEventListener("click", async e => { if (e.target.closest("[data-signout-admin]")) { await sb.auth.signOut(); location.hash = ""; } });

let started = false;
async function startAdmin(session){
  auth.session = session;
  const { data: role, error } = await sb.rpc("my_admin_role");
  if (error || !role) { auth.err = t("au_notadmin"); await sb.auth.signOut(); return renderAuth(); }
  auth.role = role;
  if (started) return; started = true;
  state.mode = "admin"; state.canWrite = true;
  $("#emp").hidden = true; $("#app").hidden = false;
  db = makeDb();
  let loaded = 0; const done = () => { if (++loaded >= 3 && !state.ready) { state.ready = true; render(); } };
  db.collection("employees").onSnapshot(s => { state.emp = docsMap(s); done(); soon(); }, console.warn);
  db.collection("fines").onSnapshot(s => { state.fines = docsMap(s); done(); soon(); }, console.warn);
  db.collection("advances").onSnapshot(s => { state.adv = docsMap(s); done(); soon(); }, console.warn);
  db.doc("config/rules").onSnapshot(s => { state.rules = { ...DEFAULT_RULES, ...(s.exists ? s.data() : {}) }; soon(); }, console.warn);
  db.doc("daily/" + todayKey()).onSnapshot(s => { state.todayDoc = s.exists ? s.data() : null; soon(); }, console.warn);
  db.collection("duty").onSnapshot(s => { state.duty = docsMap(s); soon(); }, console.warn);
  db.collection("presence").onSnapshot(s => { state.presence = docsMap(s); calmRender(); }, console.warn);
  db.collection("pinreq").onSnapshot(s => { state.pinreq = docsMap(s); soon(); }, console.warn);
  db.collection("payroll").onSnapshot(s => { state.payroll = docsMap(s); soon(); }, console.warn);
  db.collection("daily").onSnapshot(s => { state.dailyAll = docsMap(s); soon(); }, console.warn);
  db.collection("totals").onSnapshot(s => { state.totals = docsMap(s); soon(); }, console.warn);
  let perfCleaned = false;
  db.collection("perf").onSnapshot(s => { state.perf = docsMap(s); if (!perfCleaned) { perfCleaned = true; cleanupPerf(); } soon(); }, console.warn);
  loadAdmins();
  render();
}

async function boot(){
  const { data } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "SIGNED_OUT") { started = false; location.reload(); return; }
    if (ev === "PASSWORD_RECOVERY") { location.hash = "admins"; setTimeout(() => { toast(t("pw_set")); $("#pwNew")?.focus(); }, 1500); }
    if (session && (ev === "SIGNED_IN" || ev === "INITIAL_SESSION")) startAdmin(session);
  });
  if (data.session) startAdmin(data.session); else renderAuth();
}
boot();
</script>

</body></html>
